openapi: 3.1.0
info:
  title: traffic-twin admin API
  version: 1.23.0
  description: |
    Back-office API of tt-core, used by the UI. Everything here works on **zone B** data (shapes, tokens,
    aggregates) or on synthetic outputs. Source-facing Fleet endpoints are in `fleet-api.v1.openapi.yaml`;
    the two files do not overlap.

    Served on the **admin/UI listener** of tt-core (default `127.0.0.1:7070`, TLS mandatory when not on
    loopback). All paths live under `/api/v1/`, plus the unauthenticated probes `/healthz` and `/readyz`.
    Implementation notes for the auth endpoints are in `internal/server/README.md`.

    **Authentication.** Server-side sessions only (no bearer tokens for humans). Local login, first-run setup
    with a one-time `tts_…` token printed on stdout, or OIDC (authorization code + PKCE S256, state, nonce).
    A successful login sets the cookie `__Host-tt_session` (`tt_session` on a plain-HTTP loopback listener):
    HttpOnly, Secure, SameSite=Strict, Path=/, no Max-Age; idle timeout 30 min, absolute 12 h (configurable).
    Every unsafe call (POST, PUT, PATCH, DELETE) on an authenticated route must send the header
    `X-CSRF-Token` with the value returned by `GET /api/v1/auth/me`; cross-origin unsafe requests are refused
    (`403 cross_origin`). Request bodies are `application/json`, strict (unknown fields rejected).
    Errors: `{"code": "...", "message": "..."}`. Machine clients never use this API: sources use the Fleet API
    with mTLS client certificates.

    **Authorization.** Each operation lists the roles allowed in `x-tt-roles` ("at least one of").
    **`admin` implies all**: `admin` is the superuser and satisfies every `x-tt-roles` list, also where it is not
    written (1.6.0). The other roles are flat: `operator` (sources, onboarding, kill switch, worlds, pack builds),
    `rule-reviewer` (rules), `policy-approver` (policy and quarantine approvals), `publisher` (publish/download packs,
    exports), `auditor` (audit logs, read-only views), `event-exporter` (event-level export, zone B only). Roles are
    re-read on every request. In tt-core the author of a policy change never counts as an approver; changes that open
    data need `opening_required` (default 2) distinct `policy-approver`s, closing ones need 1, and an `admin` may
    approve alone with a reason (docs/spec/policy.md §5, `approval-settings`). tt keyguard verifies approvals again
    when signing.

    **Admin overrides: traced, not refused (1.6.0).** An admin can act alone but never invisibly. Every call an admin
    makes that changes something (or downloads a file) on an operation whose `x-tt-roles` the admin satisfies only
    because admin implies all is audited as `authz.admin_override` (route pattern, `roles_required`, status), besides
    the operation's own entry, which carries `admin_override: "true"` where the operation names one (pack download and
    export, event export and download, rules, quarantine). Approving a policy and publishing a pack keep the admin
    approval of keyguard (mandatory `reason`, `approval_mode: admin`, alerts `policy.admin_approval` /
    `pack.admin_approval`); an admin's quarantine resolution takes effect alone (`quarantine.admin_override`, alert for
    a dismissal); an admin's event export or download of someone else's export is alerted. Roles: any combination is
    accepted and an admin may grant roles to itself; a non-admin never grants roles (`403 forbidden`). Granting a
    sensitive role (`admin`, `policy-approver`, `event-exporter`) is audited as `user.sensitive_role` (with
    `self_grant` for a grant to oneself) and notified to the webhooks (`keyguard.alert` with
    `alert: user.sensitive_role`). The only way to limit admins is keyguard's `TT_KEYGUARD_ADMIN_OVERRIDE=false`, an
    installer's choice: admins then cannot approve policies or publish packs alone. When a quorum is evaluated,
    earlier approvals of users now disabled or no longer entitled are dropped, and keyguard receives the approvers'
    current roles.

    Every mutating call is written to the audit log (append-only, hash-chained). No endpoint returns real payload
    values: there are none in zone B.

    **Errors.** Every error body is `{"code", "message"}` with a stable `code` and a fixed message that never echoes
    request values. Status codes used by all areas: `400 bad_request` (malformed JSON, wrong Content-Type, unknown field,
    body too large; some packages use `invalid_input` instead of `bad_request`), `401 unauthenticated`, `403 forbidden`
    (missing role) / `csrf` / `cross_origin`, `404 not_found`, `405 method_not_allowed`, `409` (state conflict, the code
    names it), `422` (validation, the code names the field), `429 rate_limited`, `502`/`503` (keyguard or a dependency).
    Operations list the codes specific to them.

    **Jobs.** The long operations `buildArchetypes`, `generateWorld`, `buildPack`, `runExport`, `exportEvents` and the
    extension `mineRules` answer `202` with a `Job` (`createSnapshot` too since 1.12.1, when slower than the wait; a quick one
    still answers `201` with the snapshot). Since 1.9.0 they are waited for at most about 20 seconds (two thirds
    of `admin.http.write_timeout` when shorter): an operation finished by then answers the final `Job` as before
    (`status` `done`, `result` with the outcome; a failure is an error response), a longer one (large installations:
    mining millions of events) answers `status: running` and goes on in the background; clients then poll
    `GET /api/v1/jobs/{job_id}` until `done` (with `result`) or `failed` (with `error`, the code of the error response).
    `purgeStore` always answers `running` and reports `progress`. `GET /api/v1/jobs/{job_id}` returns a job for a while
    after it ran, to its owner, an admin or an auditor (otherwise `404`).

    **Who approves (1.15.0).** `getGroupApprovers` names the people who can approve the policy drafts of a group
    (`policy-approver`s and admins, usernames and display names only) for the group's members, so a developer whose
    draft opens values knows whom to ask. The `setup` of a new mock token also has `cli` (the `tt mock --console`
    command of the kit) and `version`; with an https console its Docker and tt commands pass `--console-ca`.

    **Usability test 4 (1.16.0).** The automatic observe versions go on after a person's change (new identifier fields and services only,
    never over a person's choice; `setObserveAuto` turns them off per group); `listServices` and `listContracts` mark an old
    `host:<pattern>` entry with `replaced_by` and the pack build leaves it out by default (docs/spec/policy.md §7.4, sanitizer.md §3.5).

    **Usability test 5 (1.17.0).** An approved rule that a newer approved rule replaces (`supersedes`, or the same mined
    signature) becomes `superseded` at the approval: it keeps its history and leaves the packs (`superseded_by` names the new
    one); `retireRule` takes an approved rule out of the active set on a reviewer's decision (status `rejected`, `retired: true`);
    `withdrawPolicy` lets the proposer (or an admin) take back a pending policy draft (status `rejected`, `withdrawn: true`).

    **Codes with digits and bodies (1.22.0, spec v1.19).** Field actions may be `code(alnum)` (short codes with digits
    or of one character, sanitizer.md §5.6): the policy assistant and the observe version propose it on code-like names
    and a person may choose it on any field that is not a credential or a personal name (policy.md §1.5).
    `QuarantineItem.alert` is `value_cardinality` for a kept or code field with more than 50 distinct values. Contracts
    of XML and SOAP bodies carry `x-tt-xml` (fmt and namespaces); a SOAP exchange is a logical operation
    `<op>#<name>` like a GraphQL one (event.md §6).

    **Generic user identity (1.19.0).** Who the user is comes from the data, not from a list of header names:
    `getObserveStatus` and `policyAssistant` rank the request headers (and cookies) of the inbound calls with the signals of
    the automatic detection (`identity_candidates`, `identity_best`); `setIdentity` lets a person choose any header (or a JWT
    claim, or a cookie): any header that is not a credential applies at once (docs/spec/policy.md §7.1, §7.4).
    The rules status gives the figures of the selected groups (`groups`, `events`, `events_total`) and, per candidate, whether
    its values are already in clear (`values`, `clear_fields`), so the console asks for a policy approval only for fields
    that are still dropped. The rule editor catalog is scoped to the selected groups' own traffic and built from the stored
    contract snapshots (fast). Drift alerts carry `params` (names and figures) next to `change_kind`, and a manual contract
    refresh no longer raises compatible alerts. `PackInfo.warnings` reports a pack built on little traffic
    (`few_observations`, with counts). `listHosts` shows a host declared since once (`folded_from`) and has `counts`.

    **Teams and worlds (1.14.0).** The miner mines each group's traffic apart: two teams creating an `order` get two
    entities (`order` and `order-orders-api`, names kept across runs; rules.md 2.7). `generateWorld` answers `422
    no_usable_rules` with `details` when the group has approved rules and none can be used, and `WorldInfo.excluded_rules`
    lists the group's rules a world left out; a failed job carries the `details` of its error.

    **Heavy jobs (1.13.0).** Mining, archetypes, worlds, packs, exports, contract snapshots and `prepareMock` read up to
    millions of events and hold a large part of them in memory: they run a few at a time (one on a host with less than
    16 GiB), in arrival order. One that has to wait answers `status: queued` and becomes `running` when its turn comes
    (the scheduled mining and contract snapshots wait in the same queue). A `mineRules` request while a mining job is
    queued or running joins it: the answer is that same job (one run, readable by every operator who asked). The result
    kept in a job is bounded: `mineRules` keeps at most 200 entity and 200 rule diagnostics (`entities_total`,
    `rule_diagnostics_total` when cut; all of them at `GET /api/v1/rules/status`), and an answer larger than 16 MiB fails
    with `result_too_large`. `GET /api/v1/jobs` lists the jobs, queued and running ones included.

    **Mocks (1.12.0).** `/api/v1/mocks` is the registry of the mocks connected to the console (`tt mock --console`):
    mock tokens, "Prepara e avvia il mock" (`prepareMock`: archetypes, world, pack, publication, mock in one job), the
    mocks tt-core starts in Kubernetes, their last calls and the control commands queued for them. The mocks
    themselves use `/api/v1/mock-agent/*` with a mock token (security `mockToken`), never a session.

    **Implementation status.** Every operation of this file is mounted by tt-core; `x-tt-status` is no longer used.
    Operations marked `(extension)` in their summary are served by tt-core beyond the earlier contract:
    `POST /api/v1/rules/mine` and `GET /api/v1/events/export/{job_id}/download`.

    **Settings.** `GET /api/v1/settings` shows what the installation runs with. Only two labels can be changed at run
    time (`PATCH`, admin, audited): the installation name and the environment label. Everything that bears on security
    (k thresholds, session timeouts, SSO, local accounts, approvals) is configuration-file or keyguard state: the API
    shows it read-only and a `PATCH` naming any other field is refused (`400`, unknown field).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://tt-core.internal:7070
security:
  - session: []
tags:
  - name: auth
    description: Login, logout and the current user.
  - name: users
    description: Users and roles.
  - name: fleet
    description: Groups, enrollment tokens, sources, kill switch.
  - name: policies
    description: Policy drafts, approvals, rollback and the policy assistant.
  - name: discovery
    description: Services and hosts seen in events.
  - name: contracts
    description: Inferred contracts, snapshots, drift and gaps.
  - name: rules
    description: Rule review and approval.
  - name: worlds
    description: Archetypes and synthetic worlds.
  - name: packs
    description: Twin packs and the publication gate.
  - name: exports
    description: Exports to WireMock, Microcks and Prism.
  - name: scenarios
    description: Forced rule outcomes and scenario presets.
  - name: mocks
    description: Mocks connected to the console (Mock page), mock tokens, managed mocks in Kubernetes and the agent API of `tt mock --console`.
  - name: quarantine
    description: Fields, names, segments and hosts in quarantine.
  - name: webhooks
    description: Alert destinations.
  - name: store
    description: Retention and purge of the event store.
  - name: audit
    description: Append-only audit logs.
  - name: events
    description: Event-level export inside zone B.
  - name: system
    description: Jobs, health, version and settings.
paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        "200": { description: 'Process alive.' }
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness
      security: []
      responses:
        "200": { description: 'Database and registered checks (e.g. keyguard reachability) are ready.' }
        "503":
          description: Not ready; the body lists only the names of the failed checks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  failed: { type: array, items: { type: string } }
  /api/v1/auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Login options
      security: []
      responses:
        "200":
          description: What the login page should show.
          content:
            application/json:
              schema:
                type: object
                required: [local, oidc, setup_required]
                properties:
                  local: { type: boolean }
                  oidc: { type: boolean }
                  setup_required: { type: boolean }
  /api/v1/setup:
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first admin
      security: []
      description: One-time first-run setup with the `tts_…` token printed on stdout (valid 24 h, replaced at each restart until used). Rate-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, username, password]
              properties:
                setup_token: { type: string, maxLength: 128 }
                username: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 256 }
      responses:
        "201":
          description: Admin created, session cookie set; body as /auth/me.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: 'invalid_setup_token', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'setup_done', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Local login
      security: []
      description: 'Rate-limited per client and, since 1.4.1, per account: after 10 failed logins for a username (known or not) every attempt for it, also with the right password, is `429 rate_limited` with Retry-After until the counter refills (one attempt every 2 minutes); a successful login clears it. The same `invalid_credentials` answer is given for unknown user, wrong password and disabled user. A new session id is issued at every login.' 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Session cookie set; body as /auth/me.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { description: 'invalid_credentials', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout
      x-tt-roles: [any]
      responses:
        "204": { description: 'Session deleted and cookie cleared.' }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user
      x-tt-roles: [any]
      responses:
        "200":
          description: Identity, roles, CSRF token and expiries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/oidc/start:
    get:
      tags: [auth]
      operationId: oidcStart
      summary: Start OIDC login
      security: []
      parameters:
        - { name: return_to, in: query, schema: { type: string, pattern: "^/[^/]", description: 'Local path only.' } }
      responses:
        "302": { description: 'Redirect to the identity provider (code + PKCE S256, state, nonce).' }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: OIDC callback
      security: []
      description: |
        Verifies state (bound to the browser by the `__Host-tt_oidc` cookie), exchanges the code, verifies the ID token
        and creates the session. On error redirects to `/?auth_error=<code>` with one of: idp_error, state_mismatch,
        state_invalid, idp_unavailable, exchange_failed, no_id_token, id_token_invalid, nonce_mismatch, at_hash_mismatch,
        claims_invalid, user_disabled, internal. The provider's error text is never reflected.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: 'Session cookie set and redirect to return_to, or redirect with auth_error.' }
  /api/v1/auth/oidc/stepup:
    get:
      tags: [auth]
      operationId: oidcStepUp
      summary: Start an approval step-up
      x-tt-roles: [any]
      description: |
        **Approval step-up (1.5, red team round 3).** When keyguard verifies approvals with OIDC
        (`approvals_unverified: false`), every approval — policy version, pack publication, quarantine dismissal —
        needs an ID token minted for that one change. This browser navigation (signed-in OIDC user) computes
        `nonce = base64url(SHA-256("tt.approve/v1" 0x00 purpose 0x00 fields joined by 0x00))` from the change
        (policy: `policy_id`, `version`, SHA-256 of the body that will be signed without `issued_seq`, `created_at`,
        `not_after`; pack: `pack_id`, SHA-256 of `manifest.json`; quarantine: item id), and redirects to the provider
        with the **approval client** (`auth.oidc.approval_client_id`, keyguard's `TT_KEYGUARD_OIDC_AUDIENCE`, never the
        login client), PKCE, `prompt=login` and `max_age=600`. The UI does this transparently when an approval answers
        `403 stepup_required`. Errors redirect to `return_to?stepup_error=<code>`: stepup_disabled, oidc_required (local
        account), invalid_request, not_found, not_approvable, oidc_unavailable, busy.
      parameters:
        - { name: purpose, in: query, required: true, schema: { enum: [policy-approve, pack-publish, quarantine-dismiss] } }
        - { name: ref, in: query, required: true, schema: { type: string, maxLength: 200 }, description: '`<policy_id>/<version>`, `<pack_id>` or `q-<n>`.' }
        - { name: return_to, in: query, schema: { type: string, pattern: "^/[^/]", description: 'Local path only.' } }
      responses:
        "302": { description: 'Redirect to the identity provider, or back with stepup_error.' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/oidc/stepup/callback:
    get:
      tags: [auth]
      operationId: oidcStepUpCallback
      summary: Approval step-up callback
      security: []
      description: |
        Verifies state (cookie `__Host-tt_stepup`), exchanges the code with the approval client and verifies the ID token:
        signature, `iss`, `aud` (approval client), `nonce` (the change), `auth_time` at most 10 minutes old, and `iss`/`sub`
        equal to the approver's own OIDC identity. The token is then held **in memory only**, for at most 10 minutes, for the
        next approval request of the same user for the same change, and consumed by it; it is never stored in the database
        and no session is created. Redirects to `return_to?stepup=ok`, or `return_to?stepup_error=<code>` with one of:
        stepup_disabled, idp_error, state_mismatch, state_invalid, user_invalid, idp_unavailable, exchange_failed,
        no_id_token, id_token_invalid, nonce_mismatch, subject_mismatch, stale_authentication.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: 'Redirect to return_to with stepup=ok or stepup_error.' }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      x-tt-roles: [admin, auditor]
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a local user
      x-tt-roles: [admin]
      description: 'Creates a local account (password of 12 to 256 characters). OIDC users are created at their first login, not here. Granting a sensitive role (admin, policy-approver, event-exporter) is audited (`user.sensitive_role`) and notified to the webhooks (`keyguard.alert`, `alert: user.sensitive_role`, identifiers only). Any combination of roles is accepted (admin implies all; since 1.6.0 there is no `sod_conflict`).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: 'invalid_input: username or password not valid; invalid_role; bad_request: malformed body.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'user_exists.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'local_disabled: local accounts are disabled in the configuration.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/users/{user_id}:
    parameters: [ { $ref: "#/components/parameters/UserId" } ]
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change roles, disable, reset password
      x-tt-roles: [admin]
      description: 'Granting a sensitive role (admin, policy-approver, event-exporter) is audited (`user.sensitive_role`) and notified to the webhooks as `keyguard.alert` with `alert: user.sensitive_role` (identifiers only). Since 1.6.0 any combination of roles is accepted and an admin may grant roles to itself (traced: `self_grant: "true"` in `user.update` and `user.sensitive_role`, and in the alert); only admins reach this operation, so a non-admin never grants roles. Removing your own admin role is refused (`self_lockout`). Disabling a user or changing the password deletes the user''s sessions. With OIDC `roles_claim` configured, roles of OIDC users are synchronised at login and cannot be changed here.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
                disabled: { type: boolean }
                password: { type: string, maxLength: 256, writeOnly: true }
                revoke_sessions: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: 'invalid_input: password length; invalid_role; bad_request: malformed body.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'not_found: unknown user.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'self_lockout: disabling yourself or removing your own admin role; not_local: a password for an OIDC user; roles_from_idp: roles are synchronised from the identity provider.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete user (refused)
      x-tt-roles: [admin]
      description: 'Users are referenced by the audit chain and by approvals, so they are never deleted: disable them with PATCH and disabled true.'
      responses:
        "409": { description: 'use_disable: always returned, the user is kept.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- fleet
  /api/v1/fleet/groups:
    get:
      tags: [fleet]
      operationId: listGroups
      summary: List source groups
      x-tt-roles: [operator, auditor, policy-approver]
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Group" } }
    post:
      tags: [fleet]
      operationId: createGroup
      summary: Create group
      x-tt-roles: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "409": { description: 'group_exists', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_group, invalid_description, invalid_policy_id, invalid_services, invalid_sampling.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    get:
      tags: [fleet]
      operationId: getGroup
      summary: Get group
      x-tt-roles: [operator, auditor, policy-approver]
      responses:
        "200":
          description: Group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    put:
      tags: [fleet]
      operationId: updateGroup
      summary: Update group
      x-tt-roles: [operator]
      description: |
        Changing `policy_id` re-targets the policy (new signed version with this group in `targets.groups`):
        adding a group is an opening change and goes through the approval flow; the response reports the draft.
        Setting `policy_id` to `null` stops the capture of the group's sources at once: tt-core serves it no policy and
        sends `min_issued_seq` beyond every policy signed so far in its heartbeat. While other groups remain on the
        policy, a closing draft without this group (origin `retarget`, one approval) is created and reported in
        `policy_draft`; when none remains the policy is no longer renewed and lapses at its `not_after`.
        `sampling_override_bp` can only lower the rate. Adding allowed service names is audited.
        The body is the whole group; `name` must equal the path (`422 name_mismatch`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "200":
          description: Updated. When a policy draft was created, `policy_draft` names it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'name_mismatch or the codes of createGroup.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/enrollment-tokens:
    get:
      tags: [fleet]
      operationId: listEnrollmentTokens
      summary: List enrollment tokens
      x-tt-roles: [operator, auditor]
      responses:
        "200":
          description: Tokens (secrets are never returned again).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EnrollmentTokenInfo" } }
    post:
      tags: [fleet]
      operationId: createEnrollmentToken
      summary: Create enrollment token
      x-tt-roles: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, group, token_type]
              properties:
                kind: { $ref: "#/components/schemas/TokenKind" }
                group: { $ref: "#/components/schemas/GroupName" }
                token_type: { enum: [one_time, group], description: 'one_time: 1 use, expiry ≤ 24 h. group: unlimited uses for replicated deployments, expiry ≤ 365 d, revocable.' }
                expires_in_s: { type: integer, minimum: 60, maximum: 31536000, default: 3600 }
      responses:
        "201":
          description: Token (shown once) and ready-to-paste install snippets for the onboarding wizard.
          content:
            application/json:
              schema:
                type: object
                required: [token_id, token, expires_at, snippets]
                properties:
                  token_id: { type: string, pattern: "^tok-[0-9A-Za-z]{1,32}$" }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  snippets:
                    type: array
                    items:
                      type: object
                      required: [title, language, text]
                      properties:
                        title: { type: string }
                        language: { enum: [bash, yaml, dockerfile, text] }
                        text: { type: string }
        "422": { description: 'invalid_kind, invalid_expiry, invalid_token_type (also: a `k8s-inject` token that is not a group token), unknown_group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/enrollment-tokens/{token_id}:
    parameters: [ { $ref: "#/components/parameters/TokenId" } ]
    delete:
      tags: [fleet]
      operationId: revokeEnrollmentToken
      summary: Revoke enrollment token
      x-tt-roles: [operator]
      responses:
        "204": { description: 'Revoked; sources already enrolled keep their certificate.' }
        "404": { description: 'Unknown token.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/onboarding/{token_id}/status:
    parameters: [ { $ref: "#/components/parameters/TokenId" } ]
    get:
      tags: [fleet]
      operationId: getOnboardingStatus
      summary: Onboarding status
      x-tt-roles: [operator]
      description: 'Live status for the wizard step "waiting for data". Poll, or send `Accept: text/event-stream`: the server then sends an `event: status` message with the JSON status every 2 s for at most 10 minutes.'
      responses:
        "200":
          description: Progress of the sources enrolled with this token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStatus" }
            text/event-stream:
              schema: { type: string }
  /api/v1/fleet/sources:
    get:
      tags: [fleet]
      operationId: listSources
      summary: List sources
      x-tt-roles: [operator, auditor]
      parameters:
        - { name: group, in: query, schema: { $ref: "#/components/schemas/GroupName" } }
      responses:
        "200":
          description: Enrolled sources with their latest health.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SourceStatus" } }
  /api/v1/fleet/sources/{source_id}:
    parameters: [ { $ref: "#/components/parameters/SourceId" } ]
    get:
      tags: [fleet]
      operationId: getSource
      summary: Get source
      x-tt-roles: [operator, auditor]
      responses:
        "200":
          description: Source details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceStatus" }
  /api/v1/fleet/sources/{source_id}/revoke:
    parameters: [ { $ref: "#/components/parameters/SourceId" } ]
    post:
      tags: [fleet]
      operationId: revokeSource
      summary: Revoke source
      x-tt-roles: [operator]
      responses:
        "204": { description: 'Certificate revoked; intake rejects the source from now on.' }
  /api/v1/fleet/sources/{source_id}/sampling:
    parameters: [ { $ref: "#/components/parameters/SourceId" } ]
    put:
      tags: [fleet]
      operationId: setSourceSampling
      summary: Lower sampling for one source
      x-tt-roles: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sampling_override_bp]
              properties:
                sampling_override_bp: { type: [integer, "null"], minimum: 0, maximum: 10000, description: 'null removes the override; values above the policy rate are ignored.' }
      responses:
        "204": { description: 'Delivered at the next heartbeat.' }
        "404": { description: 'Unknown source.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_sampling (missing, not an integer or null, outside 0..10000).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/kill:
    post:
      tags: [fleet]
      operationId: setKillSwitch
      summary: Kill switch
      x-tt-roles: [operator]
      description: Emergency stop for all sources, a group or one source. Delivered at the next heartbeat and persisted by sources; intake also starts rejecting. Turning it off is audited and notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active, scope]
              properties:
                active: { type: boolean }
                scope:
                  type: object
                  oneOf:
                    - { type: object, additionalProperties: false, required: [all], properties: { all: { const: true } } }
                    - { type: object, additionalProperties: false, required: [group], properties: { group: { $ref: "#/components/schemas/GroupName" } } }
                    - { type: object, additionalProperties: false, required: [source_id], properties: { source_id: { type: string } } }
      responses:
        "204": { description: 'Kill switch updated.' }
        "404": { description: 'Unknown group or source.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_kill (active or scope missing) or invalid_scope (scope must be exactly one of the three forms).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- policies
  /api/v1/fleet/policies:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [policies]
      operationId: listPolicies
      summary: List policies
      x-tt-roles: [operator, policy-approver, auditor]
      responses:
        "200":
          description: Policies with their versions and pending drafts.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PolicyVersion" } }
    post:
      tags: [policies]
      operationId: proposePolicy
      summary: Propose policy
      x-tt-roles: [operator, policy-approver]
      description: |
        Submits an author policy (tt.policy/v1, YAML or JSON). tt-core validates, compiles and classifies the diff against
        the active version as closing or opening (docs/spec/policy.md §5) and as observe-safe or opening values (§7,
        1.10.0). An observe-safe change (`opens_values: false`, `approvals_required: 0`) applies at once: keyguard signs it
        without approvals (`approval_mode: observe`) and the answer is the active version. Any other change is a draft.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
          application/json:
            schema: { $ref: "../schemas/policy.v1.schema.json" }
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "413": { description: 'too_large: the document exceeds the size limit.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: 'unsupported_media_type: Content-Type must be application/yaml or application/json.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_policy (the message names the rule of docs/spec/policy.md §1.4 that failed) or no_target_groups when no group is bound to the policy_id.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/classify:
    post:
      tags: [policies]
      operationId: classifyPolicy
      summary: Classify a policy change without storing it (1.10.0)
      x-tt-roles: [operator, policy-approver]
      description: |
        Same body as `proposePolicy`. Compares the policy with the active version and with the policy each bound group runs
        now (docs/spec/policy.md §7): `opens_values: false` means the change would apply at once, without approval
        ("Questa modifica non apre dati: si applica subito"); otherwise `value_reasons` lists why it opens values (codes and
        locations, never values) and `approvals_required` how many approvals it needs. keyguard recomputes the verdict
        when it signs.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
          application/json:
            schema: { $ref: "../schemas/policy.v1.schema.json" }
      responses:
        "200":
          description: Classification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyClassification" }
        "413": { description: 'too_large.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: 'unsupported_media_type.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_policy.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}/observe:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    get:
      tags: [policies]
      operationId: getObserveStatus
      summary: Live state of the observe phase of a group (1.10.0)
      x-tt-roles: [operator, policy-approver, auditor]
      description: |
        What the onboarding wizard shows while it listens (docs/spec/policy.md §7): the phase (`no_policy`, `waiting_approval`,
        `listening` under the starter policy, `masked` once the automatic observe version is active, `managed` once a person
        signed another change), when capture started and when the observe version is due, the calls seen, the services
        discovered, the fields turned into tokens (`masked`: names and HMAC domains, never values), the identity and the
        sampling advice for k-anonymity.
      responses:
        "200":
          description: Observe state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObserveStatus" }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [policies]
      operationId: setObserveAuto
      summary: Turn the automatic observe versions of a group on or off (1.16.0)
      x-tt-roles: [operator, policy-approver]
      description: |
        `{"auto": false}`: tt-core derives nothing by itself for the policies bound to the group (the versions already signed
        stay). Default on. Audited as `fleet.group_observe_auto`. The answer is the observe state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto]
              additionalProperties: false
              properties:
                auto: { type: boolean }
      responses:
        "200":
          description: Observe state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObserveStatus" }
        "400": { description: 'invalid_input: auto missing.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}/identity:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    put:
      tags: [policies]
      operationId: setIdentity
      summary: Choose who the user is for the group's policy (1.19.0)
      x-tt-roles: [operator, policy-approver]
      description: |
        Sets (or replaces) identity.subject of the group's policy: a request header of any name, optionally a claim of
        the JWT it carries, or a cookie (docs/spec/policy.md §7.1, §7.4). The value never leaves in clear: the source
        sends it as an HMAC token. Any header that is not a credential, and any claim of the bearer JWT in
        `authorization`, is observe-safe: the version applies at once, without approvals (keyguard recomputes the
        verdict). A cookie, a credential header, or a credential-like name (token, secret, session, key...) without a
        claim waits for the opening approvals. The version is proposed like any draft and the choice is audited as
        `policy.identity_set` (names only). The answer is the version: `active` when it applied, `draft` otherwise.
        tt-core never replaces the person's choice with an automatic one afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                from: { enum: [header, cookie], default: header }
                name: { type: string, description: 'Header names are matched case-insensitively and stored in lower case.' }
                jwt_claim: { type: string, description: 'A top-level claim of the JWT the value carries (bearer prefix removed), e.g. `sub`.' }
                json_path: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}(\\.[A-Za-z0-9_-]{1,64}){0,7}$", description: '1.21.0: a dotted path of members inside a header whose value is a JSON object (or base64 of one), e.g. `user.id`. Header only, excludes jwt_claim; observe-safe like a claim (a credential-like header name too). Sources older than spec v1.18 (today every SDK but Go) reject the body and keep the previous policy.' }
      responses:
        "200":
          description: The new version (active when observe-safe, a draft otherwise).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'no_policy: the group has no policy yet; stale_draft.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_identity, no_change (the policy already reads the user from there).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}/families:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    put:
      tags: [policies]
      operationId: setFamily
      summary: Join HMAC domains of the group's policy into a family (1.21.0)
      x-tt-roles: [operator, policy-approver]
      description: |
        Sets (or replaces) one family of `hmac.families` of the group's policy (docs/spec/policy.md §1.7): every
        `hmac(d)` with `d` among `domains` compiles to `hmac(<family>)`, so equal values give equal tokens in all the
        joined fields (`clientId` and `customerId` become one identifier for the miner). The compiled body keeps its shape:
        sources need no change. Changing HMAC domains opens no value (policy.md §7.1): the version applies at once
        (keyguard recomputes the verdict). The candidates come from the miner (`families` of `getRulesStatus`), judged
        from structure only. Audited as `policy.families_set` (names only). The answer is the version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [family, domains]
              properties:
                family: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$", description: 'The domain the members compile to; not reserved (subject, sample, sample-trace, discovery).' }
                domains: { type: array, minItems: 2, maxItems: 16, uniqueItems: true, items: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$" } }
      responses:
        "200":
          description: "The new version, active: the change is observe-safe."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'no_policy: the group has no policy yet; domain_in_family: a domain is already in another family; stale_draft.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_family (bad or reserved name, fewer than 2 or more than 16 domains), no_change.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}/families/{family}:
    parameters:
      - { $ref: "#/components/parameters/Group" }
      - { name: family, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$" } }
    delete:
      tags: [policies]
      operationId: removeFamily
      summary: Split an HMAC domain family of the group's policy (1.21.0)
      x-tt-roles: [operator, policy-approver]
      description: 'Removes the family from `hmac.families`: each member compiles to its own domain again. Observe-safe; audited as `policy.families_removed`. The answer is the version.'
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "404": { description: 'Unknown group; unknown_family: the policy has no such family.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'no_policy; stale_draft.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}/test-k:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    put:
      tags: [policies]
      operationId: setTestK
      summary: Mark a group as a test environment with a lower k (1.21.0)
      x-tt-roles: [admin]
      description: |
        With few testers no rule reaches k = `k_min` subjects. An administrator can mark a group as test with a lower
        `k_min` (at least 2, below the installation k), with a reason; `0` turns it off. The miner mines the group with
        that k (rules of the group then have fewer subjects behind them: `test_k` of `getRulesStatus`), and a pack of
        that group alone is built and gated with it and carries the warning `test_k`; a pack of several groups keeps the
        installation k. Audited as `fleet.group_test_k` (k and reason). The answer is the observe state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [k_min]
              properties:
                k_min: { type: integer, minimum: 0, description: '0 (off) or 2 .. installation k − 1.' }
                reason: { type: string, maxLength: 500, description: 'Required when k_min > 0.' }
      responses:
        "200":
          description: Observe state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObserveStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_k_min, reason_required, invalid_reason, invalid_input.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/groups/{group}/approvers:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    get:
      tags: [policies]
      operationId: getGroupApprovers
      summary: Who can approve the policy drafts of a group (1.15.0)
      x-tt-roles: [operator]
      description: |
        The enabled users who can approve a policy version of the group: the `policy-approver`s, then the administrators
        (an admin approves alone, with a reason). Only usernames and display names (a display name that is an e-mail
        address is cut at `@`), never e-mail addresses or ids. Readable by an administrator and by an `operator` who works
        with the group (created one of its enrollment tokens or proposed one of its policy versions, as `mine` of
        `GET /api/v1/scope`); another operator gets `403 not_member`. The author of a draft is listed with `self` but
        never counts as an approver of its own draft.
      responses:
        "200":
          description: The approvers of the group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupApprovers" }
        "403": { description: 'forbidden (role) or not_member (an operator outside the group).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/{policy_id}/versions/{version}:
    parameters: [ { $ref: "#/components/parameters/PolicyId" }, { $ref: "#/components/parameters/Version" } ]
    get:
      tags: [policies]
      operationId: getPolicyVersion
      summary: Get policy version with diff
      x-tt-roles: [operator, policy-approver, auditor]
      responses:
        "200":
          description: Version, author YAML, diff and classification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
  /api/v1/fleet/policies/{policy_id}/versions/{version}/approve:
    parameters: [ { $ref: "#/components/parameters/PolicyId" }, { $ref: "#/components/parameters/Version" } ]
    post:
      tags: [policies]
      operationId: approvePolicy
      summary: Approve policy draft
      x-tt-roles: [policy-approver, admin]
      description: |
        Records the caller's approval. When the draft has enough approvals, tt-core asks tt keyguard to sign it
        (keyguard re-computes classification and approvals, and verifies OIDC ID tokens when configured), then
        activates it. The approval is stored only if signing succeeds, so a refused or failed signing can be retried.

        **Who counts (v1.3).** In tt-core the author of a version never counts as an approver, not even for a closing
        change (`409 self_approval`): the quorum is made of `approvals_required` distinct `policy-approver`s other
        than the author. keyguard's own check is looser (docs/spec/policy.md §5) and is the backstop, not the rule.
        Restoring an earlier version (`origin: rollback`) needs the opening quorum even when it is closing.

        **Admin approval.** A caller with the `admin` role may approve alone with a non-empty `reason`; this works
        also on a change the admin authored and yields `approval_mode: admin`, an audit entry and the alert
        `policy.admin_approval`. Since 1.4.1 every approval by a caller holding `admin` is the admin approval (also
        with `policy-approver`: keyguard receives the role `admin` only): it MUST send `reason`
        (`422 reason_required`); a `reason` from a caller without `admin` is `403 forbidden`. The reason and the alert
        are traceability, not a limit: keyguard requires them for an approval by one person.

        **Stale approvals (1.4.1).** At every evaluation of the quorum, earlier approvals of users that are now
        disabled, no longer `policy-approver`, or now `admin` are dropped from the draft (audit
        `policy.approval_dropped`); keyguard receives the approvers' current roles. Disabled in keyguard with
        `TT_KEYGUARD_ADMIN_OVERRIDE=false` (`403 admin_override_disabled`).

        **Approval step-up (1.5).** When keyguard verifies approvals with OIDC, each approval needs a step-up ID token
        bound to this version and to the body as it will be signed (see `oidcStepUp`): without one the answer is
        `403 stepup_required` (the UI then runs the step-up and repeats the call). Local accounts cannot approve then
        (`403 oidc_required`) and can never attach `id_token` (`403 id_token_not_allowed`). Tokens are kept in memory
        for 10 minutes: when the quorum is reached but an earlier approver's token has expired (`token_fresh: false` on
        the approval), the draft stays a draft and that approver approves again to renew it (audit
        `policy.approval_renewed`); then tt-core asks keyguard to sign. Without OIDC in keyguard nothing changes
        (`approvals_unverified: true`, a reduced guarantee).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id_token: { type: string, description: 'Optional: a step-up ID token the caller obtained itself (approval audience, nonce of this change); verified by tt-core (iss/aud/sub/nonce) and forwarded to keyguard. Without it the pending step-up is used. Refused for local accounts.' }
                note: { type: string, maxLength: 1000 }
                reason: { type: string, maxLength: 1000, description: 'Justification of an admin single approval (no real values). Stored with the approval; the audit log keeps only a digest.' }
      responses:
        "200":
          description: Approval recorded (and possibly signed and active).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "403": { description: 'forbidden (role, or reason without admin), admin_override_disabled, stepup_required, oidc_required, id_token_not_allowed or id_token_invalid.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown policy or version.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'stepup_disabled (keyguard verifies with OIDC, tt-core has no approval client), stepup_misconfigured (issuer or audience differ from keyguard''s), oidc_unavailable.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'not_draft, stale_draft (a newer version was signed: propose again), self_approval, duplicate_approval, keyguard_state_conflict (keyguard already signed a later version or issued_seq: another tt-core is probably using the same keyguard; v1 supports one tt-core per keyguard).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'too_long (note or reason over 1000 characters) or reason_required.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: 'keyguard_refused (the keyguard code is in the message), keyguard_unavailable, or signature_invalid (the returned signature does not verify).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/{policy_id}/versions/{version}/reject:
    parameters: [ { $ref: "#/components/parameters/PolicyId" }, { $ref: "#/components/parameters/Version" } ]
    post:
      tags: [policies]
      operationId: rejectPolicy
      summary: Reject policy draft
      x-tt-roles: [policy-approver]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Draft rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "404": { description: 'Unknown policy or version.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'not_draft.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/{policy_id}/versions/{version}/withdraw:
    parameters: [ { $ref: "#/components/parameters/PolicyId" }, { $ref: "#/components/parameters/Version" } ]
    post:
      tags: [policies]
      operationId: withdrawPolicy
      summary: Withdraw a pending policy draft (1.17.0)
      x-tt-roles: [operator, policy-approver]
      description: |
        The person who proposed a pending draft (or an admin) takes it back, without needing the policy-approver role: a draft
        that needs approvers nobody can provide would otherwise block the policy (and the automatic observe versions) for
        ever. The draft becomes `rejected` with `withdrawn: true` and a `note` starting with `withdrawn`; the history keeps
        it, and approving it afterwards answers `409`. Anyone else gets `403 not_proposer`. Audited as `policy.withdraw`
        (an admin withdrawing someone else's draft is also `admin_override`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Draft withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "403": { description: 'not_proposer.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown policy or version.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'not_draft.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/{policy_id}/rollback:
    parameters: [ { $ref: "#/components/parameters/PolicyId" } ]
    post:
      tags: [policies]
      operationId: rollbackPolicy
      summary: Roll back to a previous version
      x-tt-roles: [operator, policy-approver]
      description: Creates a new draft with the content of an earlier version. It is classified like any other change (usually opening, so 2 approvals).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to_version]
              properties:
                to_version: { type: integer, minimum: 1 }
      responses:
        "201":
          description: 'Draft created (`origin: rollback`).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "404": { description: 'Unknown policy or version.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_version or not_signed (only a version that was signed and active can be restored).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/{policy_id}/assist:
    parameters: [ { $ref: "#/components/parameters/PolicyId" } ]
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [policies]
      operationId: policyAssistant
      summary: Policy assistant
      x-tt-roles: [operator, policy-approver]
      description: |
        The operations seen under the policy in discovery mode, per service, each with field-by-field proposals,
        computed only from shapes and distinct-count sketches (never a value). Operations are **templates**: the ops
        of raw routes (method and sanitized path, whose value segments are shapes) are merged into `METHOD
        /template` — a shape segment is a parameter, and so is a position with more than 10 distinct path words
        among the paths with the same service, method, length and leading segments; a template structurally equal
        to a declared operation takes the declared key. The route template of the framework never leaves the source
        unless the policy declares it, so it is not used here. `need_calls` says how many more calls an operation
        needs before its proposals rest on enough evidence (`min_calls`). Nothing is applied: see
        `policyAssistantDraft`.
      responses:
        "200":
          description: Operations per service.
          content:
            application/json:
              schema:
                type: object
                required: [policy_id, min_calls, ready, need_calls, message, has_identity, identity_candidates, services]
                properties:
                  policy_id: { type: string }
                  min_calls: { type: integer }
                  ready: { type: boolean, description: 'Every operation has at least min_calls calls.' }
                  need_calls: { type: integer, description: 'The most calls still missing for one operation (0 = enough).' }
                  message: { type: string }
                  has_identity: { type: boolean, description: 'The policy already declares identity.subject.' }
                  identity:
                    type: object
                    description: 'Proposed identity.subject, when most inbound requests carry an Authorization header.'
                    properties:
                      from: { type: string }
                      name: { type: string }
                      jwt_claim: { type: string }
                      service: { type: string }
                      calls: { type: integer }
                      with_header: { type: integer }
                      reason: { type: string }
                  identity_candidates:
                    type: array
                    description: 'Request headers and cookies of the own services ranked as who the user is, best first, with the signals of the automatic detection (names, counts, shapes and scores only; 1.19.0, policy.md §7.4).'
                    items: { $ref: "#/components/schemas/IdentityCandidate" }
                  identity_best: { $ref: "#/components/schemas/IdentitySource" }
                  services:
                    type: array
                    items:
                      type: object
                      required: [service, kind, declared, name, exact, calls, ops]
                      properties:
                        service: { type: string, description: 'As in the events: a service name or `host:<pattern>`.' }
                        kind: { enum: [inbound, external] }
                        declared: { type: boolean }
                        name: { type: string, description: 'Policy service name: the declared one, or a proposal ("" = to be chosen).' }
                        host_pattern: { type: string }
                        exact: { type: boolean }
                        base: { type: string }
                        calls: { type: integer }
                        ops:
                          type: array
                          items:
                            type: object
                            required: [op, declared, calls, need_calls, raw_ops, fields]
                            properties:
                              op: { type: string, examples: ["GET /orders/{id}"] }
                              declared: { type: boolean }
                              calls: { type: integer }
                              need_calls: { type: integer }
                              raw_ops: { type: array, items: { type: string }, description: 'Some of the ops merged, as they left the sources (shapes only).' }
                              fields:
                                type: array
                                items:
                                  type: object
                                  required: [service, op, part, path, shape, distinct_estimate, suggestion, reason_code]
                                  properties:
                                    service: { type: string }
                                    op: { type: string }
                                    part: { enum: [request, response] }
                                    path: { type: string, examples: ["$.status", "query.orderId", "headers.x-tenant", "path.id"] }
                                    shape: { type: string, examples: ["drop:str:l8"] }
                                    observed: { type: integer, description: 'Leaves observed (count).' }
                                    distinct_estimate: { type: integer, description: 'Distinct values estimated from discovery sketches (estimate).' }
                                    suggestion: { type: string, examples: ["keep", "hmac(order)", "bucket(num, [0, 10, 100, 1000])", "drop"] }
                                    reason: { type: string }
                                    reason_code: { type: string, description: 'Heuristic: dynamic_name, credential, trace, personal_format, personal_name, few, flag, time, path_id, id, amount, quantity, number, enum_name, path_word, enum, free.' }
        "503": { description: 'discovery_unavailable: no discovery sketches are available.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/policies/{policy_id}/assist/draft:
    parameters: [ { $ref: "#/components/parameters/PolicyId" } ]
    post:
      tags: [policies]
      operationId: policyAssistantDraft
      summary: Propose the policy decided with the assistant
      x-tt-roles: [operator, policy-approver]
      description: |
        Writes the decisions of a person (operations to declare, one action per field, never a value) into the
        latest author policy — the active version, or the latest one — keeping comments and layout, checks that the
        result compiles and, unless `dry_run`, stores it as a draft (`origin: propose`) that follows the normal
        approvals; an observe-safe result applies at once (docs/spec/policy.md §7). The dry run classifies it
        (`opens_values`, `value_reasons`, `approvals_required`, 1.10.0). A service not declared yet is added: `match: {inbound: true}` for an own service, `match: {base}`
        for `host:<pattern>` (the base must be described by the pattern and carry the scheme the person chose).
        Listed operations are declared even without rules. A `drop` removes an existing rule. `identity` sets
        identity.subject when the policy has none, or replaces it with `replace_identity` (1.19.0).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: { type: boolean }
                hosts_discovery: { enum: [auto, off] }
                identity:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    from: { enum: [header, cookie], default: header }
                    name: { type: string }
                    jwt_claim: { type: string }
                replace_identity: { type: boolean, description: '`identity` replaces the identity.subject of the policy (1.19.0).' }
                services:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    additionalProperties: false
                    required: [service]
                    properties:
                      service: { type: string }
                      name: { type: string }
                      base: { type: string }
                      ops:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [op]
                          properties:
                            op: { type: string }
                            rules:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                required: [part, path, action]
                                properties:
                                  part: { enum: [request, response] }
                                  path: { type: string }
                                  action: { type: string }
      responses:
        "200":
          description: Dry run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  before: { type: string }
                  after: { type: string }
                  opens_values: { type: boolean, description: 'false: the change applies at once, without approval (1.10.0).' }
                  value_reasons: { type: array, items: { $ref: "#/components/schemas/ValueReason" } }
                  approvals_required: { type: integer, minimum: 0, maximum: 2 }
        "201":
          description: Draft created, or the active version when the change is observe-safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "409": { description: 'already_declared: another service of the policy has this base.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: 'too_large.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_service, duplicate_service, service_exists, base_required (no scheme chosen), base_mismatch, invalid_base, invalid_op, invalid_rule, invalid_action, invalid_identity, invalid_hosts_discovery, too_many, invalid_policy, no_change.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- policies: starter, signing keys, settings
  /api/v1/fleet/groups/{group}/starter-policy:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    post:
      tags: [policies]
      operationId: createStarterPolicy
      summary: Create the onboarding starter policy for a group
      x-tt-roles: [operator, policy-approver]
      description: |
        Creates the first policy of a group (docs/spec/policy.md §6): `default: drop`, discovery and automatic words for
        `window_hours` (default 72, at most 168), the group's inbound services, and the given sampling rate. It opens no
        value: since 1.10.0 (§7) it is signed by keyguard without approvals and the answer is the active version
        (`approval_mode: observe`); when keyguard has `observe_auto` off it is a draft that needs the opening approvals.
        When the group has no `policy_id` it is bound to `p-<group>` (or the given `policy_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                policy_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: 'Default: the group policy_id, else p-<group>.' }
                hmac_kid: { type: string, description: 'Kid of the HMAC key the sources hold. Default (1.10.0): the first HMAC kid keyguard holds.' }
                epoch: { type: string, description: 'Default (1.10.0): the current month, YYYY-MM.' }
                sampling_rate: { type: string, description: 'Decimal in [0, 1] with at most 4 decimals (policy.md §1); default "0.1" (1.10.0; was "0.05").' }
                window_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
      responses:
        "201":
          description: Starter policy, active (observe-safe) or a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "404": { description: 'Unknown group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'group_bound: the group is bound to another policy.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_window, invalid_policy_id, invalid_hmac, invalid_policy.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/signing-keys:
    get:
      tags: [policies]
      operationId: listSigningKeys
      summary: Policy signing keys known to tt-core
      x-tt-roles: [operator, auditor, admin]
      description: Public keys only. The keys themselves live in keyguard; tt-core learns the public parts from `GET /keyguard/v1/public-keys`.
      responses:
        "200":
          description: Keys, including revoked ones.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SigningKeyInfo" } }
  /api/v1/fleet/signing-keys/{kid}/revoke:
    parameters: [ { name: kid, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } } ]
    post:
      tags: [policies]
      operationId: revokeSigningKey
      summary: Revoke a policy signing key
      x-tt-roles: [admin]
      description: |
        Sources stop trusting the kid at their next heartbeat (`revoke_signing_keys`) and new enrollments no longer receive it.
        Refused (red team round 3) for the kid keyguard currently signs with (read from keyguard status), and until at least
        `fleet.key_rotation.min_confirmed` (default 1 = 100%) of the sources seen in the last `fleet.key_rotation.window`
        (default 24 h) confirmed through their heartbeat (`signing_kids`) that they trust the key that signs after the revocation.
        `SigningKeyInfo.revoke` shows the counts beforehand. Every refusal is audited (`fleet.signing_key_revoke`, outcome denied).
      responses:
        "204": { description: 'Revoked.' }
        "404": { description: 'Unknown kid.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'already_revoked; last_signing_key (rotate in keyguard first: sources would trust no key); active_signing_key (keyguard still signs with it); rotation_unconfirmed (not enough sources confirmed the new key yet).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'keyguard_unavailable: keyguard was never reached, so its active kid is unknown.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/fleet/approval-settings:
    get:
      tags: [policies]
      operationId: getApprovalSettings
      summary: Approval settings enforced by keyguard
      x-tt-roles: [operator, policy-approver, auditor, admin]
      description: Read from keyguard (never configured in tt-core), so the UI shows what will really be enforced. Until keyguard has been reached, `known` is false and the strict defaults are reported.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                required: [opening_required, admin_override, approvals_unverified, known]
                properties:
                  opening_required: { type: integer, enum: [1, 2], description: 'Approvals needed by a change that opens data (TT_KEYGUARD_OPENING_APPROVALS).' }
                  admin_override: { type: boolean, description: 'An admin may approve alone with a reason (TT_KEYGUARD_ADMIN_OVERRIDE).' }
                  approvals_unverified: { type: boolean, description: 'keyguard has no OIDC issuer and trusts the identities and roles declared by tt-core: a reduced guarantee for single-host and development installations. When false, every approval needs an OIDC step-up.' }
                  known: { type: boolean }

  # ---------------------------------------------------------------- discovery and contracts
  /api/v1/services:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [discovery]
      operationId: listServices
      summary: Discovered services and hosts
      x-tt-roles: [operator, rule-reviewer, auditor]
      responses:
        "200":
          description: Own services and external hosts seen in events, with counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [service, kind, calls, ops, in_policy, first_seen, last_seen, twin]
                  properties:
                    service: { type: string }
                    kind: { enum: [inbound, outbound-policy, outbound-host] }
                    calls: { type: integer }
                    ops: { type: integer }
                    in_policy: { type: boolean, description: 'False for `outbound-host` entries (hosts not in the policy).' }
                    first_seen: { type: string, format: date-time }
                    last_seen: { type: string, format: date-time }
                    twin: { type: boolean, description: 'The service gets a twin (a contract in the packs) unless the build names services itself. Default: true for external services, always true for `inbound`, false for a replaced service; changed with `setServiceTwin`.' }
                    replaced_by: { type: string, description: 'An old `host:<pattern>` entry (kept as history): the external service the group declares since for that host (1.16.0). The pack build leaves it out by default.' }
  /api/v1/services/{service}/twin:
    parameters: [ { $ref: "#/components/parameters/Service" } ]
    put:
      tags: [discovery]
      operationId: setServiceTwin
      summary: Choose whether a service gets a twin
      x-tt-roles: [operator]
      description: 'Stored by the server, so every operator sees the same selection. `buildPack` uses it as the default: when the request has no `services`, the services switched off here are left out (if the rules need one of them the build answers `422 missing_service`). Audited as `service.twin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [twin]
              properties:
                twin: { type: boolean }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [service, twin]
                properties:
                  service: { type: string }
                  twin: { type: boolean }
        "400": { description: 'invalid_input: twin missing.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'Unknown service.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'inbound_always_twinned: the system under test is always part of a pack.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/services/{service}/ops:
    parameters: [ { $ref: "#/components/parameters/Service" } ]
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [discovery]
      operationId: listServiceOps
      summary: Operations of a service
      x-tt-roles: [operator, rule-reviewer, auditor]
      responses:
        "200":
          description: Operations with call counts, status mix and route sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    op: { type: string }
                    calls: { type: integer }
                    route_source: { type: object, additionalProperties: { type: integer }, description: 'Counted on a sample of at most 100 events per operation.' }
                    statuses: { type: object, additionalProperties: { type: integer }, description: 'Status code (or `net_error`) to calls.' }
        "404": { description: 'Unknown service.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/hosts:
    get:
      tags: [discovery]
      operationId: listHosts
      summary: Outbound hosts, grouped by registrable domain
      x-tt-roles: [operator, admin]
      description: |
        Spec v1.5 (docs/spec/sanitizer.md §3.5). Every outbound host seen in the events, grouped by registrable
        domain (an approximation of eTLD+1, event.md §5.2): the host patterns of the events (`host:<pattern>`, where
        a label that looked like a value is already `{*}` and an IP literal is only `ip:private` / `ip:public`), the
        external services declared by the latest version of each policy (`match.base`, `declared: true`, their calls
        are counted under the service name) and, apart, the calls that left as `host:unlisted` (strict mode,
        `hosts.discovery: off`) or `host:invalid`. Only patterns, counts and times: never a value. `callers` are the
        enrollment service names of the sources that made the calls. Error rate: responses with status ≥ 500 and
        network errors over calls; `client_errors` counts 4xx.

        With `from` and/or `to` (admin-api 1.8) the registry covers the event time of that period and is computed
        from the time-bucketed rollups, which outlive the raw events (docs/DATA_LIFECYCLE.md): any age, at the
        resolution of the tier the period was compacted to (hour, day, month); the median latency is a histogram
        bucket (about 9% error).
      parameters:
        - $ref: "#/components/parameters/GroupFilter"
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'Start of the period (event time, inclusive).' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'End of the period (exclusive; default now).' }
      responses:
        "400": { description: 'invalid_query: from or to is not a date-time, or to is not after from.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "200":
          description: The hosts registry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostsRegistry" }
  /api/v1/hosts/{pattern}/twin:
    parameters:
      - name: pattern
        in: path
        required: true
        description: 'The host pattern, with or without the `host:` prefix, percent-encoded (`{*}` is `%7B%2A%7D`).'
        schema: { type: string }
    post:
      tags: [discovery]
      operationId: twinHost
      summary: Propose an external service for a host
      x-tt-roles: [operator, admin]
      description: |
        Creates a **policy draft** (origin `host-twin`) that adds an external service with `match.base` for the
        host, starting from the active version of the policy (or its latest version). The draft is never active by
        itself: it follows the normal approvals (`approvePolicy`; adding a service opens data, so it needs the
        opening number of policy-approvers, or the admin override with `reason`). A pattern with `{*}` labels or an
        IP class needs `base`: tt-core never knew the value behind `{*}`, the person types the exact host and it
        must be described by the pattern (same labels and port, `{*}` for any one label; for an IP class an IPv4
        literal of that class). Without `policy_id` tt-core uses the policy under which the host was seen, when
        there is only one. Audited as `host.twin` (target: the pattern with `{*}` written `_`) and `policy.host-twin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                policy_id: { type: string }
                service: { type: string, description: 'Name of the new service, `^[a-z0-9][a-z0-9._-]{0,62}$`. Default: the host of the base, plus `-<port>` with a non-default port.' }
                base: { type: string, description: '`http(s)://host[:port][/segment…]`. Required for a pattern with `{*}` or an IP class.' }
                scheme: { enum: [http, https], description: 'For an exact pattern without `base`: the base is `<scheme>://<pattern>`. The events do not carry the scheme of a host (the default port of either is left out), so it is never guessed: without `base` it is required (`422 scheme_required`).' }
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyVersion" }
        "400": { description: 'bad_request: body not valid JSON or unknown field.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'not_found: unknown policy.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'service_exists: the policy has a service with that name; already_declared: a service of the policy has the same base.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_pattern, policy_required, base_required (pattern with `{*}` or an IP class), invalid_base, base_mismatch (the base is not described by the pattern), invalid_service, invalid_policy, no_target_groups.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/contracts:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [contracts]
      operationId: listContracts
      summary: List contracts
      x-tt-roles: [operator, rule-reviewer, publisher, auditor]
      responses:
        "200":
          description: One entry per service with its latest snapshot.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SnapshotInfo" } }
  /api/v1/contracts/{service}:
    parameters: [ { $ref: "#/components/parameters/Service" } ]
    get:
      tags: [contracts]
      operationId: getContract
      summary: Latest contract (zone B view)
      x-tt-roles: [operator, rule-reviewer, publisher, auditor]
      description: |
        OpenAPI 3.1 with x-tt-* extensions. Examples are synthetic; enum values below k are hidden here too.
        The latest stored snapshot is served (header `X-TT-Snapshot`); when the service has none yet the contract is
        inferred on the fly from the event store and not stored. `format=yaml` (or `Accept: application/yaml`) returns YAML;
        `pack_safe=true` removes operations and responses with fewer than `k_min` calls, as the gate would.
      parameters:
        - $ref: "#/components/parameters/GroupFilter"
        - { name: format, in: query, schema: { enum: [json, yaml, yml] } }
        - { name: pack_safe, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Contract.
          headers:
            X-TT-Snapshot: { schema: { type: string }, description: 'Snapshot id (absent for an on-the-fly contract).' }
          content:
            application/json:
              schema: { type: object }
            application/yaml:
              schema: { type: string }
        "404": { description: 'No events for this service.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/contracts/{service}/postman:
    parameters: [ { $ref: "#/components/parameters/Service" } ]
    get:
      tags: [contracts]
      operationId: getContractPostman
      summary: Postman collection of a contract
      x-tt-roles: [operator, rule-reviewer, publisher, auditor]
      description: |
        The inferred contract as a Postman Collection v2.1 file (also importable in Insomnia): one request per operation,
        grouped in a folder per first path segment, with the synthetic example as body, the recorded responses as saved
        examples and the base URL in the collection variable `baseUrl`. Postman and Insomnia can also import the OpenAPI
        document of `getContract` directly. The same snapshot rules as `getContract` apply.
      parameters:
        - $ref: "#/components/parameters/GroupFilter"
        - { name: base_url, in: query, schema: { type: string, maxLength: 200 }, description: 'Default value of the `baseUrl` variable (default `http://localhost:8480/__svc/<service>`): the address of the mock. An absolute `http` or `https` URL of printable ASCII, with a host and without user info, query or fragment, quotes, angle brackets or spaces (`422 invalid_base_url`).' }
        - { name: pack_safe, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Collection (attachment `<service>.postman_collection.json`).
          headers:
            X-TT-Snapshot: { schema: { type: string }, description: 'Snapshot id (absent for an on-the-fly contract).' }
          content:
            application/json:
              schema: { type: object }
        "404": { description: 'No events for this service.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_base_url.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/contracts/{service}/status:
    parameters: [ { $ref: "#/components/parameters/Service" } ]
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [contracts]
      operationId: getContractStatus
      summary: How far a service is from its contract
      x-tt-roles: [operator, rule-reviewer, publisher, auditor]
      description: Stored calls and operations (raw paths grouped into inferred templates), operations with at least `min_calls` calls, the latest snapshot and when the scheduled one runs. Counts and identifiers only.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  calls: { type: integer }
                  operations: { type: integer }
                  ready_operations: { type: integer }
                  best_op_calls: { type: integer }
                  min_calls: { type: integer }
                  k_min: { type: integer }
                  inferred_operations: { type: integer }
                  snapshot: { oneOf: [ { $ref: "#/components/schemas/SnapshotInfo" }, { type: "null" } ] }
                  next_snapshot_at: { type: string, format: date-time }
                  window_hours: { type: number }
        "404": { description: 'No events for this service.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/contracts/{service}/snapshots:
    parameters: [ { $ref: "#/components/parameters/Service" } ]
    get:
      tags: [contracts]
      operationId: listSnapshots
      summary: Contract snapshots
      x-tt-roles: [operator, rule-reviewer, auditor]
      parameters:
        - $ref: "#/components/parameters/GroupFilter"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Snapshots, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SnapshotInfo" } }
        "400": { description: 'invalid_input: invalid limit.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [contracts]
      operationId: createSnapshot
      summary: Take a snapshot now
      x-tt-roles: [operator]
      description: Snapshots one service for the given window; without a body, for the last completed window (24 h aligned to the UTC day). Audited as `contract.snapshot`. A snapshot triggers the drift comparison with the previous one.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                recent: { type: boolean, description: 'The last window length up to now (the console''s "Aggiorna contratto ora"); ignored when from and to are given.' }
      responses:
        "201":
          description: Snapshot taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotInfo" }
        "202":
          description: 'Since 1.12.1: the snapshot takes longer than the server wait (a busy service: minutes of raw events to infer). The answer is the running Job (`kind` `contract.snapshot`); its `result` is the SnapshotInfo (see "Jobs").'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { description: 'invalid_input: invalid body, or `to` not after `from`.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'No events for this service in the window.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/contracts/{service}/snapshots/{snapshot_id}:
    parameters: [ { $ref: "#/components/parameters/Service" }, { name: snapshot_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [contracts]
      operationId: getSnapshot
      summary: Get snapshot
      x-tt-roles: [operator, rule-reviewer, auditor]
      parameters:
        - { name: diff_against, in: query, schema: { type: string }, description: 'Another snapshot id: returns the structured diff instead.' }
        - { name: format, in: query, schema: { enum: [json, yaml, yml] } }
        - { name: pack_safe, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Snapshot contract (header `X-TT-Snapshot`), or a diff.
          content:
            application/json:
              schema: { type: object }
            application/yaml:
              schema: { type: string }
        "404": { description: 'Unknown service or snapshot.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/drift:
    get:
      tags: [contracts]
      operationId: listDrift
      summary: Drift alerts
      x-tt-roles: [operator, rule-reviewer, auditor]
      parameters:
        - $ref: "#/components/parameters/GroupFilter"
        - { name: severity, in: query, schema: { enum: [breaking, non-breaking] } }
        - { name: state, in: query, schema: { enum: [open, acknowledged, resolved] } }
        - { name: kind, in: query, schema: { enum: [contract.drift, rule.stale, all], default: contract.drift }, description: 'Empty or contract.drift: contract alerts only (default). rule.stale: the alerts raised when an approved rule loses confidence. all: both, one call. Every alert carries its `kind`.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Drift alerts, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Drift" } }
        "400": { description: 'invalid_input (severity, state or limit).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/drift/{drift_id}:
    parameters: [ { name: drift_id, in: path, required: true, schema: { type: string } } ]
    patch:
      tags: [contracts]
      operationId: setDriftState
      summary: Acknowledge or resolve an alert
      x-tt-roles: [operator]
      description: 'Moves an alert along `open` → `acknowledged` → `resolved` (open → resolved is allowed). Repeating the current state is not an error; going back is `409 invalid_transition`. A resolved alert is final: if the same change shows up again a new alert is raised. Audited as `drift.ack` or `drift.resolve`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { enum: [acknowledged, resolved] }
      responses:
        "200":
          description: The alert after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drift" }
        "400": { description: 'invalid_input: state is not acknowledged or resolved.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'Unknown alert.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'invalid_transition: a resolved alert cannot be acknowledged again.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/drift/{drift_id}/ack:
    parameters: [ { name: drift_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [contracts]
      operationId: ackDrift
      summary: Acknowledge drift
      x-tt-roles: [operator, rule-reviewer]
      description: Idempotent (a resolved alert stays resolved). Equivalent to `setDriftState` with `acknowledged`, kept for the earlier clients. Audited as `drift.ack`.
      responses:
        "204": { description: 'Acknowledged.' }
        "404": { description: 'Unknown alert.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/gaps:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [contracts]
      operationId: listGaps
      summary: Gaps list
      x-tt-roles: [operator, rule-reviewer, auditor]
      description: 'Operations with few samples, statuses never observed, rules with low support, fields without values for synthesis. `id` is stable while the same hole exists (it hashes kind, service, op, scope and the place, not the counts). `count` is the observed value and `threshold` the value it is compared to (minimum samples, k, ...), when the kind has one.'
      responses:
        "200":
          description: Gaps.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, service, scope, detail]
                  properties:
                    id: { type: string, pattern: "^gp-[0-9a-f]{12}$" }
                    kind: { enum: [few-samples, status-unseen, rule-low-support, value-unknown, entity-without-creator] }
                    service: { type: string }
                    op: { type: string }
                    scope: { enum: [op, field], description: '`field`: one field or parameter of a request or response (an optional field seen in few objects, a field whose values are all below k). `op`: the operation as a whole, or the service when `op` is absent.' }
                    detail: { type: string }
                    count: { type: integer }
                    threshold: { type: integer, description: 'Minimum samples for few-samples, k for value-unknown, twice k_min distinct subjects for rule-low-support. Absent for the other kinds.' }

  # ---------------------------------------------------------------- rules
  /api/v1/rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: List rules
      x-tt-roles: [rule-reviewer, operator, auditor]
      parameters:
        - $ref: "#/components/parameters/GroupFilter"
        - { name: status, in: query, schema: { enum: [draft, approved, rejected, stale, superseded] } }
      responses:
        "200":
          description: Rules (flat tt.rules/v1 rule objects, with `status`, `review`, `supersedes` and `proposed_at`, the time the miner first proposed the rule; `proposed_at` is not part of the rules document in a pack). An approved rule that failed the last mining runs also has `failed_runs` (consecutive failures; it becomes stale at `stale_runs` of the mining status, default 3) and `stale_reason`; a stale rule has `stale_reason`, for example `entity shipment - birth share 0.52 (lower bound 0.50) below 0.60, for 3 runs`. Neither is part of the rules document in a pack.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "400": { description: 'invalid_input: unknown status.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [rules]
      operationId: createRule
      summary: Write a rule by hand (1.10)
      x-tt-roles: [rule-reviewer]
      description: |
        Stores a rule written by a person (rule editor) as a **draft** with `origin: manual` (docs/spec/rules.md §5.1). The body
        is a tt.rules/v1 rule (`kind` causal or batch) without the header the server owns: `id`, `status`, `origin`,
        `evidence` and `review` are set by tt-core (counts are 0: nothing was observed). Causal effects may change an entity
        (`create`, `target`/`target_id` + `set`, with a figurative `after`) or the answers of a later call (`respond`, §3.6:
        "the next call returns 404", "errors with frequency p"). The rule is checked against the contracts and the entities
        (`GET /api/v1/rules/catalog`): services, operations, fields of the bound references and of `set`/`create`, example
        names; an unknown one refuses the rule (`422 invalid_rule`, `details` = problems `{path, code, message}` with code
        `unknown_service`, `unknown_op`, `unknown_field`, `unknown_entity`, `unknown_example` or `invalid`). A status never
        observed is accepted with a warning (`warnings` in the answer). It then follows the same review as a mined rule
        (an admin can approve it alone, audited) and the miner never changes it. Audited as `rule.create` (kind, origin, number of effects).
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleDefinition" }
      responses:
        "201":
          description: The stored draft (as in the list), with `warnings` when there are any.
          content:
            application/json:
              schema: { type: object }
        "400": { description: 'invalid_rule: not a rules.v1 object.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: 'invalid_rule: refused, with the problems in details.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/rules/catalog:
    get:
      tags: [rules]
      operationId: getRuleCatalog
      summary: What a rule written by hand may name (1.10)
      x-tt-roles: [rule-reviewer, operator, auditor]
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      description: |
        The services and operations of the pack-safe contracts of the selected groups (statuses observed, example names per
        status, request parameters, request and success response body fields as tt-paths, each with type, `kind`, `domain`
        and the published keep values) and the entities of the last mining run with the fields their reads expose and their
        published values (the "states"). The rule editor builds its dropdowns from it; it never contains other values.
        Since 1.17.0 it is scoped to the selected groups: the services, operations and fields of the groups' own traffic
        (two teams whose traffic reaches a service of the same name each see only their own operations), taken from the
        newest stored contract snapshot of each (group, service) and, for a service not snapshotted yet, from a preview of
        that group's sources only; the entities are those named for the selected groups. It answers in well under a second
        also on a store of millions of events.
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                required: [services, entities]
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required: [name, ops]
                      properties:
                        name: { type: string }
                        ops:
                          type: array
                          items:
                            type: object
                            required: [op, statuses]
                            properties:
                              op: { type: string }
                              statuses: { type: array, items: { type: integer } }
                              examples: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'status → example names.' }
                              params: { type: array, items: { $ref: "#/components/schemas/CatalogField" } }
                              request: { type: array, items: { $ref: "#/components/schemas/CatalogField" } }
                              response: { type: array, items: { $ref: "#/components/schemas/CatalogField" } }
                  entities:
                    type: array
                    items:
                      type: object
                      required: [name, service, id_field, id_domain, ops, fields]
                      properties:
                        name: { type: string }
                        service: { type: string }
                        id_field: { type: string }
                        id_domain: { type: string }
                        ops: { type: array, items: { type: string } }
                        fields: { type: array, items: { $ref: "#/components/schemas/CatalogField" } }
  /api/v1/rules/check:
    post:
      tags: [rules]
      operationId: checkRule
      summary: Validate a rule without storing it (1.10)
      x-tt-roles: [rule-reviewer, operator, auditor]
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      description: The checks of `POST /api/v1/rules` as a dry run, for the editor's live feedback. Nothing is stored or audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleDefinition" }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [valid, problems, warnings]
                properties:
                  valid: { type: boolean }
                  problems: { type: array, items: { $ref: "#/components/schemas/RuleProblem" } }
                  warnings: { type: array, items: { $ref: "#/components/schemas/RuleProblem" } }
        "400": { description: 'invalid_rule: not a rules.v1 object.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/rules/op-kinds:
    get:
      tags: [rules]
      operationId: listOpKinds
      summary: Operations read or written by behaviour, and the decisions of persons (1.20.0)
      x-tt-roles: [rule-reviewer, operator, auditor]
      description: |
        The miner classifies operations by what they do, not by their method (rules.md 2.10): a POST (or a GraphQL
        mutation) that returns existing identifiers, mints none, answers equal requests alike and changes nothing it
        returns is a read. `auto` lists the operations the latest run classified so; `decisions` the choices of a person
        ("questa operazione è una lettura"), which win over the traffic in every later run.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" } }
      responses:
        "200":
          description: Decisions and automatic classifications.
          content:
            application/json:
              schema:
                type: object
                required: [decisions, auto]
                properties:
                  decisions:
                    type: array
                    items:
                      type: object
                      required: [group, service, op, read, set_by, set_at]
                      properties:
                        group: { type: string }
                        service: { type: string }
                        op: { type: string }
                        read: { type: boolean }
                        set_by: { type: string }
                        set_at: { type: string, format: date-time }
                  auto:
                    type: array
                    items:
                      type: object
                      required: [service, op, read]
                      properties:
                        group: { type: string }
                        service: { type: string }
                        op: { type: string }
                        read: { type: boolean }
                        auto: { type: boolean }
    put:
      tags: [rules]
      operationId: setOpKind
      summary: Mark an operation as a read or a write, or give the choice back to the traffic (1.20.0)
      x-tt-roles: [rule-reviewer]
      description: |
        `read: true` makes the operation a read for the miner (its answers can expose entities, it never creates one),
        `false` a write, `null` removes the decision. Per group; the next mining run uses it. Audited as
        `rule.op_kind_set` (target `operation`, details `kind` read | write | auto and `group`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service, op, read]
              properties:
                group: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
                service: { type: string }
                op: { type: string, maxLength: 512 }
                read: { type: [boolean, "null"] }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { type: string }
                  service: { type: string }
                  op: { type: string }
                  read: { type: [boolean, "null"] }
                  kind: { enum: [read, write, auto] }
                  applies: { const: next_run }
                  set_by: { type: string }
                  set_at: { type: string, format: date-time }
        "400": { description: 'invalid_input.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 'forbidden: missing role (audited as denied).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/rules/status:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [rules]
      operationId: getRulesStatus
      summary: Mining status (extension)
      x-tt-roles: [rule-reviewer, operator, auditor]
      description: |
        What the last mining run saw and whether it saw enough traffic to decide anything. A cause younger than the
        minimum horizon (`min_hours`, 1 hour) has no decided outcome, so with less observed traffic the miner produces no
        rule: `state` is then `insufficient_data` (the UI shows "dati insufficienti: servono almeno N ore di traffico")
        instead of an empty list. States: `never_run`, `no_data` (no events in the window), `insufficient_data`, `ok`.

        The status also explains the last run (diagnostics): `entities` says, for every entity candidate, how many objects were
        seen being created (`born`) out of those seen at the creator (`at_creator`), the share and its lower bound
        (`birth_share_low`, Wilson 95 %) against `min_birth_share`, and why it was accepted or dropped; objects first seen
        without their creation (app restart, retention cutoff, sampling) are `pre_existing`, not evidence against the entity.
        `rule_diagnostics` says what became of each rule: `proposed`, `not_mined` (with the reason), `kept`, `watch` (approved
        rule that failed, `strikes` of `stale_runs` consecutive runs), `stale` (with the stored reason), `not_seen`, `skipped`
        (too little traffic). `warnings` lists in words what deserves a look (dropped entities, rules on watch or stale).

        Since 1.17.0 the figures are the selected groups' own when the request names groups (`group`): `events`,
        `subjects` and `observed_hours` sum the groups listed in `groups`, and the whole console's numbers are in
        `events_total` and `subjects_total`. `groups` has, per group mined, what the run examined (`events`, `objects`,
        `subjects`, `observed_s`, `entities`, `lifecycles`) and whether states were observed: `states_observed` is true
        when a state field is already in clear (a status leaving as a code counts) and changes over time; `state_fields`
        and `clear_fields` name the fields. Each causal candidate of `rule_diagnostics` has `values`: `in_clear` (the object
        has fields in clear: a candidate without lifecycle is then not a policy problem, never ask for an approval for it)
        or `dropped` (no field of the object is in clear: an approval may be what is missing), with `clear_fields`.
      responses:
        "200":
          description: Mining status.
          content:
            application/json:
              schema:
                type: object
                required: [state, min_hours, observed_hours, events, rules]
                properties:
                  state: { enum: [never_run, no_data, insufficient_data, few_subjects, ok] }
                  min_hours: { type: number }
                  observed_hours: { type: number, description: 'Span between the first and the last event of the last run.' }
                  events: { type: integer, description: 'Events examined: the selected groups'' own when the request names groups (1.17.0), else the whole console''s.' }
                  events_total: { type: integer, description: 'Only when the request names groups (1.17.0): the whole console''s events examined.' }
                  subjects: { type: integer }
                  subjects_total: { type: integer }
                  groups:
                    type: array
                    description: 'What the last run examined, per group mined (1.17.0); the selected groups only when the request names groups.'
                    items:
                      type: object
                      required: [group, events, objects, subjects, observed_s, entities, lifecycles, states_observed]
                      properties:
                        group: { type: string }
                        events: { type: integer }
                        objects: { type: integer }
                        subjects: { type: integer }
                        observed_s: { type: integer }
                        entities: { type: integer }
                        lifecycles: { type: integer, description: 'Entities with an observed order of states.' }
                        states_observed: { type: boolean, description: 'A state field in clear (keep or code) that changes over time exists: no approval is needed to get states.' }
                        state_fields: { type: array, items: { type: string } }
                        clear_fields: { type: array, items: { type: string } }
                  run_id: { type: integer }
                  last_run_at: { type: string, format: date-time }
                  rules: { type: object, additionalProperties: { type: integer }, description: 'Stored rules by status (draft, approved, rejected, stale, superseded).' }
                  min_birth_share: { type: number, description: 'Least share of an entity''s objects seen being created (lower bound), miner.min_birth_share.' }
                  stale_runs: { type: integer, description: 'Consecutive failed runs after which an approved rule becomes stale, miner.stale_runs.' }
                  entities: { type: array, items: { type: object }, description: 'Per entity candidate of the last run: name, op, at_creator, born, objects, pre_existing, birth_share, birth_share_low, min_birth_share, accepted, reason, code (accepted, few_births, low_birth_share, reference) and reference (true for an id that exists before the call, like the requesting user''s member id: never a warning, never blocking a rule).' }
                  rule_diagnostics: { type: array, items: { type: object }, description: 'Per rule of the last run: rule_id, signature, kind, decision, reason (technical, English), confidence, strikes, stale_runs; code (mined, few_causes, no_effect, few_subjects, undecided, outcome_few_subjects, no_outcome, entity_not_accepted) for the UI, service, op and entity of the candidate, and the figures causes, decided, subjects, horizon_s; values (in_clear | dropped, causal candidates, 1.17.0) with clear_fields: whether the object the candidate creates has fields in clear.' }
                  merges: { type: array, items: { type: object }, description: 'Identifiers found relayed under another HMAC domain (from, into, field, source, pairs): an id minted by an external service and returned by the own service under its own field name; the two domains are mined as one.' }
                  candidates: { type: array, items: { $ref: "#/components/schemas/MinerCandidate" }, description: '1.21.0: structures seen by fewer than k subjects, offered as guided drafts (the selected groups'' only when the request names groups).' }
                  families: { type: array, items: { $ref: "#/components/schemas/FamilyCandidate" }, description: '1.21.0: HMAC domains that look like one identifier (join them with `setFamily`).' }
                  test_k: { type: object, additionalProperties: { type: integer }, description: '1.21.0: per group mined with a lower k (marked as test, `setTestK`), the k used.' }
                  warnings: { type: array, items: { type: string } }
  /api/v1/rules/mine:
    post:
      tags: [rules]
      operationId: mineRules
      summary: Run one mining pass now (extension)
      x-tt-roles: [operator]
      description: |
        Extension of the earlier contract, served by tt-core next to the rules of the miner. Runs one mining pass at once
        (policies are refreshed first). Audited twice: `rule.mine` (the run, by the system) and `rule.mine_request` (who asked, and the job id). The 202 answer is the finished job (`kind` `rules.mine`); its `result` has `run_id`,
        `events`, the rule ids `new`, `updated` and `stale`, the count `unchanged`, the diagnostics of the run (`entities`, `rule_diagnostics`) and `status`, the same object as `GET /api/v1/rules/status` after the run (coverage, thresholds, warnings): a run that proposes nothing says why.
      responses:
        "202":
          description: 'The job: finished (status done), or running when it takes longer than the wait (see "Jobs").'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: 'mining_failed: the mining run failed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/rules/{rule_id}:
    parameters: [ { $ref: "#/components/parameters/RuleId" } ]
    get:
      tags: [rules]
      operationId: getRule
      summary: Get rule
      x-tt-roles: [rule-reviewer, operator, auditor]
      responses:
        "200":
          description: Rule with evidence.
          content:
            application/json:
              schema: { type: object }
        "400": { description: 'invalid_input: malformed rule id.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown rule.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [rules]
      operationId: editRule
      summary: Edit a draft
      x-tt-roles: [rule-reviewer]
      description: 'Only drafts can be edited, and only titles and figurative delays (`after`). A delay is a single duration (`5m`) or a range `{min, max}` of durations (`min` ≤ `max`, both `^[0-9]{1,6}(s|m|h|d)$`), as in docs/spec/rules.md §3.3. Editing an approved rule returns a new draft that supersedes it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 200 }
                after:
                  type: object
                  description: 'effect id → delay: a duration, or a {min, max} range.'
                  additionalProperties:
                    oneOf:
                      - { type: string, pattern: "^[0-9]{1,6}(s|m|h|d)$" }
                      - type: object
                        additionalProperties: false
                        required: [min, max]
                        properties:
                          min: { type: string, pattern: "^[0-9]{1,6}(s|m|h|d)$" }
                          max: { type: string, pattern: "^[0-9]{1,6}(s|m|h|d)$", description: 'Not smaller than min.' }
      responses:
        "200":
          description: 'Updated draft (possibly a new one: then its id differs from the path).'
          content:
            application/json:
              schema: { type: object }
        "400": { description: 'invalid_input: malformed id, empty change, or a change that is not allowed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown rule.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'rule_state: the rule status does not allow the change.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [rules]
      operationId: replaceRule
      summary: Change the definition of a rule (1.10)
      x-tt-roles: [rule-reviewer]
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      description: |
        Replaces cause, effects and outcomes (causal) or schedule, entity, where, set and fraction (batch), and the title, with the
        checks of `POST /api/v1/rules`; the kind cannot change. A draft changes in place: a mined draft keeps the person's
        definition when the miner refreshes it (only its evidence follows the traffic) and keeps `origin` mined. An approved
        or stale rule gets a new draft that supersedes it (its id differs from the path). Rejected rules cannot change
        (`409 rule_state`). Audited as `rule.edit` with `definition: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleDefinition" }
      responses:
        "200":
          description: The draft (possibly a new one), with `warnings` when there are any.
          content:
            application/json:
              schema: { type: object }
        "400": { description: 'invalid_rule or invalid_input.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown rule.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'rule_state.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_rule: refused, with the problems in details.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/rules/{rule_id}/approve:
    parameters: [ { $ref: "#/components/parameters/RuleId" } ]
    post:
      tags: [rules]
      operationId: approveRule
      summary: Approve rule
      x-tt-roles: [rule-reviewer]
      description: 'Draft: approved. Stale rule: confirmed, back to approved (the rule keeps its evidence). Audited as rule.approve. Since 1.17.0 the approved rule replaces the rules it supersedes (`supersedes`, or the same mined signature): they become `superseded` (status, `superseded_by`) and leave the active set; each one is audited as `rule.supersede`. A superseded rule cannot be approved again.'
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { type: object }
        "404": { description: 'Unknown rule.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'rule_state.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/rules/{rule_id}/reject:
    parameters: [ { $ref: "#/components/parameters/RuleId" } ]
    post:
      tags: [rules]
      operationId: rejectRule
      summary: Reject rule
      x-tt-roles: [rule-reviewer]
      description: 'Draft: rejected. Stale rule: retired (status rejected). Audited as rule.reject.'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { type: object }
        "404": { description: 'Unknown rule.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'rule_state.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/rules/{rule_id}/retire:
    parameters: [ { $ref: "#/components/parameters/RuleId" } ]
    post:
      tags: [rules]
      operationId: retireRule
      summary: Retire an approved rule (1.17.0)
      x-tt-roles: [rule-reviewer]
      description: |
        Takes an approved (or stale) rule out of the active set: it becomes `rejected` with `retired: true`, keeps its body,
        evidence and review in history, and leaves the next packs and worlds. The miner does not propose it again while its
        structure does not change. A draft is rejected (`rejectRule`), not retired. Audited as `rule.retire`.
        An approval that replaces a rule retires it by itself: it becomes `superseded` (audited as `rule.supersede`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        "200":
          description: The retired rule.
          content:
            application/json:
              schema: { type: object }
        "404": { description: 'Unknown rule.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'rule_state: only an approved or stale rule can be retired.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- archetypes, worlds, packs, exports, scenarios
  /api/v1/archetypes:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [worlds]
      operationId: listArchetypes
      summary: List archetypes
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: Archetypes of the latest build with the k they were built with (`built` false and no archetypes when there is no build yet; `k_min` is then the configured `world.k_min`). size is the number of distinct real subjects of the archetype.
          content:
            application/json:
              schema:
                type: object
                required: [k_min, built, archetypes]
                properties:
                  k_min: { type: integer, description: 'k of the latest build; every archetype has at least this many subjects.' }
                  built: { type: boolean }
                  profiles: { type: integer, description: 'Subjects profiled by the build.' }
                  dropped_subjects: { type: integer, description: 'Subjects left out because their group was smaller than k_min.' }
                  archetypes:
                    type: array
                    items:
                      type: object
                      required: [id, size, features]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        size: { type: integer, description: 'Distinct real subjects (≥ k_min).' }
                        features: { type: object }
  /api/v1/archetypes/build:
    post:
      tags: [worlds]
      operationId: buildArchetypes
      summary: Rebuild archetypes
      x-tt-roles: [operator]
      description: 'Waited for (see "Jobs" in the API description): the `202` usually carries `status: done` and `result` `{archetypes, profiles, dropped_subjects, k_min}`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [k_min]
              properties:
                k_min: { type: integer, minimum: 2, description: 'Required by tt-core (no server default).' }
      responses:
        "202": { description: 'The job: finished (status done), or running when it takes longer than the wait (see "Jobs").', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { description: 'bad_request: k_min missing.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_k: k_min below 2.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'no_events: no event store configured.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/worlds:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [worlds]
      operationId: listWorlds
      summary: List worlds
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: Generated worlds.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorldInfo" } }
    post:
      tags: [worlds]
      operationId: generateWorld
      summary: Generate world
      x-tt-roles: [operator]
      description: 'Waited for (see "Jobs"): the `202` usually carries the finished job, `result` is the `WorldInfo`. The world is a pure function of seed, rules, contracts and archetypes (docs/spec/rules.md §6).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seed, customers]
              properties:
                seed: { type: integer, minimum: 0 }
                customers: { type: integer, minimum: 1, maximum: 100000 }
                use_archetypes: { type: boolean, default: true }
                t0: { type: string, format: date-time }
                rules: { type: array, items: { type: string, pattern: "^r-[0-9]{4,}$" }, description: 'Approved rule ids; default all approved.' }
                services: { type: array, maxItems: 500, items: { type: string }, description: 'Scope of the world: only the approved rules and the contracts whose services are all in this list (the services of one team). Default: every service. A rule that needs a service outside the list is left out; naming it in `rules` is `422 rule_out_of_scope` with `details` (rule, services).' }
      responses:
        "202": { description: 'The job: finished (status done), or running when it takes longer than the wait (see "Jobs").', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { description: 'bad_request: seed or customers missing, or seed negative.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'no_rules (no approved rules) or no_archetypes (build them first or set use_archetypes false).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_customers, invalid_rules, invalid_services, rule_out_of_scope, invalid_t0, generation_failed, no_usable_rules (the group has approved rules and none can be used: `details` name the group''s own rules, with `reason` `out_of_scope` and the missing `services`, or `unusable` and `detail`; rules of other groups are never named).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/worlds/{world_id}:
    parameters: [ { name: world_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [worlds]
      operationId: getWorld
      summary: Get world
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: World summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldInfo" }
        "404": { description: 'Unknown world.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/worlds/{world_id}/customers:
    parameters: [ { name: world_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [worlds]
      operationId: listWorldCustomers
      summary: Page of the synthetic customers of a world
      x-tt-roles: [operator, publisher, auditor]
      description: The synthetic customers of a world (invented name and e-mail, archetype, entities owned per kind), sorted by id, for the world explorer in the UI. `q` keeps the customers whose id, name, e-mail or archetype contain it (case-insensitive). A page past the end is empty. Synthetic data only.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema:
                type: object
                required: [world_id, total, all, offset, limit, customers]
                properties:
                  world_id: { type: string }
                  total: { type: integer, description: 'Customers matching `q`.' }
                  all: { type: integer, description: 'Customers of the world.' }
                  offset: { type: integer }
                  limit: { type: integer }
                  customers:
                    type: array
                    items:
                      type: object
                      required: [id, entities]
                      properties:
                        id: { type: string, pattern: "^[A-Z]{2,5}-SYN-[0-9]{4,}$" }
                        name: { type: string }
                        email: { type: string }
                        archetype: { type: string }
                        entities: { type: object, additionalProperties: { type: integer }, description: 'Entities owned, per kind.' }
        "400": { description: 'bad_request: offset or limit not a non-negative integer, or q too long.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown world.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/worlds/{world_id}/customers/{customer_id}:
    parameters:
      - { name: world_id, in: path, required: true, schema: { type: string } }
      - { name: customer_id, in: path, required: true, schema: { type: string, pattern: "^[A-Z]{2,5}-SYN-[0-9]{4,}$" } }
    get:
      tags: [worlds]
      operationId: previewWorldCustomer
      summary: Preview one synthetic customer
      x-tt-roles: [operator, publisher, auditor]
      description: The `world.jsonl` lines of one synthetic customer (entities, history, pending effects), for the world preview in the UI. Synthetic data only.
      responses:
        "200":
          description: Lines of the customer.
          content:
            application/json:
              schema:
                type: object
                required: [world_id, customer, lines]
                properties:
                  world_id: { type: string }
                  customer: { type: string }
                  lines: { type: array, items: { type: object } }
        "404": { description: 'Unknown world or customer.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/packs:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [packs]
      operationId: listPacks
      summary: List packs
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: Packs with their gate verdict.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PackInfo" } }
    post:
      tags: [packs]
      operationId: buildPack
      summary: Build pack and run the gate
      x-tt-roles: [operator]
      description: |
        Assembles contracts, approved rules, world, faults and scenario presets; runs provenance, PII and k checks; asks
        keyguard for reverse-HMAC and signature. Waited for (see "Jobs"): the `202` usually carries the finished job and `result` is the
        `PackInfo`. A pack that fails the gate is stored with status `gate-failed` (and no archive) and is returned as
        a normal result; only a pack that passes is signed (`signed`). Signing at build time uses no approval; the
        approval is given at `publishPack`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [world_id]
              properties:
                world_id: { type: string }
                services: { type: array, items: { type: string }, description: 'Default: all with a contract.' }
                anonymize_hosts: { type: boolean, default: true, description: 'Replace external host names with aliases (M16).' }
                scenario_presets: { type: array, items: { type: string } }
                valid_days: { type: integer, minimum: 1, maximum: 3660, description: 'Sets manifest not_after = created_at + valid_days (docs/spec/pack.md section 2.1). Default: 30 days (every pack built by tt-core expires).' }
      responses:
        "202": { description: 'The job: finished (status done), or running when it takes longer than the wait (see "Jobs").', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { description: 'bad_request: world_id missing or invalid body.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown world.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'no_policies (no signed source policy: the gate cannot run) or world_stale.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_valid_days, world_integrity, unknown_service, missing_service, no_services, unknown_preset, invalid_preset.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/packs/{pack_id}:
    parameters: [ { $ref: "#/components/parameters/PackId" } ]
    get:
      tags: [packs]
      operationId: getPack
      summary: Get pack and gate report
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: Pack, manifest and gate report (findings never contain values). The list endpoint omits `manifest`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackInfo" }
        "404": { description: 'Unknown pack (also for a malformed pack id).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/packs/{pack_id}/publish:
    parameters: [ { $ref: "#/components/parameters/PackId" } ]
    post:
      tags: [packs]
      operationId: publishPack
      summary: Publish pack
      x-tt-roles: [publisher, admin]
      description: |
        Releases a signed pack to the tests ("Rilascia ai test"): tt-core asks keyguard to sign the pack again with
        the requester's approval (`X-TT-Approval`, docs/spec/keyguard.md §3.4); the signature must be identical
        (Ed25519 is deterministic), the pack is verified again and marked `published`. Publishing an already published
        pack returns it unchanged.

        A `publisher` publishes without a reason. A caller holding `admin` (also with `publisher`, since 1.4.1) MUST
        give a non-empty `reason` and publishes as admin; the publication is then `approval_mode: admin`, is audited and raises the alert `pack.admin_approval`
        (docs/spec/policy.md §5). No check is bypassed: reverse-HMAC positives and a failed gate still refuse.

        When keyguard verifies approvals with OIDC the requester needs a step-up ID token bound to this pack and its
        manifest (`oidcStepUp`, purpose `pack-publish`): `403 stepup_required` / `oidc_required` /
        `id_token_not_allowed` as for policy approvals; keyguard checks the binding and that `publisher` (or `admin`)
        is in the token's roles claim.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000, description: 'Required for a caller holding admin.' }
                id_token: { type: string, description: 'Optional step-up ID token obtained by the caller (see approvePolicy). Refused for local accounts.' }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackInfo" }
        "403": { description: 'admin_reason_required, keyguard_refused, stepup_required, oidc_required, id_token_not_allowed or id_token_invalid.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown pack.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'not_signed (gate failed), signature_changed, pack_expired (past its not_after), conflict.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/packs/{pack_id}/download:
    parameters: [ { $ref: "#/components/parameters/PackId" } ]
    get:
      tags: [packs]
      operationId: downloadPack
      summary: Download pack (.ttpack)
      x-tt-roles: [publisher]
      description: Only published packs. The archive includes `manifest.sig.json`. Every download is audited as `pack.download` (`admin_override` for an admin without `publisher`).
      responses:
        "200":
          description: 'Deterministic tar.gz archive (`Content-Disposition: attachment; filename="<pack_id>.ttpack"`).'
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "404": { description: 'Unknown pack.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'not_published.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/exports:
    post:
      tags: [exports]
      operationId: runExport
      summary: Export a pack to another mock tool
      x-tt-roles: [publisher]
      description: 'Verifies the pack with keyguard keys, converts it with the same code as the tt export command and keeps a zip for download. Waited for (see "Jobs"): the 202 usually carries the finished job, result {export_id, pack_id, target, status, report, download}.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pack_id, target]
              properties:
                pack_id: { type: string }
                target: { enum: [wiremock, microcks, prism] }
      responses:
        "202": { description: 'The job: finished (status done), or running when it takes longer than the wait (see "Jobs").', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { description: 'invalid_target: target must be wiremock, microcks or prism.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown pack (gate code).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'not_published: the pack is not published (gate code).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'export_failed: the pack could not be verified or exported.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: 'keyguard_unreachable: the pack keys could not be read from keyguard.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/exports/{export_id}:
    parameters: [ { name: export_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [exports]
      operationId: getExport
      summary: Export run and report
      x-tt-roles: [publisher, auditor]
      responses:
        "200":
          description: Status and export-report (what was lost in the conversion).
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id: { type: string }
                  pack_id: { type: string }
                  target: { type: string }
                  status: { enum: [running, done, failed] }
                  report: { type: object }
        "404": { description: 'not_found: unknown export.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/exports/{export_id}/download:
    parameters: [ { name: export_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [exports]
      operationId: downloadExport
      summary: Download export
      x-tt-roles: [publisher]
      responses:
        "200":
          description: 'Zip of the exported files (Content-Disposition attachment, named after export_id).'
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { description: 'not_found: unknown export, not done, or expired.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/scenario-presets:
    get:
      tags: [scenarios]
      operationId: listScenarioPresets
      summary: List mock scenario presets
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: Presets.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScenarioPreset" } }
    post:
      tags: [scenarios]
      operationId: createScenarioPreset
      summary: Create preset
      x-tt-roles: [operator]
      description: 'Stored in zone B and added to the pack whose build names it (scenario_presets). The gate checks its texts.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioPreset" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioPreset" }
        "400": { description: 'invalid_input: preset_id, name, description, customer with archetype, or an outcome without rule and outcome.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'preset_exists: the id is taken.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/scenario-presets/{preset_id}:
    parameters: [ { name: preset_id, in: path, required: true, schema: { type: string } } ]
    put:
      tags: [scenarios]
      operationId: updateScenarioPreset
      summary: Update preset
      x-tt-roles: [operator]
      description: 'preset_id may be omitted in the body (it is taken from the path); when given it must equal the path.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioPreset" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioPreset" }
        "400": { description: 'invalid_input: as for create, or preset_id differs from the path.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'not_found: unknown preset.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [scenarios]
      operationId: deleteScenarioPreset
      summary: Delete preset
      x-tt-roles: [operator]
      responses:
        "204": { description: 'Deleted.' }
        "404": { description: 'not_found: unknown preset.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- id formats (1.18.0)
  /api/v1/id-formats:
    get:
      tags: [worlds]
      operationId: listIdFormats
      summary: Id formats of a group (docs/spec/pack.md §4.3)
      x-tt-roles: [operator, publisher, auditor, rule-reviewer]
      description: |
        The formats chosen by a person for the synthetic ids of an id domain (an HMAC domain: every field of the
        group that carries ids of that domain). They are templates, never values from the traffic: worlds, packs
        and mocks generate ids in that shape instead of `<PREFIX>-SYN-NNNN`. A world generated before a change
        becomes stale (generate it again).
      parameters:
        - { name: group, in: query, required: false, schema: { type: string }, description: 'Group ("" for a console without groups).' }
      responses:
        "200":
          description: The formats.
          content:
            application/json:
              schema:
                type: object
                required: [formats]
                properties:
                  formats: { type: array, items: { $ref: "#/components/schemas/IdFormat" } }
  /api/v1/id-formats/preview:
    post:
      tags: [worlds]
      operationId: previewIdFormat
      summary: Check a format and show its first three ids
      x-tt-roles: [operator, publisher, auditor, rule-reviewer]
      description: 'Always 200: an invalid format answers `valid: false` with the error code and its position (0-based).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format]
              properties:
                format: { type: string, maxLength: 64 }
                domain: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$" }
      responses:
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  preview: { type: array, items: { type: string } }
                  capacity_label: { type: string, description: 'How many different ids the format can give.' }
                  error: { $ref: "#/components/schemas/IdFormatError" }
  /api/v1/id-formats/{domain}:
    parameters:
      - { name: domain, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$" } }
    put:
      tags: [worlds]
      operationId: setIdFormat
      summary: Set the id format of a domain in a group
      x-tt-roles: [operator, rule-reviewer]
      description: 'Audited as `idformat.set` (group, domain, format: structure only).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format]
              properties:
                group: { type: string }
                format: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The stored format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdFormat" }
        "422": { description: 'invalid_format (details: [{code, at}]), invalid_domain, invalid_group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [worlds]
      operationId: deleteIdFormat
      summary: Remove the id format of a domain (back to <PREFIX>-SYN-NNNN)
      x-tt-roles: [operator, rule-reviewer]
      description: 'Audited as `idformat.delete`.'
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "404": { description: 'not_found.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/date-offsets:
    get:
      tags: [worlds]
      operationId: listDateOffsets
      summary: Relative dates chosen in the console (docs/spec/pack.md §4.4, 1.23.0)
      x-tt-roles: [operator, publisher, auditor, rule-reviewer]
      description: |
        The ranges of offsets (`+30d` … `+365d`) a person chose for the date fields of a group, by property name. When the
        inputs of a world are prepared they are written into `x-tt-value.date_offset` of every date property with that
        name, over the range learned from the traffic; worlds and mocks generate those dates as clock + an offset of the
        range. A world generated before a change does not see it (generate it again).
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The ranges.
          content:
            application/json:
              schema:
                type: object
                required: [offsets]
                properties:
                  offsets: { type: array, items: { $ref: "#/components/schemas/DateOffset" } }
  /api/v1/date-offsets/{field}:
    parameters:
      - { name: field, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_-]{0,63}$" } }
    put:
      tags: [worlds]
      operationId: setDateOffset
      summary: Set the relative date of a field name in a group
      x-tt-roles: [operator, rule-reviewer]
      description: 'Offsets match `^[+-]?[0-9]{1,6}(h|d)$`, at most 36600 days, min <= max. Audited as `dateoffset.set`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [min, max]
              properties:
                group: { type: string }
                min: { type: string, example: "+30d" }
                max: { type: string, example: "+365d" }
      responses:
        "200":
          description: The stored range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateOffset" }
        "422": { description: 'invalid_offset, invalid_field, invalid_group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [worlds]
      operationId: deleteDateOffset
      summary: Remove the relative date of a field (the learned range applies again)
      x-tt-roles: [operator, rule-reviewer]
      description: 'Audited as `dateoffset.delete`.'
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "404": { description: 'not_found.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- mock registry (1.12.0)
  /api/v1/mocks:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [mocks]
      operationId: listMocks
      summary: Mocks connected to the console
      x-tt-roles: [operator, publisher, auditor]
      description: |
        Every mock in console mode (`tt mock --console`) that reported in the last day: started by tt-core in
        Kubernetes (`managed: true`) or installed by the user (container, Helm chart). The registry is in memory: after a
        restart of tt-core the mocks show again at their next report (seconds). `managed` lists the mocks tt-core
        runs itself; `environment.kubernetes` says whether it can (`mock.kubernetes.enabled`).
      responses:
        "200":
          description: Mocks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockList" }
  /api/v1/mocks/prepare:
    post:
      tags: [mocks]
      operationId: prepareMock
      summary: Prepare and start the mock of a group ("Prepara e avvia il mock")
      x-tt-roles: [operator]
      description: |
        One action for the whole chain, as a `Job` of kind `mock.prepare` followed with `GET /api/v1/jobs/{job_id}`:
        `progress.steps` (and `result.steps` at the end) list `archetypes` (built for the group; skipped with
        `no_archetypes` when the group has too few customers, the world then uses invented ones), `world`
        (`customers` default 50, `seed` default 42), `pack` (assembly, gate, keyguard signature as `buildPack`, with the
        stored scenario presets; `presets_skipped` when one does not fit the group), `publish` (as `publishPack`: a
        publisher, or an admin with `reason`; an operator without the publisher role stops here with
        `waiting`/`needs_publisher` and the job ends `done` with `result.waiting`), `mock` (`managed`: started in
        Kubernetes; `connected`: the connected mocks switch to the new pack at their next report; `none_connected`).
        Each step is audited as the operation it stands for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group]
              properties:
                group: { $ref: "#/components/schemas/GroupName" }
                reason: { type: string, maxLength: 500, description: 'Mandatory for an admin (the publication is an admin approval).' }
                start: { type: boolean, default: true, description: 'Start the managed mock when the console can (Kubernetes).' }
                customers: { type: integer, minimum: 1, maximum: 10000, default: 50 }
                seed: { type: integer, minimum: 0, default: 42 }
      responses:
        "202":
          description: The job (final when it took less than about 3 seconds).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409": { description: 'already_running: the mock of this group is being prepared.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_group, unknown_group, invalid_customers, invalid_seed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/tokens:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [mocks]
      operationId: listMockTokens
      summary: Mock tokens (never their secrets)
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: Tokens, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MockToken" } }
    post:
      tags: [mocks]
      operationId: createMockToken
      summary: Create a mock token
      x-tt-roles: [operator]
      description: |
        A token for `tt mock --console` (`TT_MOCK_TOKEN`), scoped to one group: it downloads only the latest published
        pack of that group and posts the mock's report (`/api/v1/mock-agent`); it is no console session and opens nothing
        else. Only its SHA-256 is stored: the secret is in this answer only, with the `setup` snippets (env, docker run,
        Helm values and commands, OpenShift) filled in. Audited as `mock.token_create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group]
              properties:
                group: { $ref: "#/components/schemas/GroupName" }
                label: { type: string, maxLength: 64 }
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 180 }
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewMockToken" }
        "422": { description: 'invalid_group, unknown_group, invalid_label, invalid_expiry.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/tokens/{token_id}:
    parameters: [ { name: token_id, in: path, required: true, schema: { type: string, pattern: "^mtk-[0-9a-f]{24}$" } } ]
    delete:
      tags: [mocks]
      operationId: revokeMockToken
      summary: Revoke a mock token
      x-tt-roles: [operator]
      description: 'Its mocks are refused from their next report on (a mock in console mode then stops). Audited as `mock.token_revoke`.'
      responses:
        "204": { description: Revoked. }
        "404": { description: 'not_found.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/managed:
    post:
      tags: [mocks]
      operationId: startManagedMock
      summary: Start (or refresh) the mock of a group in Kubernetes
      x-tt-roles: [operator]
      description: |
        With `mock.kubernetes.enabled` tt-core applies, in its mock namespace and with its service account (a Role on
        secrets, services, deployments and routes of that namespace only), a Secret (new mock token, control token,
        console CA), a Service, an OpenShift Route when the cluster has routes, and a Deployment running
        `tt mock --console`. A refresh issues a new token (new pods) and revokes the previous one. Audited as `mock.start`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group]
              properties:
                group: { $ref: "#/components/schemas/GroupName" }
      responses:
        "200":
          description: The managed mock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedMock" }
        "409": { description: 'kubernetes_disabled: this console does not start mocks itself; run the container or the Helm chart with a mock token.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: 'kubernetes_forbidden (the Role is missing), kubernetes_failed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: 'no_gate_keys: keyguard did not give the gate keys.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/managed/{group}:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    delete:
      tags: [mocks]
      operationId: stopManagedMock
      summary: Stop the managed mock of a group
      x-tt-roles: [operator]
      description: 'Deletes its Deployment, Service, Route and Secret and revokes its token. Audited as `mock.stop`.'
      responses:
        "204": { description: Stopped. }
        "404": { description: 'not_found: no managed mock for the group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'kubernetes_disabled.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/managed/{group}/restart:
    parameters: [ { $ref: "#/components/parameters/Group" } ]
    post:
      tags: [mocks]
      operationId: restartManagedMock
      summary: Restart the managed mock of a group (new pods, new token)
      x-tt-roles: [operator]
      description: 'Audited as `mock.restart`. The sessions of the mock start again from the pack.'
      responses:
        "200":
          description: The managed mock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedMock" }
        "404": { description: 'not_found.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/pages:
    get:
      tags: [mocks]
      operationId: getMockPages
      summary: Third-party pages of a group's mocks (docs/spec/mock.md §9, 1.23.0)
      x-tt-roles: [operator, publisher, auditor]
      description: |
        Payment or e-signature pages the application sends the browser to: buttons, return URL, server-to-server callback
        (optional HMAC signature), links in the answers of contract operations, automatic outcomes. The group's
        console-mode mocks receive the configuration (with the HMAC keys, test secrets) in the answer to their report;
        this answer never shows the keys (empty).
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockPages" }
    put:
      tags: [mocks]
      operationId: setMockPages
      summary: Replace the third-party pages of a group
      x-tt-roles: [operator]
      description: 'Validated as in docs/spec/mock.md §9.1 (`Page` of the control API); an empty HMAC key keeps the stored key of the page with the same id. Audited as `mock.pages_set` (ids, never keys).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pages]
              properties:
                group: { type: string }
                pages: { type: array, maxItems: 32, items: { type: object, description: 'Page of control-api.v1 (components/schemas/Page).' } }
      responses:
        "200":
          description: The pages (keys empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockPages" }
        "422": { description: 'invalid_pages (message names the page and field), invalid_group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/identity:
    get:
      tags: [mocks]
      operationId: getMockIdentity
      summary: Session per user of a group's mocks (docs/spec/mock.md §2.6)
      x-tt-roles: [operator, publisher, auditor]
      description: |
        Real applications cannot send `X-TT-Session`. With this setting every console-mode mock of the group reads the
        configured header (any name) or a claim of the JWT it carries and maps its value, with the group's keyed hash,
        to its own session (`u-` + 16 hex) and to a synthetic customer of the world, the same at every call and after
        restarts. Mapped users are stored only as keyed hashes. `enabled` is false and `header` empty when off.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockIdentity" }
    put:
      tags: [mocks]
      operationId: setMockIdentity
      summary: Set header and JWT claim of the session per user ("" header turns it off)
      x-tt-roles: [operator]
      description: 'The group''s mocks receive it with the answer to their next report (seconds, no restart). Audited as `mock.identity_set`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                group: { type: string }
                header: { type: string, maxLength: 64 }
                claim: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockIdentity" }
        "422": { description: 'invalid_header, invalid_claim, invalid_group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/identity/map:
    post:
      tags: [mocks]
      operationId: mapMockIdentityUser
      summary: Give a test user a chosen synthetic customer
      x-tt-roles: [operator]
      description: 'The user is hashed with the group''s key at once and never stored, logged or audited in clear (the audit has the first 8 hex of the hash). Audited as `mock.identity_map_set`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user, customer]
              properties:
                group: { type: string }
                user: { type: string, minLength: 1, maxLength: 1024 }
                customer: { type: string, pattern: "^[A-Z]{2,5}-SYN-[0-9]{4,}$" }
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockIdentity" }
        "422": { description: 'invalid_user, invalid_customer, too_many_users (1000 per group).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/identity/map/{hash}:
    parameters:
      - { name: hash, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
    delete:
      tags: [mocks]
      operationId: unmapMockIdentityUser
      summary: Remove a mapped user
      x-tt-roles: [operator]
      description: 'Audited as `mock.identity_map_delete`.'
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockIdentity" }
        "404": { description: 'not_found.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/{mock_id}/calls:
    parameters:
      - { $ref: "#/components/parameters/MockId" }
      - { name: since, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 'Only calls with a greater seq.' }
    get:
      tags: [mocks]
      operationId: listMockCalls
      summary: Last calls of a mock (live journal)
      x-tt-roles: [operator, publisher, auditor]
      description: 'The last 500 call summaries reported by the mock: method, path (no query string), status, session, scenario, fault, latency. Never headers or bodies.'
      responses:
        "200":
          description: Calls.
          content:
            application/json:
              schema:
                type: object
                required: [calls, last_seq]
                properties:
                  calls: { type: array, items: { $ref: "#/components/schemas/MockCall" } }
                  last_seq: { type: integer }
        "404": { description: 'not_found: unknown mock.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/{mock_id}/commands:
    parameters: [ { $ref: "#/components/parameters/MockId" } ]
    post:
      tags: [mocks]
      operationId: sendMockCommand
      summary: Queue a control call for a mock (sessions, scenarios, faults, virtual clock)
      x-tt-roles: [operator]
      description: |
        The mock runs it on its own control API (`api/control-api.v1.openapi.yaml`) when it picks it up (its report
        is held by the console until a command arrives: milliseconds) and reports the answer. Allowed paths:
        `/__tt/pack`, `/__tt/scenarios`, `/__tt/customers`, `/__tt/sessions`, `/__tt/sessions/{id}` and its
        `reset`, `customer`, `clock`, `clock/advance`, `faults`, `scenario`, `entities`; never the journal. Changes
        (not GET) are audited as `mock.command`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, path]
              properties:
                method: { enum: [GET, POST, PUT, DELETE] }
                path: { type: string, examples: ["/__tt/sessions/default/clock/advance"] }
                body: { description: 'JSON body of the control call.' }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [command_id, status]
                properties:
                  command_id: { type: string }
                  status: { const: pending }
        "404": { description: 'not_found: unknown mock.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'mock_offline: the mock is not reporting.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'invalid_command: method or path not allowed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: 'too_many_commands.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mocks/{mock_id}/commands/{command_id}:
    parameters:
      - { $ref: "#/components/parameters/MockId" }
      - { name: command_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mocks]
      operationId: getMockCommand
      summary: Answer of a queued command
      x-tt-roles: [operator, publisher, auditor]
      responses:
        "200":
          description: The command; `result` once the mock ran it (kept 10 minutes).
          content:
            application/json:
              schema:
                type: object
                required: [command_id, status, method, path]
                properties:
                  command_id: { type: string }
                  status: { enum: [pending, done] }
                  method: { type: string }
                  path: { type: string }
                  result:
                    type: object
                    properties:
                      status: { type: integer }
                      body: { description: 'The control API answer.' }
        "404": { description: 'not_found.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mock-agent/pack:
    get:
      tags: [mocks]
      operationId: mockAgentPack
      summary: The latest published pack of the token's group (for tt mock --console)
      security: [ { mockToken: [] } ]
      x-tt-roles: []
      description: 'Called by the mock, not by people. The `.ttpack` archive with `X-TT-Pack-Id` and `ETag`; `If-None-Match` answers 304. The mock verifies it as a file (signature with TT_GATE_PUBKEYS) and refuses a pack whose manifest `group` is not its own. Audited as `pack.download` (actor `tt-mock/<token_id>`).'
      responses:
        "200": { description: The pack., content: { application/gzip: { schema: { type: string, format: binary } } } }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 'no_pack: the group has no published pack.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mock-agent/report:
    post:
      tags: [mocks]
      operationId: mockAgentReport
      summary: Report of a mock (status, URLs, sessions, calls, command results)
      security: [ { mockToken: [] } ]
      x-tt-roles: []
      description: 'Called by the mock every few seconds. The answer is held (long poll, at most `mock.report_interval`) until a command is queued, a pack is published or the token revoked; it carries the latest published pack id and the queued commands (at most 10). A report for another group than the token''s is refused (403 wrong_group).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockReport" }
      responses:
        "200":
          description: Latest pack and commands.
          content:
            application/json:
              schema:
                type: object
                required: [pack_id, commands]
                properties:
                  pack_id: { type: string }
                  commands: { type: array, items: { type: object, properties: { id: { type: string }, method: { type: string }, path: { type: string }, body: {} } } }
                  interval_s: { type: integer }
                  held: { type: boolean }
                  identity:
                    description: 'Session per user of the group (1.18.0), absent when the group has none (the mock keeps its own flags). `header` "" turns it off. `key` is the group''s hashing key (base64url), `map` has hashed users only (`h:` + 32 hex).'
                    type: object
                    required: [header]
                    properties:
                      header: { type: string }
                      claim: { type: string }
                      key: { type: string }
                      map: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: 'wrong_group.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- quarantine, webhooks, store, audit, events
  /api/v1/quarantine:
    get:
      parameters: [ { $ref: "#/components/parameters/GroupFilter" } ]
      tags: [quarantine]
      operationId: listQuarantine
      summary: Quarantine queue
      x-tt-roles: [operator, policy-approver, auditor]
      responses:
        "200":
          description: keep fields, names, path segments and hosts in quarantine (docs/spec/event.md §5.2).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/QuarantineItem" } }
  /api/v1/quarantine/{item_id}/resolve:
    parameters: [ { name: item_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [quarantine]
      operationId: resolveQuarantine
      summary: Resolve quarantine item
      x-tt-roles: [policy-approver]
      description: |
        `close` keeps the element closed for good: one approval by a policy-approver takes effect at once (state `resolved`).
        `dismiss` lifts the quarantine, which opens data: the first call is recorded as an approval (state
        `dismiss-pending`) and the quarantine is lifted only by a second call from a different policy-approver (state
        `resolved`). The same user approving the same resolution twice gets `409 duplicate_approval`. **Admin override
        (1.6.0):** a caller holding `admin` (also with `policy-approver`) resolves alone: `close` and `dismiss` take
        effect at once, audited with `approval_mode: admin` and `quarantine.admin_override`; a dismissal also raises
        `keyguard.alert` with `alert: quarantine.admin_override`. An admin never counts as one of the two
        policy-approvers. At every call, earlier approvals of users now disabled or no longer entitled
        are dropped (audit `quarantine.approval_dropped`), so two currently entitled persons are always needed. A closed item called with `close`, or a released item, returns its current
        state with no change. Audited as `quarantine.close` or `quarantine.dismiss`.

        When keyguard verifies approvals with OIDC, each `dismiss` approval needs a step-up ID token bound to the item
        (`oidcStepUp`, purpose `quarantine-dismiss`; `403 stepup_required`, `oidc_required`, `id_token_not_allowed`,
        `id_token_invalid`). keyguard takes no part in quarantine resolutions: the token is verified by tt-core only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution]
              properties:
                resolution: { enum: [close, dismiss] }
                id_token: { type: string, description: 'Optional step-up ID token obtained by the caller for a dismissal (purpose quarantine-dismiss). Refused for local accounts.' }
                note: { type: string, maxLength: 1000, description: 'Length-checked, not stored.' }
      responses:
        "200":
          description: Item state after this action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuarantineItem" }
        "400": { description: 'invalid_input: resolution not close or dismiss, or note longer than 1000 characters.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: 'forbidden: missing role; stepup_required, oidc_required, id_token_not_allowed, id_token_invalid (dismiss with OIDC, also for an admin).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'not_found: unknown item.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 'duplicate_approval: this user already approved this resolution.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List webhooks
      x-tt-roles: [admin, operator, auditor]
      responses:
        "200":
          description: Webhooks.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Create webhook
      x-tt-roles: [admin]
      description: |
        Only destinations matching the allow list `TT_WEBHOOK_ALLOW` (`host`, `host:port` or `*.suffix`; an empty list
        allows none) are accepted, over https unless the installation allows plain http; redirects are never followed.
        At delivery the name is resolved by tt-core itself and the connection goes to the address it checked, never
        through an environment proxy: loopback, link-local (169.254.169.254 included), RFC 1918, CGNAT, ULA, multicast
        and other non-public addresses are refused (delivery error `connection`) unless that exact IP literal is an
        allow-list entry (`10.0.0.5` or `10.0.0.5:8443`). An allow-listed name pointing at an internal address does not
        open it.
        Payloads contain kinds, counts and identifiers, never values, and are signed with
        `X-TT-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, "<t>." || body)>`. Deliveries are queued and retried with
        exponential back-off (6 attempts). When the request has no `secret`, the server generates one and returns it
        **once** in the `201` answer; later answers only say `secret_set`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Webhook" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: 'invalid_input: malformed body, unknown or repeated event, no event, name missing or over 120 characters, secret outside 16..256 characters, url not https, or destination not in the allow list.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/webhooks/{webhook_id}:
    parameters: [ { name: webhook_id, in: path, required: true, schema: { type: string } } ]
    put:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Update webhook
      x-tt-roles: [admin]
      description: Replaces name, url and events; the secret changes only when `secret` is given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Webhook" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: 'invalid_input (as createWebhook).', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown webhook.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [webhooks]
      operationId: setWebhookEnabled
      summary: Enable or disable a webhook
      x-tt-roles: [admin]
      description: Audited as `webhook.enable` or `webhook.disable`. Notifications raised while the webhook is off are not queued for it; those already queued are dropped as `webhook_disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The webhook after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: 'invalid_input: enabled missing.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 'Unknown webhook.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete webhook
      x-tt-roles: [admin]
      responses:
        "204": { description: 'Deleted.' }
        "404": { description: 'Unknown webhook.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/webhooks/{webhook_id}/test:
    parameters: [ { name: webhook_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [webhooks]
      operationId: testWebhook
      summary: Send a test notification
      x-tt-roles: [admin]
      responses:
        "204": { description: 'Sent.' }
        "404": { description: 'Unknown webhook.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: 'delivery_failed: the destination did not accept the test notification.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/webhooks/{webhook_id}/deliveries:
    parameters: [ { name: webhook_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: Delivery log of a webhook
      x-tt-roles: [admin, operator, auditor]
      description: One entry per notification with its state and attempts; bodies are not kept in the log.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Deliveries, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "404": { description: 'Unknown webhook.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/store/retention:
    get:
      tags: [store]
      operationId: getRetention
      summary: Get retention
      x-tt-roles: [admin, auditor]
      responses:
        "200":
          description: Retention settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retention" }
    put:
      tags: [store]
      operationId: setRetention
      summary: Set retention
      x-tt-roles: [admin]
      description: 'events_days must be between 1 and 365. aggregates_days is not settable: it follows contract.keep_snapshots and the snapshot window of the configuration, and any other value gets 422 not_supported. Audited as store.retention.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Retention" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retention" }
        "400": { description: 'invalid_input: events_days out of range.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'not_supported: aggregates_days differs from the configured value.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/store/purge:
    post:
      tags: [store]
      operationId: purgeStore
      summary: Purge events
      x-tt-roles: [admin]
      description: 'Deletes the events and tokens received before the given instant. Purge by service is refused (422 not_supported): purge is by time only. A background job: the 202 carries the job in `running` (millions of events take minutes); follow it at GET /api/v1/jobs/{job_id}, whose `progress` has {phase, events, tokens, events_estimated} and whose `result` ends as {events, tokens}. Deletes in small transactions, so ingestion is not starved. One purge at a time (409 purge_running). Audited at the start (`store.purge.start`) and at the end (`store.purge`, outcome and counts).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [before]
              properties:
                before: { type: string, format: date-time }
                service: { type: string }
      responses:
        "202": { description: 'The purge job, running.', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { description: 'purge_running: another purge is still running.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "400": { description: 'invalid_input: before is missing or not a date-time.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 'not_supported: purge by service.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: 'purge_failed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/store/usage:
    get:
      tags: [store]
      operationId: getStoreUsage
      summary: Storage usage, retention and budget
      x-tt-roles: [admin, auditor]
      description: 'The database file (size, write-ahead log, reclaimable free pages, auto_vacuum mode), its budget (`storage.max_bytes`, watermarks, level ok | high | critical | over), and per dataset the bytes measured by the last maintenance run (pages of its tables and indexes; `file_bytes` for data kept outside the database, such as the audit archive), its quota, its retention policy (a code and its parameters) and what the last run removed. Also the last and next maintenance run, the rollup tiers and the audit archive. Sizes per dataset are measured in the background (they read every page); the file sizes are live.'
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreUsage" }
  /api/v1/store/maintenance:
    post:
      tags: [store]
      operationId: runStoreMaintenance
      summary: Run the data lifecycle now
      x-tt-roles: [admin]
      description: 'Starts the maintenance that otherwise runs every `retention.purge_interval`: the retention of every dataset (raw events after rollup, rollup compaction, contract snapshot compaction, webhook deliveries, resolved alerts, miner runs, packs, worlds, Fleet leftovers, sessions, audit archive segments), then the incremental vacuum, the measurement per dataset and the budget (shedding the least valuable data when over the critical watermark; ingestion is never blocked). A background job (`store.maintenance`): follow it at GET /api/v1/jobs/{job_id}; `progress` has {phase, done, total} and `result` the run report. Deletes in small transactions. Audited at the start (`store.maintenance.start`) and at the end (`store.maintenance`).'
      responses:
        "202": { description: 'The maintenance job, running.', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { description: 'maintenance_running: a run is in progress.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/store/traffic:
    get:
      tags: [store]
      operationId: getStoreTraffic
      summary: Traffic over time (rollups)
      x-tt-roles: [admin, operator, auditor]
      description: 'Calls, errors and latency per time bucket from the rollups, which outlive the raw events: hourly buckets for `retention.rollups.hourly`, then daily for `retention.rollups.daily`, then monthly forever. A point keeps the tier of its data (`tier`): asking hourly steps over an old period returns daily or monthly points. Counts only, never values. Default period: the last 7 days.'
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: op, in: query, schema: { type: string } }
        - { name: dir, in: query, schema: { enum: [inbound, outbound] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: step, in: query, schema: { enum: [hour, day, month], default: hour } }
      responses:
        "200":
          description: The time series.
          content:
            application/json:
              schema:
                type: object
                required: [step, points]
                properties:
                  step: { enum: [hour, day, month] }
                  from: { type: string, format: date-time }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket: { type: string, format: date-time }
                        tier: { enum: [hour, day, month] }
                        calls: { type: integer }
                        server_errors: { type: integer }
                        client_errors: { type: integer }
                        latency_avg_ms: { type: integer }
                        latency_p50_ms: { type: integer }
                        latency_p95_ms: { type: integer }
                        latency_max_ms: { type: integer }
        "400": { description: 'invalid_query.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Export the tt-core audit log
      x-tt-roles: [auditor]
      description: 'Entries always come in seq order. **Forward paging:** the entries with seq greater than after_seq, at most limit of them; to read the next page pass the seq of the last entry received as after_seq; an empty answer is the end of the log. **Tail paging** (to show the newest entries of a long log without reading it all): `last=N` returns the newest N entries; `before_seq=S` returns the entries below S (N = `last`, else `limit`), so the next older page is `before_seq` = the first seq received, and the start of the log is reached when the first seq is 1. Tail and forward paging cannot be combined. Each line is one AuditEntry (action and prev_hash included). Each export is itself audited as audit.export (the export of a tail includes its own entry as the newest).'
      parameters:
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 100000 } }
        - { name: last, in: query, schema: { type: integer, minimum: 1, maximum: 100000 }, description: 'Tail paging: the newest N entries (before before_seq when given).' }
        - { name: before_seq, in: query, schema: { type: integer, minimum: 1 }, description: 'Tail paging: only entries with seq below this value.' }
      responses:
        "200":
          description: JSON Lines, one entry per line (append-only, hash-chained).
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/AuditEntry" }
        "400": { description: 'invalid_query: after_seq, limit, last or before_seq out of range, or tail and forward paging combined.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/verify:
    get:
      tags: [audit]
      operationId: verifyAudit
      summary: Verify the hash chain
      x-tt-roles: [auditor]
      description: Detects edits, deletions, insertions and renumbering. Truncation of the newest entries is detected only by comparing head_hash with a value kept outside the database. Old entries archived as signed segments are not missing entries; the remaining chain must link to the head of the last segment and the segments to each other.
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, entries, head_seq, head_hash]
                properties:
                  ok: { type: boolean }
                  entries: { type: integer }
                  head_seq: { type: integer }
                  head_hash: { type: string }
                  archived: { type: integer, description: 'Entries moved to archived segments (docs/DATA_LIFECYCLE.md): the chain is verified from the head hash of the last segment, the segments from the genesis; `tt audit verify-archive` checks the files.' }
                  segments: { type: integer }
                  error: { type: string }
        details: { type: array, items: { type: object }, description: 'Failed long request: the `details` of its error answer (for example no_usable_rules: rule, reason, services).' }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/keyguard/audit:
    get:
      tags: [audit]
      operationId: getKeyguardAudit
      summary: keyguard audit log (proxied)
      x-tt-roles: [auditor]
      parameters:
        - { name: since_seq, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Entries of keyguard's own hash-chained log (counts and identifiers only).
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "400": { description: 'bad_request: since_seq is not a non-negative integer.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: 'keyguard_unreachable: keyguard did not answer.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/keyguard/status:
    get:
      tags: [system]
      operationId: getKeyguardStatus
      summary: keyguard status
      x-tt-roles: [operator, policy-approver, auditor]
      responses:
        "200":
          description: Reachability, key ids (never keys), match budget, OIDC verification of approvals. When keyguard does not answer, the 200 has reachable false and no other field.
          content:
            application/json:
              schema:
                type: object
                required: [reachable]
                properties:
                  reachable: { type: boolean }
                  hmac_kids: { type: array, items: { type: string } }
                  epochs: { type: array, items: { type: string } }
                  approvals_unverified: { type: boolean, description: 'True when keyguard has no OIDC issuer configured.' }
                  match_budget_left: { type: integer }
                  policy_kid: { type: string, description: 'Kid of the policy signing key in use.' }
                  pack_kid: { type: string, description: 'Kid of the pack signing key in use.' }
                  revoked_kids: { type: array, items: { type: string } }
                  opening_approvals: { type: integer, enum: [1, 2], description: 'Approvals needed by a change that opens data (TT_KEYGUARD_OPENING_APPROVALS).' }
                  admin_override: { type: boolean, description: 'Single admin approval with a reason is accepted (TT_KEYGUARD_ADMIN_OVERRIDE).' }
                  transport: { type: string, description: 'Transport reported by the keyguard client.' }
  /api/v1/events/export:
    post:
      tags: [events]
      operationId: exportEvents
      summary: Event-level export (zone B only)
      x-tt-roles: [event-exporter]
      description: |
        Exports tokenized events for process-mining analysis inside zone B. The file is pseudonymous personal data:
        it must not leave zone B. Every export is audited and notified to admins (`keyguard.alert`, `alert: events.export`;
        with `admin_override: true` for an admin without `event-exporter`). Waited for (see "Jobs"): the 202 usually carries the finished
        job, whose result has format, bytes, events (absent for ocel2-json), download (the path of the file) and notice.
        The file is read with GET /api/v1/events/export/{job_id}/download, by the same user only (or an admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, format]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                service: { type: string }
                format: { enum: [ocel2-json, jsonl] }
      responses:
        "202": { description: 'The job: finished (status done), or running when it takes longer than the wait (see "Jobs").', content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { description: 'invalid_input: from and to required with from before to, or format not ocel2-json or jsonl.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: 'export_failed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/events/export/{job_id}/download:
    parameters: [ { name: job_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [events]
      operationId: downloadEventExport
      summary: Download an event export (extension)
      x-tt-roles: [event-exporter]
      description: |
        Extension of the earlier contract. Only the user who ran the export gets the file, or an admin (admin override:
        audited with `admin_override` and `owner`, and alerted as `events.admin_download` when the export is someone
        else's). Pseudonymous personal data: it must not leave zone B. Audited as events.download.
      responses:
        "200":
          description: The export, in the format asked for (application/json for ocel2-json, application/x-ndjson for jsonl). Content-Disposition attachment.
          content:
            application/json:
              schema: { type: string, format: binary }
            application/x-ndjson:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'not_found: unknown job, not yours, not done, or expired.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/jobs:
    get:
      tags: [system]
      operationId: listJobs
      summary: Jobs, queued and running ones included
      x-tt-roles: [any]
      description: 'The jobs the caller may read (as `getJob`: own and joined ones; every job for an admin or an auditor), newest first, without `result` and `progress` (read one job for those). `heavy` tells how many heavy jobs may run at once (`slots`), run and wait.'
      parameters:
        - { name: status, in: query, schema: { enum: [queued, running, done, failed] } }
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, heavy]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
                  heavy:
                    type: object
                    required: [slots, running, queued]
                    properties:
                      slots: { type: integer }
                      running: { type: integer }
                      queued: { type: integer }
        "400": { description: 'bad_request: unknown status.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/jobs/{job_id}:
    parameters: [ { name: job_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [system]
      operationId: getJob
      summary: Job status
      x-tt-roles: [any]
      description: 'Any authenticated user. The job is visible to its owner, to an admin and to an auditor; for anyone else, and after expiry, the answer is 404.'
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: 'not_found: unknown, expired, or not visible to you.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Version
      x-tt-roles: [any]
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  spec: { type: string, examples: ["1.6.0"], description: 'Version of this file that tt-core implements.' }
                  installation_name: { type: string, description: 'Label set with `updateSettings` (empty when none), for the console header; any authenticated user can read it.' }
                  environment: { enum: ["", production, staging, development], description: 'Environment label set with `updateSettings`.' }
  /api/v1/gate/keys:
    get:
      tags: [system]
      operationId: getGateKeys
      summary: Public keys of the publication gate (TT_GATE_PUBKEYS for tt mock)
      description: Public keys only, fetched from keyguard. With `format=txt` the answer is the `gate-keys.txt` file (one `kid:base64url` per line, `#` comments), usable as `TT_GATE_PUBKEYS=./gate-keys.txt`.
      x-tt-roles: [any]
      parameters:
        - { name: format, in: query, required: false, schema: { enum: [json, txt] } }
      responses:
        "200":
          description: The TT_GATE_PUBKEYS value, the keys and a ready command.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tt_gate_pubkeys: { type: string }
                  keys: { type: array, items: { type: object, properties: { kid: { type: string }, public_key: { type: string } } } }
                  file_name: { type: string }
                  command: { type: string }
            text/plain:
              schema: { type: string }
        "502": { description: keyguard did not answer. }
  /api/v1/scope:
    get:
      tags: [system]
      operationId: getScope
      summary: Groups and the groups of each observed service (console Group/Team filter)
      x-tt-roles: [any]
      responses:
        "200":
          description: '`mine` are the groups the caller created enrollment tokens for or proposed a policy of; `services` maps each observed service to the groups of the sources whose events carry it.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { type: string } }
                  mine: { type: array, items: { type: string } }
                  services: { type: object, additionalProperties: { type: array, items: { type: string } } }
  /api/v1/sources/key-check:
    get:
      tags: [system]
      operationId: getSourceKeyCheck
      summary: Sources whose HMAC key id keyguard does not hold
      x-tt-roles: [operator, policy-approver, auditor]
      responses:
        "200":
          description: Key ids only. A source listed here makes tokens tt-core cannot verify (reverse-HMAC) with keyguard's keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reachable: { type: boolean }
                  keyguard_kids: { type: array, items: { type: string } }
                  sources: { type: array, items: { type: object, properties: { source_id: { type: string }, unknown_kids: { type: array, items: { type: string } } } } }
  /api/v1/settings:
    get:
      tags: [system]
      operationId: getSettings
      summary: Installation settings
      x-tt-roles: [admin, operator]
      description: 'What the installation runs with. `general` is editable (`updateSettings`); `privacy` and `access` mirror the configuration file and are read-only. The OIDC client secret is never returned. Approvals (opening approvals, admin override) are keyguard state: see `getApprovalSettings`.'
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [system]
      operationId: updateSettings
      summary: Change the installation labels
      x-tt-roles: [admin]
      description: 'Only `installation_name` and `environment` can be changed at run time. Any other field is refused as an unknown field (`400`): k thresholds, retention bounds, session timeouts, SSO and approvals stay in the configuration file or in keyguard. An empty string clears a label. Audited as `settings.update` (which fields changed, and the environment label).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                installation_name: { type: string, maxLength: 64, description: 'Letters, digits, spaces and . _ - : / @ + ; starts with a letter or digit.' }
                environment: { enum: ["", production, staging, development] }
      responses:
        "200":
          description: Settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { description: 'invalid_input: nothing to change, invalid value, or a field that cannot be changed.', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-tt_session
      description: |
        Server-side session cookie (`__Host-tt_session`, or `tt_session` on a plain-HTTP loopback listener),
        HttpOnly, Secure, SameSite=Strict. Unsafe methods also need the `X-CSRF-Token` header with the token
        returned by `GET /api/v1/auth/me`.
    mockToken:
      type: http
      scheme: bearer
      description: |
        Mock token (`ttm_…`, 1.12.0) of `tt mock --console`, created on the Mock page: scoped to one group, stored as
        a SHA-256, expiring, revocable. Accepted only by `/api/v1/mock-agent/*`; every other path answers 401.
  parameters:
    GroupFilter:
      name: group
      in: query
      required: false
      description: 'Groups (teams) to keep, repeated or comma-separated (group=a,b). Without it every group; rows carry their `group`. The identity of an observed service is (group, service): two groups calling the same host pattern are two rows.'
      schema: { type: string }
    UserId: { name: user_id, in: path, required: true, schema: { type: string } }
    Group: { name: group, in: path, required: true, schema: { $ref: "#/components/schemas/GroupName" } }
    TokenId: { name: token_id, in: path, required: true, schema: { type: string, pattern: "^tok-[0-9A-Za-z]{1,32}$" } }
    SourceId: { name: source_id, in: path, required: true, schema: { type: string, pattern: "^src-[0-9A-Za-z]{1,32}$" } }
    PolicyId: { name: policy_id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Service: { name: service, in: path, required: true, schema: { type: string } }
    RuleId: { name: rule_id, in: path, required: true, schema: { type: string, pattern: "^r-[0-9]{4,}$" } }
    PackId: { name: pack_id, in: path, required: true, schema: { type: string, pattern: "^pk-[0-9A-Za-z-]{1,60}$" } }
    MockId: { name: mock_id, in: path, required: true, schema: { type: string, pattern: "^mtk-[0-9a-f]{24}\\.[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" } }
  responses:
    Unauthorized:
      description: Not authenticated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Validation errors.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing role, missing or wrong CSRF token (`csrf`), or cross-origin request (`cross_origin`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: Rate limit; see Retry-After.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RuleDefinition:
      type: object
      description: 'A tt.rules/v1 rule (schemas/rules.v1.schema.json, `causalRule` or `batchRule`) as written in the rule editor. `id`, `status`, `origin`, `evidence` and `review` may be sent but are replaced by tt-core.'
      required: [kind, title]
      properties:
        kind: { enum: [causal, batch] }
        title: { type: string, maxLength: 200 }
        cause: { type: object }
        effects:
          type: array
          items:
            type: object
            description: 'An entity effect (entity + create, or target/target_id/target_key + set, rules 1.8 for target_key) or a response effect (respond: {service, op, status, p?, times?, example?, body?, limit?: {n, window?, key?}}), with after (and after_effect). See docs/spec/rules.md §3. 1.23.0: create/set values may be derived values {"$derive": {fn, args?, offset?, format?, template?, digits?}} (docs/spec/rules.md §3.15; problems bad_derived, derived_type, unknown_field) and respond.body is an error body typed by a person (object, array or string, at most 16 KiB).'
        outcomes: { type: array, items: { type: object } }
        schedule: { type: string }
        entity: { type: string }
        where: { type: object }
        set: { type: object }
        fraction: { type: number }
    RuleProblem:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string, description: 'Where in the rule, e.g. effects[1].set.status.' }
        code: { enum: [unknown_service, unknown_op, unknown_field, unknown_entity, unknown_example, status_not_observed, invalid] }
        message: { type: string, description: 'English, without traffic values.' }
    CatalogField:
      type: object
      required: [from]
      properties:
        from: { type: string, description: 'req.path, req.query, req.headers, req.cookies, req.body, resp.body; empty for entity fields.' }
        name: { type: string, description: 'Parameter name, or dotted field name of an entity.' }
        path: { type: string, description: 'tt-path of a body field ($.status, $.items[*].sku).' }
        type: { type: string }
        kind: { type: string, description: 'x-tt-value kind: id, enum, bucket, shape.' }
        domain: { type: string }
        values: { type: array, items: { type: string }, description: 'Published keep values (seen for at least k_min subjects).' }
    Me:
      type: object
      required: [user, roles, csrf_token, csrf_header, expires_at, idle_expires_at, session_idle_timeout_ms]
      properties:
        user: { $ref: "#/components/schemas/User" }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        csrf_token: { type: string }
        csrf_header: { const: X-CSRF-Token }
        expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        session_idle_timeout_ms: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: object }, description: 'Optional, what the error is about in structured form (service names, rule ids): `missing_service` of a pack build lists `{service, rules, entities}` per missing service.' }
    Role:
      enum: [admin, operator, rule-reviewer, policy-approver, publisher, auditor, event-exporter]
    User:
      type: object
      required: [id, display_name, auth_method, roles]
      properties:
        id: { type: string, examples: ["usr_01JB"] }
        username: { type: string, description: 'Local accounts only: omitted for OIDC users.' }
        display_name: { type: string }
        auth_method: { enum: [local, oidc] }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        disabled: { type: boolean }
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, maxLength: 128 }
        display_name: { type: string, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true, description: 'Local accounts only (OIDC users are created at first login).' }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
    GroupName: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    SourceKind:
      enum: [sdk-node, sdk-python, sdk-java, sdk-dotnet, sdk-go, sdk-php, egress, obi, import-har, import-otlp]
    TokenKind:
      description: 'The kind of an enrollment token: a source kind, or `k8s-inject` for the Kubernetes injection webhook. A `k8s-inject` token enrolls the SDK of any language (every `sdk-*` source kind), because the language is chosen per workload by the pod annotation; it is always a `group` token. Any other token enrolls only sources of its own kind.'
      enum: [sdk-node, sdk-python, sdk-java, sdk-dotnet, sdk-go, sdk-php, egress, obi, import-har, import-otlp, k8s-inject]
    Settings:
      type: object
      required: [general, privacy, access]
      properties:
        general:
          type: object
          description: Editable with `updateSettings`.
          required: [installation_name, environment]
          properties:
            installation_name: { type: string }
            environment: { enum: ["", production, staging, development] }
        privacy:
          type: object
          description: Read-only (configuration file; the retention is changed with `setRetention`).
          required: [events_retention_days, aggregates_days, k_min, min_samples]
          properties:
            events_retention_days: { type: integer }
            aggregates_days: { type: integer }
            k_min:
              type: object
              description: 'Minimum distinct subjects per area (`contract.k_min`, `miner.k_min`, `world.k_min`, `gate.k_min`).'
              properties:
                contract: { type: integer }
                miner: { type: integer }
                world: { type: integer }
                gate: { type: integer }
            min_samples: { type: integer, description: '`contract.min_samples`.' }
        access:
          type: object
          description: Read-only (configuration file).
          required: [local_enabled, oidc, session]
          properties:
            local_enabled: { type: boolean }
            oidc:
              type: object
              required: [enabled, issuer_url, client_id, scopes, roles_claim]
              properties:
                enabled: { type: boolean }
                issuer_url: { type: string }
                client_id: { type: string }
                scopes: { type: array, items: { type: string } }
                roles_claim: { type: string, description: 'Empty when the roles of SSO users are managed in the console.' }
            session:
              type: object
              required: [idle_timeout_s, absolute_timeout_s]
              properties:
                idle_timeout_s: { type: integer }
                absolute_timeout_s: { type: integer }
    Group:
      type: object
      required: [name, allowed_service_names]
      properties:
        name: { $ref: "#/components/schemas/GroupName" }
        description: { type: string, maxLength: 500 }
        policy_id: { type: [string, "null"] }
        allowed_service_names: { type: array, items: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }, description: 'Service names the sources of the group may enroll with. Empty: the name of the first source that enrolls is adopted (audited as `fleet.group_update` with `reason: first_enrollment`) and is the only one allowed from then on.' }
        sampling_override_bp: { type: [integer, "null"], minimum: 0, maximum: 10000 }
        killed: { type: boolean }
        test_k_min: { type: integer, readOnly: true, description: '1.21.0: the lower k of a group marked as test (0: not a test group); set with `setTestK`, ignored on input.' }
        policy_draft:
          type: object
          readOnly: true
          description: Present in the answer of `updateGroup` when re-targeting the group created a policy draft; ignored on input.
          required: [policy_id, version]
          properties:
            policy_id: { type: string }
            version: { type: integer }
    EnrollmentTokenInfo:
      type: object
      required: [token_id, kind, group, token_type, expires_at, uses]
      properties:
        token_id: { type: string }
        kind: { $ref: "#/components/schemas/TokenKind" }
        group: { $ref: "#/components/schemas/GroupName" }
        token_type: { enum: [one_time, group] }
        expires_at: { type: string, format: date-time }
        uses: { type: integer }
        revoked: { type: boolean }
        created_by: { type: string }
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          description: 'Codes produced by tt-core: token_expired, token_revoked, token_exhausted, service_not_allowed, kind_mismatch, invalid_csr and the source states no_policy, policy_rejected, expired_policy, key_missing, key_mismatch. double_capture (the same outbound call was captured by an SDK and by tt-egress: use either one for a given call) is produced from the traces. cert_rejected, no_subject_found, intake_rejecting and clock_skew are reserved: no tt-core release emits them yet.'
          enum: [token_expired, token_revoked, token_exhausted, service_not_allowed, kind_mismatch, invalid_csr, cert_rejected, no_policy, policy_rejected, expired_policy, key_missing, key_mismatch, double_capture, no_subject_found, intake_rejecting, clock_skew]
        message: { type: string }
        hint: { type: string }
    OnboardingStatus:
      type: object
      required: [steps]
      properties:
        steps:
          type: object
          properties:
            enrolled: { type: boolean }
            policy_received: { type: boolean }
            first_events: { type: integer, description: 'Events accepted so far (count).' }
        sources:
          type: array
          description: Ids of the sources enrolled with this token.
          items: { type: string }
        problems: { type: array, items: { $ref: "#/components/schemas/Problem" } }
    SourceStatus:
      type: object
      required: [source_id, kind, version, service_name, group, state, killed, revoked, last_seen, events_per_min, drop_ratio, sanitizer_errors, last_errors, problems]
      properties:
        source_id: { type: string }
        kind: { $ref: "#/components/schemas/SourceKind" }
        version: { type: string }
        service_name: { type: string }
        group: { type: string }
        instance: { type: string }
        state: { enum: [starting, capturing, no_policy, policy_rejected, expired_policy, key_missing, key_mismatch, killed], description: 'Last state reported by the heartbeat.' }
        killed: { type: boolean }
        revoked: { type: boolean }
        policy: { type: object, properties: { id: { type: string }, version: { type: integer }, issued_seq: { type: integer } } }
        last_seen: { type: [string, "null"], format: date-time }
        events_per_min: { type: number }
        drop_ratio: { type: number }
        sampling_override_bp: { type: [integer, "null"] }
        overhead_us: { type: object, properties: { p50: { type: integer }, p99: { type: integer } } }
        sanitizer_errors: { type: integer, description: 'Sanitizer errors counted by the source since process start (heartbeat counter).' }
        last_errors:
          type: array
          description: 'A windowed view (the last `LastErrorsWindow`, 15 minutes by default, at most one hour): the error codes the source reported and, after them, one entry per reason the intake rejected the source events (`intake_rejected:<reason>`, largest first). Codes only, never values. One entry per code, with `first_seen`, `last_seen` and `count` of the occurrences within the window; `at` equals `last_seen` and is the time of the occurrence, never the time of the last heartbeat. An error that stopped leaves the list once the window passes; historical totals are the source counters (`events_rejected`, ...), not this list.'
          items:
            type: object
            required: [code, at]
            properties:
              code: { type: string }
              at: { type: string, format: date-time, description: 'Same as last_seen.' }
              first_seen: { type: string, format: date-time }
              last_seen: { type: string, format: date-time }
              count: { type: integer, description: 'Occurrences within the window.' }
        problems: { type: array, items: { $ref: "#/components/schemas/Problem" } }
    ValueReason:
      type: object
      description: 'One reason why a policy change opens values (docs/spec/policy.md §7). Codes: keep, bucket, credential_header, identity, literals, hosts_discovery, propagate_to, volume_with_values, rule_removed_with_values, match_with_values, service_with_values, operation_with_values, container_with_values, group_with_values, keyguard_verdict.'
      required: [code, where]
      properties:
        code: { type: string }
        where: { type: string, description: 'Location in the policy (e.g. services.shop-api.ops.POST /orders.response.body.$.status), never a value.' }
    PolicyClassification:
      type: object
      required: [policy_id, classification, opens_values, value_reasons, approvals_required, diff]
      properties:
        policy_id: { type: string }
        classification: { enum: [closing, opening] }
        opens_values: { type: boolean }
        value_reasons: { type: array, items: { $ref: "#/components/schemas/ValueReason" } }
        approvals_required: { type: integer, minimum: 0, maximum: 2 }
        diff: { type: array, items: { type: object } }
    ObserveStatus:
      type: object
      required: [group, enabled, auto, phase, min_events, events, sampling_bp, services, masked]
      properties:
        group: { type: string }
        auto: { type: boolean, description: 'The per-group switch of the automatic observe versions (`setObserveAuto`, default true; 1.16.0).' }
        policy_id: { type: string }
        enabled: { type: boolean, description: 'tt-core derives the observe version (fleet.observe.enabled) and keyguard signs observe-safe changes without approvals (observe_auto).' }
        phase: { enum: [no_policy, waiting_approval, listening, masked, managed] }
        active_version: { type: integer }
        started_at: { type: string, format: date-time, description: 'The starter policy was activated.' }
        due_at: { type: string, format: date-time, description: 'The observe version is derived at the latest then (fleet.observe.after), earlier after min_events calls.' }
        min_events: { type: integer }
        events: { type: integer, description: 'Calls seen under the policy (from the stored events scanned for discovery).' }
        observe_version: { type: integer }
        observe_activated_at: { type: string, format: date-time }
        discovery_until: { type: string, format: date-time }
        sampling_bp: { type: integer }
        services:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              kind: { enum: [inbound, external] }
              calls: { type: integer }
              ops: { type: integer }
        masked:
          type: array
          description: Fields of the active version turned into tokens (hmac). Names and domains only.
          items:
            type: object
            properties:
              service: { type: string }
              op: { type: string }
              part: { enum: [request, response, errors] }
              kind: { enum: [path, query, headers, cookies, body] }
              field: { type: string }
              domain: { type: string }
        identity:
          type: object
          properties:
            from: { type: string }
            name: { type: string }
            jwt_claim: { type: string }
            json_path: { type: string }
        families: { type: object, additionalProperties: { type: array, items: { type: string } }, description: '1.21.0: hmac.families of the active policy (family → joined domains).' }
        test_k_min: { type: integer, description: '1.21.0: the lower k of the group when marked as test, 0 otherwise.' }
        k_min: { type: integer, description: '1.21.0: the installation k.' }
        identity_candidates:
          type: array
          description: 'Who the user may be, ranked by the automatic detection (1.19.0, policy.md §7.4): names, counts, shapes and scores, never a value.'
          items: { $ref: "#/components/schemas/IdentityCandidate" }
        identity_best: { $ref: "#/components/schemas/IdentitySource" }
        sampling: { type: object, description: 'Sampling advice for k-anonymity (as in policyAssistant).' }
    MinerCandidate:
      type: object
      description: |
        1.21.0 (C0, docs/spec/rules.md §5.2). A structure seen by fewer than k subjects: what the miner would propose with
        a lower k. Structure only (operations, field names, clear states, a status); the subjects as a bucket, never an
        example, a token or an exact count. `draft` is the rule skeleton the editor starts from ("Crea bozza").
      required: [signature, kind, template, service, op, subjects]
      properties:
        group: { type: string }
        signature: { type: string }
        kind: { enum: [create, update, keyed_update, update_all, remove, limit, precondition, later, revert] }
        template: { enum: [write_changes_field, expires_after, at_most_n, until, custom] }
        service: { type: string }
        op: { type: string }
        entity: { type: string }
        fields: { type: array, items: { type: string } }
        states: { type: array, items: { type: string } }
        status: { type: integer }
        target: { type: string, description: '"service op" whose answers a response effect changes.' }
        subjects: { enum: ["1", "2-4", "5-9", "10+"] }
        draft: { type: object, description: 'A tt.rules/v1 rule: counts zeroed, no keys nor hints, origin manual, status draft.' }
        missing_entities:
          type: array
          items: { type: string }
          description: 'Entities the draft needs that the run did not accept (seen by fewer than k subjects): the draft can be saved only once they exist, for instance after marking the group as test (lower k).'
    FamilyCandidate:
      type: object
      description: |
        1.21.0 (C15). Two HMAC domains that look like one identifier under two names, judged from structure only (the
        tokens of two domains are never compared): `same_cardinality` (as many distinct tokens of each per subject),
        `write_read_follow` (a new token of one first seen right after a new token of the other), `same_ops`.
      required: [domains, subjects, signals, score]
      properties:
        group: { type: string }
        domains: { type: array, minItems: 2, maxItems: 2, items: { type: string } }
        subjects: { type: integer }
        signals: { type: array, items: { enum: [same_cardinality, write_read_follow, same_ops] } }
        score: { type: number, minimum: 0, maximum: 1 }
    IdentitySource:
      type: object
      description: 'An identity.subject source: a request header or cookie, optionally a claim of the JWT it carries.'
      properties:
        from: { enum: [header, cookie] }
        name: { type: string }
        jwt_claim: { type: string }
        json_path: { type: string }
    IdentityCandidate:
      type: object
      description: |
        A request header or cookie of the inbound calls ranked as who the user is (1.19.0, docs/spec/policy.md §7.4).
        Computed only from the discovery sketches: distinct estimate, calls, dominant shape. `score` (0..100) adds
        cardinality (35: many values, clearly fewer than calls), shape (25: id-like best), presence (25) and a weak name
        hint (15). `signals`: jwt_bearer, jwt_shape, id_shape, short_shape, personal_shape, long_shape, repeats,
        most_calls, some_calls, name_hint. `excluded` says why it is never chosen by itself: credential, cookie,
        few_values (a tenant, a channel), per_call (a request or trace id), not_id_shape, rare; a person may still
        choose it (`setIdentity`).
      required: [from, name, calls, distinct_estimate, jwt, presence, distinct_per_call, score, signals, observe_safe]
      properties:
        from: { enum: [header, cookie] }
        name: { type: string }
        jwt_claim: { type: string }
        calls: { type: integer }
        distinct_estimate: { type: integer }
        jwt: { type: boolean }
        shape: { type: string }
        presence: { type: number, minimum: 0, maximum: 1 }
        distinct_per_call: { type: number, minimum: 0, maximum: 1 }
        score: { type: integer, minimum: 0, maximum: 100 }
        signals: { type: array, items: { type: string } }
        excluded: { enum: [credential, cookie, few_values, per_call, not_id_shape, rare] }
        observe_safe: { type: boolean, description: 'Choosing it applies at once, without approvals.' }
        best: { type: boolean, description: 'The source the detection picks.' }
    PolicyVersion:
      type: object
      required: [policy_id, version, status, classification, approvals_required, approvals]
      properties:
        policy_id: { type: string }
        version: { type: integer }
        issued_seq: { type: [integer, "null"] }
        status: { enum: [draft, active, superseded, rejected] }
        withdrawn: { type: boolean, description: '1.17.0. A rejected draft that its proposer (or an admin) took back (`withdrawPolicy`); the `note` starts with `withdrawn`.' }
        origin: { enum: [propose, rollback, retarget, renew, starter, host-twin, observe-auto], description: 'How the version was created: a proposal, the restore of an earlier version, the re-targeting of a group, an automatic renewal of `not_after` (no approvals), the onboarding starter policy, an external service proposed from the hosts registry (`twinHost`, 1.6.0), or the observe version tt-core derives by itself (hmac on identifiers, automatic identity; or the removal of expired discovery windows), proposed by `system` (1.10.0, policy.md §7).' }
        proposed_by: { type: string, description: 'Display name of the proposing user (not the id).' }
        proposed_at: { type: string, format: date-time }
        classification: { enum: [closing, opening], description: 'Computed by tt-core and re-checked by keyguard (docs/spec/policy.md §5).' }
        opens_values: { type: boolean, description: 'The change lets values out beyond observe-safe (policy.md §7) and needs approvals; false: it applies without approval (1.10.0).' }
        value_reasons: { type: array, items: { $ref: "#/components/schemas/ValueReason" }, description: 'Why the change opens values; empty when it does not (1.10.0).' }
        approvals_required: { type: integer, minimum: 0, maximum: 2, description: '0 (1.10.0): observe-safe, applied without approval.' }
        approval_mode: { enum: [standard, single, admin, observe], description: 'Present once signed, as reported by keyguard: `single` = opening change with `opening_approvals` set to 1; `admin` = admin single approval; `observe` = observe-safe change signed without approvals (1.10.0).' }
        approvals:
          type: array
          items:
            type: object
            properties:
              by: { type: string, description: 'Display name of the approver (not the id).' }
              at: { type: string, format: date-time }
              verified: { type: boolean, description: 'OIDC ID token verified by keyguard.' }
              admin_override: { type: boolean, description: 'Admin single approval (omitted when false).' }
              reason: { type: string, description: 'Justification of an admin approval.' }
              note: { type: string }
        targets: { type: object, properties: { groups: { type: array, items: { type: string } } } }
        not_after: { type: string, format: date-time }
        diff:
          type: array
          description: Human-readable changes against the active version.
          items:
            type: object
            properties:
              change: { enum: [added, removed, changed] }
              where: { type: string }
              from: { type: string }
              to: { type: string }
              opens: { type: boolean }
        hash: { type: string }
        note: { type: string, description: 'Note recorded when the version was rejected.' }
        author_yaml: { type: string, description: 'The policy as the author wrote it (YAML). Omitted when empty.' }
    SigningKeyInfo:
      type: object
      required: [kid, alg, public_key, revoked]
      properties:
        kid: { type: string }
        alg: { const: Ed25519 }
        public_key: { type: string, description: 'Raw 32-byte key, base64url without padding.' }
        endorsed_by: { type: string, description: 'kid of the older key that endorsed this one, if any.' }
        revoked: { type: boolean }
        active: { type: boolean, description: 'keyguard currently signs policies with this kid (it cannot be revoked).' }
        trusted_by: { type: integer, description: 'Sources seen in the confirmation window whose last heartbeat (or enrollment) lists this kid.' }
        revoke:
          type: object
          description: What a revocation of this key would do now (absent for revoked keys).
          required: [seen_sources, confirmed_sources, required_fraction, ok]
          properties:
            seen_sources: { type: integer, description: 'Non-revoked sources seen (heartbeat or enrollment) in the window.' }
            confirmed_sources: { type: integer, description: 'Of those, how many trust the key that signs after the revocation (keyguard active kid) and no longer run a policy signed by this key.' }
            sources_on_old_key: { type: integer, description: 'Seen sources still running a policy signed by this key (tt-core re-signs active policies with the active key at its next maintenance pass).' }
            required_fraction: { type: number, minimum: 0, maximum: 1 }
            ok: { type: boolean, description: 'true when the revocation would be accepted.' }
            blocker: { enum: [last_signing_key, active_signing_key, rotation_unconfirmed], description: 'Refusal code when ok is false.' }
    SnapshotInfo:
      type: object
      required: [service, snapshot_id, window, ops, calls, created_at, hash, breaking, non_breaking]
      properties:
        service: { type: string }
        snapshot_id: { type: string }
        window: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        ops: { type: integer }
        calls: { type: integer }
        created_at: { type: string, format: date-time }
        hash: { type: string, description: 'Hash of the snapshot content.' }
        breaking: { type: integer, minimum: 0, description: 'Breaking changes against the previous snapshot of the same service (0 for the first one). Stored when the snapshot is taken; older snapshots are filled on first read.' }
        non_breaking: { type: integer, minimum: 0, description: 'Non-breaking changes against the previous snapshot.' }
        replaced_by: { type: string, description: '`listContracts` only (1.16.0): on the contract of an old `host:<pattern>` service, the external service the group declares since for that host. Kept as history, left out of the packs by default.' }
    Drift:
      type: object
      required: [drift_id, kind, service, op, severity, change, first_seen, evidence, state]
      properties:
        drift_id: { type: string, pattern: "^dr-[0-9]{8}$" }
        kind: { enum: [contract.drift, rule.stale], description: 'What raised the alert: a contract change, or an approved rule that lost confidence.' }
        service: { type: string }
        op: { type: string }
        severity: { enum: [breaking, non-breaking] }
        change: { type: string }
        first_seen: { type: string, format: date-time }
        evidence: { type: object, properties: { calls_after_change: { type: integer } } }
        state: { enum: [open, acknowledged, resolved] }
        affected_rules: { type: array, items: { type: string } }
        where: { type: string, description: 'Part and path of the change (names and types only, never values).' }
        change_kind: { type: string, description: 'The kind of change (op-added, status-added, required-changed, enum-added, type-changed, field-added... or rule-stale): with `params` it lets the console write the sentence in its own language; `change` stays the English text sent to webhooks.' }
        params: { type: object, additionalProperties: { type: string }, description: '1.17.0. The names and figures behind `change`: scope (request | response) with status, part, name, status, from, to, count, pct, required, ct, rarity; for rule-stale rule, from, to, reason. Never data values.' }
        ack_by: { type: string, description: 'User id of who acknowledged.' }
        resolved_by: { type: string, description: 'User id of who resolved.' }
    WorldInfo:
      type: object
      required: [world_id, seed, customers, created_at]
      properties:
        world_id: { type: string }
        seed: { type: integer }
        customers: { type: integer }
        archetypes_used: { type: boolean }
        rules: { type: array, items: { type: string } }
        services: { type: array, items: { type: string }, description: 'Scope the world was generated for; empty: every service.' }
        created_at: { type: string, format: date-time }
        t0: { type: string, format: date-time, description: 'Virtual time zero of the world.' }
        locale: { type: string }
        entities: { type: integer }
        history: { type: integer, description: 'Number of history rows.' }
        pending: { type: integer, description: 'Number of pending-effect rows.' }
        sha256: { type: string, description: 'Hash of world.jsonl.' }
        skipped_rules:
          type: array
          description: 'Answer of the generation only: approved rules that cannot be used (for a group, only its own rules).'
          items: { type: object, required: [id, reason], properties: { id: { type: string }, reason: { type: string } } }
        skipped_rules_count: { type: integer, description: 'Answer of the generation only: number of approved rules that cannot be used, of every group.' }
        excluded_rules:
          type: array
          description: 'Answer of the generation only: approved rules of the group (their cause is a service of the scope) left out because they also need services outside it.'
          items: { type: object, required: [id, services], properties: { id: { type: string }, services: { type: array, items: { type: string } } } }
    PackInfo:
      type: object
      required: [pack_id, status, created_at]
      properties:
        pack_id: { type: string }
        warnings:
          type: array
          description: '1.17.0. What the pack rests on too little traffic for ("poche osservazioni"); the pack is not refused and the warnings are not part of the signed pack. At most 200 (counts only, never values).'
          items:
            type: object
            required: [code, scope, unit, needed]
            properties:
              code: { enum: [few_observations, test_k], description: 'test_k (1.21.0): the pack is of a group marked as test and was built with its lower k (observed: the k used, needed: the installation k, unit subjects).' }
              scope: { enum: [pack, rule, outcome, endpoint], description: 'pack: the window of traffic (minutes); rule: causes of an approved rule (batch: runs); outcome: an outcome of a rule seen fewer than k times; endpoint: calls of an operation.' }
              rule: { type: string }
              service: { type: string }
              op: { type: string }
              outcome: { type: string }
              unit: { enum: [minutes, causes, runs, outcomes, calls, subjects] }
              observed: { type: integer, description: 'Absent with below_k.' }
              below_k: { type: boolean, description: 'The operation was seen fewer times than k: its count is not published.' }
              needed: { type: integer, description: 'What would not be flagged: 60 minutes, 100 calls or causes, k outcomes, 3 runs.' }
        warnings_total: { type: integer, description: 'Number of warnings (the list is cut at 200).' }
        status: { enum: [building, gate-failed, signed, published], description: '`building` is reserved: builds are synchronous and no tt-core release stores it.' }
        created_at: { type: string, format: date-time }
        world_id: { type: string }
        manifest: { type: object }
        gate_report: { type: object }
        published_at: { type: [string, "null"], format: date-time }
        approval_mode: { enum: [standard, admin], description: 'Set at publication, as reported by keyguard.' }
        residual_risk:
          type: object
          description: Re-identification measures of the archetypes behind the world, computed by the gate in zone B. Informational (never blocks); counts and rates only.
          required: [note, profiles, archetypes, min_archetype_size, suppressed_subjects, uniqueness_rate, singling_out_rate, exact_match_share, max_homogeneity]
          properties:
            note: { type: string }
            profiles: { type: integer }
            archetypes: { type: integer }
            min_archetype_size: { type: integer, description: 'The k actually achieved.' }
            suppressed_subjects: { type: integer, description: 'Subjects dropped because no k-anonymous group fits them.' }
            uniqueness_rate: { type: number }
            singling_out_rate: { type: number }
            exact_match_share: { type: number }
            max_homogeneity: { type: number }
    ScenarioPreset:
      type: object
      required: [preset_id, name]
      properties:
        preset_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        customer: { type: string, description: 'Synthetic customer id or empty; never together with archetype.' }
        archetype: { type: string }
        seed: { type: integer, minimum: 0, description: 'Optional session seed (scenarios.json, docs/spec/pack.md section 6.1).' }
        faults: { type: object, description: 'Same shape as the control API Faults object.' }
        outcomes:
          type: array
          items:
            type: object
            required: [rule, outcome]
            properties:
              rule: { type: string }
              outcome: { type: string }
              times: { type: integer, minimum: 0, description: 'Omitted or 0: no count in scenarios.json (the mock default applies).' }
    HostPattern:
      type: object
      required: [pattern, service, declared, exact, quarantined, calls, server_errors, client_errors, error_rate, latency_p50_ms, first_seen, last_seen, callers, policies]
      properties:
        pattern: { type: string, description: 'Host pattern (sanitizer.md §3.5), e.g. `api.carrier.example`, `{*}.tracking.example:8443`, `ip:private`; for a declared service the host of its base; `unlisted` / `invalid` for the two special entries.' }
        service: { type: string, description: 'The `service` of the events: `host:<pattern>` or the declared service name.' }
        declared: { type: boolean }
        declared_by: { type: array, items: { type: string }, description: 'Policies whose latest version declares the service.' }
        now_declared_as: { type: string, description: 'On an undeclared pattern: the external service a policy has declared since for this host (its older calls stay under host:<pattern>). Since 1.17.0 such a row is folded into the declared entry of the same group (`folded_from`) and no longer listed; it stays only when the declared entry does not exist.' }
        folded_from: { type: array, items: { type: string }, description: '1.17.0. On a declared entry: the older `host:<pattern>` rows of the same group it replaces; their calls, callers and times are counted in it. The host is listed once ("dichiarato come <service>").' }
        exact: { type: boolean, description: 'No `{*}` label and not an IP class: `twinHost` needs no `base`.' }
        quarantined: { type: boolean, description: 'The intake collapses a position of this registrable domain (`host-label` quarantine).' }
        calls: { type: integer }
        server_errors: { type: integer, description: 'Status ≥ 500 and network errors.' }
        client_errors: { type: integer, description: 'Status 400–499.' }
        error_rate: { type: number, description: 'server_errors / calls (0 without calls).' }
        latency_p50_ms: { type: [integer, "null"] }
        first_seen: { type: [string, "null"], format: date-time }
        last_seen: { type: [string, "null"], format: date-time }
        callers:
          type: array
          items:
            type: object
            required: [service, calls]
            properties:
              service: { type: string, description: 'Enrollment service name of the calling source (`source:<id>` when unknown).' }
              calls: { type: integer }
        policies: { type: array, items: { type: string }, description: 'Policies under which the calls were captured.' }
    HostsRegistry:
      type: object
      required: [domains, unlisted, invalid, discovery]
      properties:
        counts:
          type: object
          description: '1.17.0. The figures of the page header over the entries listed, IP-class hosts (`ip:private:9732`: a fake API on 127.0.0.1) included.'
          properties:
            domains: { type: integer }
            hosts: { type: integer }
            ip_hosts: { type: integer, description: 'Entries of an IP class.' }
            declared: { type: integer }
            undeclared: { type: integer, description: 'Not declared and not replaced by a declaration.' }
            folded: { type: integer, description: 'Older rows folded into their declaration.' }
        domains:
          type: array
          description: 'Ordered by calls, descending.'
          items:
            type: object
            required: [domain, calls, first_seen, last_seen, patterns]
            properties:
              domain: { type: string, description: 'Registrable domain (event.md §5.2) or the IP class.' }
              calls: { type: integer }
              first_seen: { type: [string, "null"], format: date-time }
              last_seen: { type: [string, "null"], format: date-time }
              patterns: { type: array, items: { $ref: "#/components/schemas/HostPattern" } }
        unlisted: { $ref: "#/components/schemas/HostPattern" }
        invalid: { $ref: "#/components/schemas/HostPattern" }
        discovery: { type: object, additionalProperties: { enum: [auto, off] }, description: 'hosts.discovery of the latest signed version of each policy.' }
    QuarantineItem:
      type: object
      required: [item_id, kind, service, where, distinct_estimate, state, since]
      properties:
        item_id: { type: string }
        kind: { enum: [keep-value, name, path-segment, host, host-label], description: '`host`: the registrable domains of the host patterns of one source (their registrable label becomes `{*}`); `host-label` (1.6.0): the literal labels at one position under one registrable domain (they become `{*}`).' }
        service: { type: string, description: '`host:*` for the two host kinds.' }
        op: { type: string }
        where: { type: string, description: 'Part and path, e.g. resp.body $.city; for host-label "hosts under <domain> position <n>" (1 = the label nearest the registrable domain).' }
        alert: { enum: [host_cardinality, value_cardinality], description: '`host_cardinality` for the two host kinds (1.6.0). `value_cardinality` (1.22.0) for a `keep-value` item: a field in clear (keep or code, also `code(alnum)`) showed more distinct values than the threshold (50): probably an identifier; its values are rewritten to shapes and the observe version never proposes `code` on it again.' }
        distinct_estimate: { type: integer }
        state: { enum: [quarantined, dismiss-pending, resolved], description: 'No closing-pending state: a close takes effect with one approval.' }
        since: { type: string, format: date-time }
        approvals: { type: array, items: { type: object, properties: { by: { type: string, description: 'User id of the approver.' }, at: { type: string, format: date-time } } } }
    Webhook:
      type: object
      required: [name, url, events]
      properties:
        webhook_id: { type: string }
        name: { type: string, maxLength: 120 }
        url: { type: string, format: uri }
        events:
          type: array
          items: { enum: [contract.drift, rule.stale, quarantine.opened, source.problem, kill.changed, keyguard.alert, pack.published, storage.high_watermark] }
        enabled: { type: boolean, description: 'A disabled webhook keeps its definition and delivery log but is sent nothing new (also `test` still works). Default true on creation; when omitted in `updateWebhook` the current value is kept.' }
        secret_set: { type: boolean, description: 'An HMAC secret for the X-TT-Signature header is configured (write-only).' }
        secret: { type: string, minLength: 16, maxLength: 256, writeOnly: true, description: 'Write-only. If omitted on creation, the server generates one and returns it once.' }
    WebhookDelivery:
      type: object
      required: [delivery_id, webhook_id, event, state, attempts, created_at]
      properties:
        delivery_id: { type: integer }
        webhook_id: { type: string }
        event: { type: string }
        drift_id: { type: string }
        state: { enum: [pending, delivered, failed] }
        attempts: { type: integer }
        last_status: { type: integer, description: 'HTTP status of the last attempt.' }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        next_attempt: { type: string, format: date-time }
    Retention:
      type: object
      required: [events_days]
      properties:
        events_days: { type: integer, minimum: 1, maximum: 365, default: 7, description: "Raw events; before deletion they are counted into the rollups (GET /api/v1/store/traffic), which stay." }
        aggregates_days: { type: integer, minimum: 1, maximum: 3650, default: 365, description: 'Follows contract.keep_snapshots and the snapshot window of the configuration; a PUT accepts only that value.' }
    StoreUsage:
      type: object
      required: [db, datasets, running]
      properties:
        db:
          type: object
          properties:
            file: { type: string }
            file_bytes: { type: integer }
            wal_bytes: { type: integer }
            free_bytes: { type: integer, description: 'Free pages: reclaimable (incremental auto_vacuum) or reused by new rows (legacy database).' }
            used_bytes: { type: integer, description: 'file + wal - free: what the budget compares.' }
            max_bytes: { type: integer, description: '0: no budget.' }
            used_pct: { type: number }
            high_watermark_pct: { type: integer }
            critical_watermark_pct: { type: integer }
            level: { enum: [ok, high, critical, over] }
            auto_vacuum: { enum: [incremental, none] }
        datasets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              bytes: { type: integer }
              file_bytes: { type: integer }
              quota_bytes: { type: integer }
              over_quota: { type: boolean }
              policy: { type: object, properties: { code: { type: string }, params: { type: object, additionalProperties: { type: integer } } } }
              last_run: { type: object, properties: { name: { type: string }, outcome: { type: object }, error: { type: string }, duration_ms: { type: integer } } }
        measured_at: { type: string, format: date-time }
        last_run: { type: object, properties: { trigger: { type: string }, started_at: { type: string, format: date-time }, finished_at: { type: string, format: date-time }, deleted: { type: integer }, reclaimed_bytes: { type: integer }, reclaim_note: { type: string }, errors: { type: integer }, shed: { type: array, items: { type: object } } } }
        next_run: { type: string, format: date-time }
        running: { type: boolean }
        job_id: { type: string, description: 'The running maintenance job, if any.' }
        interval_seconds: { type: integer }
        events_retention_days: { type: integer }
        rollups: { type: array, items: { type: object, properties: { tier: { enum: [hour, day, month] }, rows: { type: integer }, oldest: { type: string, format: date-time } } } }
        audit_archive: { type: object, properties: { enabled: { type: boolean }, dir: { type: string }, segments: { type: integer }, entries: { type: integer }, last_seq: { type: integer }, head_hash: { type: string } } }
    AuditEntry:
      type: object
      description: One entry of tt-core's audit log (also the line format of `exportAudit`). Identifiers and counts only, never values.
      required: [seq, ts, actor, action, target, outcome, prev_hash, hash]
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, id, name]
          properties:
            kind: { enum: [user, system, source, anonymous], description: 'Who acted; `system` for jobs and renewals.' }
            id: { type: string }
            name: { type: string }
        action: { type: string, pattern: "^[a-z][a-z0-9_-]*(\\.[a-z][a-z0-9_-]*){1,4}$", examples: ["policy.approve"] }
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        outcome: { enum: [success, failure, denied] }
        reason: { type: string, description: 'Short machine code for failures and denials.' }
        request_id: { type: string }
        details: { type: object, additionalProperties: { type: string }, description: 'Identifiers and counts only; free text is never stored.' }
        prev_hash: { type: string }
        hash: { type: string }
    DateOffset:
      type: object
      required: [group, field, min, max]
      properties:
        group: { type: string }
        field: { type: string }
        min: { type: string }
        max: { type: string }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    MockPages:
      type: object
      required: [group, pages]
      properties:
        group: { type: string }
        pages: { type: array, items: { type: object, description: 'Page of control-api.v1 with hmac.key empty.' } }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    IdFormat:
      type: object
      required: [group, domain, format, capacity_label, preview]
      properties:
        group: { type: string }
        domain: { type: string }
        format: { type: string }
        capacity_label: { type: string }
        preview: { type: array, items: { type: string }, description: 'The first three ids of the format for the domain.' }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    IdFormatError:
      type: object
      required: [code, at]
      properties:
        code: { enum: [empty, too_long, bad_char, unclosed_quote, empty_literal, bad_literal, unclosed_ref, bad_ref, nested_b64, unclosed_b64, empty_b64, too_many_parts, too_small] }
        at: { type: integer, minimum: 0, description: 'Byte offset in the format.' }
    MockIdentity:
      type: object
      required: [group, enabled, header, claim, map]
      properties:
        group: { type: string }
        enabled: { type: boolean }
        header: { type: string }
        claim: { type: string }
        map:
          type: array
          items:
            type: object
            required: [hash, customer]
            properties:
              hash: { type: string, pattern: "^[0-9a-f]{32}$", description: 'Keyed hash of the user (never the user).' }
              customer: { type: string }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    MockList:
      type: object
      required: [mocks, managed, environment, latest_packs]
      properties:
        mocks: { type: array, items: { $ref: "#/components/schemas/Mock" } }
        managed: { type: array, items: { $ref: "#/components/schemas/ManagedMock" } }
        environment:
          type: object
          required: [kubernetes, console_url, image, report_interval_s]
          properties:
            kubernetes: { type: boolean, description: 'tt-core can start mocks itself (mock.kubernetes.enabled).' }
            namespace: { type: string }
            console_url: { type: string, description: 'The URL the mocks use (mock.console_url, or the origin of the request).' }
            image: { type: string }
            report_interval_s: { type: integer }
        latest_packs: { type: object, additionalProperties: { type: string }, description: 'Newest published pack per group ("" none).' }
    Mock:
      type: object
      required: [mock_id, group, instance, token_id, managed, online, status, pack_id, latest_pack_id, up_to_date, public_url, services, sessions, calls_total, last_seen]
      properties:
        mock_id: { type: string, pattern: "^mtk-[0-9a-f]{24}\\.[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
        group: { type: string }
        instance: { type: string }
        token_id: { type: string }
        managed: { type: boolean }
        online: { type: boolean, description: 'Reported in the last few intervals and the token is valid.' }
        status: { enum: [waiting, serving, error, revoked] }
        version: { type: string }
        pack_id: { type: string }
        latest_pack_id: { type: string }
        up_to_date: { type: boolean }
        pack_error: { type: string, description: 'Why the mock refused the latest pack (signature, other group, expired).' }
        public_url: { type: string }
        services:
          type: array
          items:
            type: object
            required: [name, mock_url]
            properties:
              name: { type: string }
              alias: { type: string }
              mock_url: { type: string, description: 'Base URL that replaces the real one in the tests.' }
              real_base: { type: string, description: 'The real endpoint (match.base of the policy, or the host of a host: service).' }
        sessions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              scenario: { type: string }
              clock: { type: string, format: date-time }
              calls: { type: integer }
              faults: { type: string }
        calls_total: { type: integer }
        dropped_calls: { type: integer }
        started_at: { type: string }
        last_seen: { type: string, format: date-time }
    MockCall:
      type: object
      required: [seq, wall, session, method, path, status, matched]
      properties:
        seq: { type: integer }
        wall: { type: string }
        at: { type: string, description: Virtual time of the session. }
        session: { type: string }
        scenario: { type: string }
        service: { type: string }
        op: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer, description: '0 for a simulated network failure.' }
        matched: { type: boolean }
        reason: { type: string }
        fault: { type: string, examples: ["status 503", "net_error timeout", "latency 120ms"] }
        latency_ms: { type: integer }
    MockToken:
      type: object
      required: [token_id, group, label, managed, created_by, created_at, expires_at, revoked]
      properties:
        token_id: { type: string }
        group: { type: string }
        label: { type: string }
        managed: { type: boolean, description: 'Issued by tt-core for a managed mock.' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked: { type: boolean }
        last_used: { type: [string, "null"], format: date-time }
    GroupApprovers:
      type: object
      required: [group, approvers]
      properties:
        group: { type: string }
        approvers:
          type: array
          items:
            type: object
            required: [name, display_name, roles]
            properties:
              name: { type: string, description: 'Username of a local account ("" for an OIDC account).' }
              display_name: { type: string }
              roles: { type: array, items: { type: string, enum: [policy-approver, admin] } }
              self: { type: boolean, description: 'The caller.' }
    NewMockToken:
      allOf:
        - { $ref: "#/components/schemas/MockToken" }
        - type: object
          required: [token, setup]
          properties:
            token: { type: string, pattern: "^ttm_[0-9a-f]{24}\\.[A-Za-z0-9_-]{43}$", description: Shown once. }
            setup:
              type: object
              properties:
                console_url: { type: string }
                group: { type: string }
                image: { type: string }
                gate_pubkeys: { type: string }
                env: { type: string }
                docker: { type: string, description: 'docker run in console mode; with an https console it mounts console-ca.pem and passes --console-ca (1.15.0).' }
                cli: { type: string, description: 'The same with the tt binary of the kit: tt mock --console ... --group ... (1.15.0).' }
                version: { type: string, description: 'Tag of the image: the tt of the kit should be this version (1.15.0).' }
                helm_values: { type: string }
                helm: { type: string }
                openshift: { type: string }
    ManagedMock:
      type: object
      required: [group, name, token_id, url, created_by, updated_at, pods]
      properties:
        group: { type: string }
        name: { type: string, description: 'Name of the Kubernetes objects (tt-mock-<group>).' }
        namespace: { type: string }
        token_id: { type: string }
        url: { type: string, description: 'Route URL, or the cluster-internal Service URL.' }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        pods:
          type: object
          properties:
            found: { type: boolean }
            ready_replicas: { type: integer }
            replicas: { type: integer }
        error: { type: string }
    MockReport:
      type: object
      required: [instance, group, status, public_url]
      properties:
        instance: { type: string }
        version: { type: string }
        group: { type: string }
        status: { enum: [waiting, serving, error] }
        pack_id: { type: string }
        pack_error: { type: string }
        public_url: { type: string }
        services: { type: array, items: { type: object, properties: { name: { type: string }, alias: { type: string }, base_url: { type: string } } } }
        sessions: { type: array, items: { type: object } }
        calls: { type: array, items: { $ref: "#/components/schemas/MockCall" } }
        dropped_calls: { type: integer }
        results: { type: array, items: { type: object, properties: { id: { type: string }, status: { type: integer }, body: {} } } }
        started_at: { type: string }
    Job:
      type: object
      description: 'Result of a long operation: `done` in its `202` answer when it ended within the server wait, else `queued` (waiting for a heavy slot) or `running`; the job stays readable for a while through GET /api/v1/jobs/{job_id}.'
      required: [job_id, status]
      properties:
        job_id: { type: string }
        kind: { type: string, examples: ["archetypes.build", "world.generate", "pack.build", "rules.mine"] }
        status: { enum: [queued, running, done, failed] }
        result: { type: object }
        progress: { type: object, description: 'Set while a background job runs (store.purge: phase, events, tokens, events_estimated; store.maintenance: phase, done, total).' }
        error: { type: string }
