openapi: 3.1.0
info:
  title: traffic-twin mock control API
  version: 1.5.0
  description: |
    Control plane of `tt-mock` under the `/__tt/` prefix. Normative behaviour (pack verification,
    response building, error envelope, network-fault approximations, status codes, presets) is in
    `docs/spec/mock.md`; entities and rules are in `docs/spec/rules.md`.

    Data plane: every other request is served by the mock. The target service is chosen by the
    `Host` header (matching a service name or `upstream_alias` of the pack) or by the path prefix
    `/__svc/{service}/...`. The session is chosen by the `X-TT-Session` header; without it, the
    request goes to the session `default`, created at startup with the pack seed. A malformed or
    unknown `X-TT-Session` gives `400 bad_session_id` / `404 session_not_found`, never the default session.
    Session per user (1.4.0, `docs/spec/mock.md` §2.6): with `--identity-header` (any header name, optionally
    `--identity-claim` for a claim of the JWT it carries) a request without `X-TT-Session` goes to the session of
    its caller, `u-` followed by 16 hex digits of a keyed hash of the identity, created on first use with a
    synthetic customer chosen by the same hash (or by the identity map). The identity is never stored or journaled.
    Every data-plane response carries `X-TT-Session` with the session that served it. Over `--max-sessions` a new
    identity gets `429 too_many_sessions`.
    Errors generated by the mock (not taken from the contract) use the `Error` envelope; invalid requests
    carry a `pointer` into the virtual document `/path/…`, `/query/…`, `/headers/…`, `/cookies/…`, `/body/…`.

    Security: when `TT_CONTROL_TOKEN` is set, every control call requires `Authorization: Bearer <token>`,
    except `GET /__tt/health`, which is always public and returns only `{"status":"ok"}`. Without a token,
    the mock refuses to start if it would listen on a non-loopback interface; on loopback only, calls without
    a token are accepted (local tests). The mock verifies the pack signature against `TT_GATE_PUBKEYS`, and
    the manifest `not_after` when present, before serving anything.

    1.5.0 (`docs/spec/mock.md` 1.12): fault rules carry `example` and `body` (§4.1); third-party pages (§9:
    `/__tt/pages`, `…/pages/{page}/complete`, `…/pages/{page}/auto`; the pages themselves are served on the
    data plane at `/__pages/{page}`); with `--s3` the data plane also serves a minimal S3-compatible API at
    `/__s3/{bucket}/{key}` and on the `--s3-host` names (§8: any SigV4 signature accepted, no auth check, test
    only); documents and relative dates in answers (§2.9, §2.10). A button of a page can set fields of the object
    the linked answer created, and the return URL can come from the request of that answer (`{link.return}`).
    Request bodies are strict: unknown fields, wrong types and out-of-schema values give `400 bad_request`,
    with a `pointer` into the request body when the field can be identified.
    All data handled by the mock is synthetic.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8480
security:
  - controlToken: []
tags:
  - name: pack
    description: Loaded twin pack, its synthetic customers and scenario presets.
  - name: sessions
    description: Isolated test sessions with their own state, clock and seed.
  - name: clock
    description: Virtual clock of a session.
  - name: faults
    description: Fault and latency injection.
  - name: scenarios
    description: Forced rule outcomes and scenario presets.
  - name: journal
    description: Calls received by the mock.
  - name: pages
    description: Third-party pages (payment, e-signature) with callbacks (1.5.0).
paths:
  /__tt/health:
    get:
      tags: [pack]
      operationId: getHealth
      summary: Get health
      description: Public liveness probe, also when a control token is configured. Reveals nothing beyond "ok".
      security: []
      responses:
        "200":
          description: Mock is up and the pack is verified.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: ok }
  /__tt/pack:
    get:
      tags: [pack]
      operationId: getPack
      summary: Get pack
      responses:
        "200":
          description: Summary of the loaded pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /__tt/customers:
    get:
      tags: [pack]
      operationId: listCustomers
      summary: List customers
      parameters:
        - { name: archetype, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Synthetic customers of the world.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /__tt/scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarioPresets
      summary: List scenario presets
      description: Presets of scenarios.json (docs/spec/pack.md section 6.1), ordered by id; empty when the pack has none.
      responses:
        "200":
          description: Scenario presets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScenarioPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /__tt/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create session
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCreate" }
            example: { seed: 42, customer: CUS-SYN-0007, faults: { mode: observed } }
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown customer or archetype (`customer_not_found`) or preset (`preset_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A session with this id already exists (`session_exists`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Session limit reached (`too_many_sessions`); delete unused sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /__tt/sessions/{session}:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get session
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Delete session
      responses:
        "204": { description: 'Session closed and its state discarded.' }
        "400":
          description: Malformed session id (`bad_session_id`), or the session `default` (`bad_request`), which can only be reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/reset:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    post:
      tags: [sessions]
      operationId: resetSession
      summary: Reset session
      description: Restores the session baseline (docs/spec/mock.md section 5.5) - world state including pending world effects, clock (t0), random generator (same seed), faults and forced outcomes of the baseline; clears the journal.
      responses:
        "200":
          description: Session reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/customer:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    post:
      tags: [sessions]
      operationId: selectCustomer
      summary: Select customer
      description: Entities created from now on belong to this customer; reads with `scope owner` are filtered by it (docs/spec/rules.md section 2.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [customer]
                - required: [archetype]
              properties:
                customer: { type: string, examples: [CUS-SYN-0007] }
                archetype: { type: string, examples: [arch-03] }
      responses:
        "200":
          description: Customer selected; with `archetype`, the first customer of that archetype by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/clock:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    get:
      tags: [clock]
      operationId: getClock
      summary: Get clock
      responses:
        "200":
          description: Current virtual time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/clock/advance:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    post:
      tags: [clock]
      operationId: advanceClock
      summary: Advance clock
      description: Moves the virtual clock forward and applies every due effect in order (pending world effects, then session effects, then batch runs at the same instant). The clock never goes backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [by]
                - required: [to]
              properties:
                by: { $ref: "#/components/schemas/Duration" }
                to: { type: string, format: date-time }
            example: { by: 15m }
      responses:
        "200":
          description: Clock advanced.
          content:
            application/json:
              schema:
                type: object
                required: [now, applied]
                properties:
                  now: { type: string, format: date-time }
                  applied:
                    type: array
                    description: The applied effects in time order, at most the first 1000.
                    items: { $ref: "#/components/schemas/AppliedEffect" }
                  applied_total:
                    type: integer
                    description: Present only when more than 1000 effects were applied (the session state holds all of them).
                  applied_truncated:
                    type: boolean
                    description: Present (true) only when `applied` lists fewer effects than `applied_total`.
        "400":
          description: Invalid body (`bad_request`), `to` in the past (`clock_backwards`), beyond `--max-advance` (`advance_too_large`), or too many steps in one call (`too_many_steps`; the clock stopped at the last applied step).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/faults:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    get:
      tags: [faults]
      operationId: getFaults
      summary: Get faults
      responses:
        "200":
          description: Active fault configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Faults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [faults]
      operationId: setFaults
      summary: Set faults
      description: Service and operation must exist in the contracts (or be `*`). Network error kinds are approximated as in docs/spec/mock.md section 4.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Faults" }
            example:
              mode: custom
              rules:
                - { service: shipping-ext, op: "GET /v1/shipments", status: 503, p: 1.0, times: 1 }
                - { service: shop-api, op: "GET /orders/{id}", status: 409, p: 1.0, times: 1, body: { error: { code: E-LOCKED, message: "Ordine in lavorazione, riprova" } } }
      responses:
        "200":
          description: Faults replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Faults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/pages:
    get:
      tags: [pages]
      operationId: getPages
      summary: Third-party pages (HMAC keys empty)
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [pages]
      operationId: setPages
      summary: Replace the third-party pages
      description: Validated as in docs/spec/mock.md 9.1; an empty HMAC key keeps the current key of the page with the same id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pages" }
      responses:
        "200":
          description: Pages replaced (keys empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pages" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /__tt/sessions/{session}/pages/{page}/complete:
    parameters:
      - { $ref: "#/components/parameters/Session" }
      - { name: page, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' } }
    post:
      tags: [pages]
      operationId: completePage
      summary: Complete a visit without a browser
      description: Opens a visit with the given query values (or takes an open one by id) and completes it with the button; the callback runs before the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string }
                query: { type: object, maxProperties: 64, additionalProperties: { type: string } }
                visit: { type: string, pattern: '^[0-9a-f]{16}$' }
            example: { action: approve, query: { ref: PAY-SYN-0001, amount: "19.90" } }
      responses:
        "200":
          description: Completed (error set when the return URL is not allowed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCompletion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The visit is already completed (`visit_completed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /__tt/sessions/{session}/pages/{page}/auto:
    parameters:
      - { $ref: "#/components/parameters/Session" }
      - { name: page, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' } }
    put:
      tags: [pages]
      operationId: setPageAuto
      summary: Complete every visit of the session at once with a button
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string }
      responses:
        "200": { description: Set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [pages]
      operationId: clearPageAuto
      summary: Show the page again
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/scenario:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    post:
      tags: [scenarios]
      operationId: forceOutcome
      summary: Force outcome or apply preset
      description: |
        With `rule` and `outcome`: forces the outcome of the next N triggers of a rule in this session (appended to the queue).
        With `preset`: resets the session and applies the preset of scenarios.json, which becomes the new baseline of `reset`
        (docs/spec/mock.md section 5.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [rule, outcome]
                  properties:
                    rule: { type: string, pattern: "^r-[0-9]{4,}$" }
                    outcome: { type: string }
                    times: { type: integer, minimum: 1, default: 1 }
                - type: object
                  additionalProperties: false
                  required: [preset]
                  properties:
                    preset: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
            examples:
              outcome:
                value: { rule: r-0007, outcome: cancelled }
              preset:
                value: { preset: shipment-cancelled }
      responses:
        "200":
          description: Scenario queued (and, with `preset`, the session reset to the preset).
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      required: [rule, outcome, remaining]
                      properties:
                        rule: { type: string }
                        outcome: { type: string }
                        remaining: { type: integer }
                  session: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown session, rule (`rule_not_found`), outcome (`outcome_not_found`) or preset (`preset_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /__tt/sessions/{session}/entities:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    get:
      tags: [sessions]
      operationId: listEntities
      summary: List entities
      description: Current state of the entities of the session (for debugging tests). Not filtered by customer.
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [entity, id, state]
                  properties:
                    entity: { type: string }
                    id: { type: string }
                    customer_id: { type: [string, "null"], description: 'Owner of the entity.' }
                    state: { type: object }
                    pending_effects:
                      type: array
                      items:
                        type: object
                        properties:
                          rule: { type: string }
                          outcome: { type: string }
                          effect: { type: string }
                          due: { type: string, format: date-time }
                          source: { enum: [world, session], description: 'world = a pending line of world.jsonl.' }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/journal:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    get:
      tags: [journal]
      operationId: getJournal
      summary: Get journal
      parameters:
        - { name: since, in: query, description: 'Return entries with seq greater than this.', schema: { type: integer, minimum: 0 } }
        - { name: format, in: query, schema: { enum: [jsonl, har], default: jsonl } }
      responses:
        "200":
          description: Calls received by the mock in this session.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/JournalEntry" }
            application/json:
              schema:
                description: HAR 1.2 document when format=har.
                type: object
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /__tt/sessions/{session}/journal/unmatched:
    parameters: [ { $ref: "#/components/parameters/Session" } ]
    get:
      tags: [journal]
      operationId: getUnmatched
      summary: Get unmatched
      responses:
        "200":
          description: Calls that did not match the contract, with the nearest operation, the reason and (for invalid requests) the pointer.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
  parameters:
    Session:
      name: session
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
  responses:
    NotFound:
      description: Unknown session (`session_not_found`), customer or archetype (`customer_not_found`), rule, outcome or preset.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request (`bad_request`, with `pointer` into the request body when identifiable) or malformed session id (`bad_session_id`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong control token (`unauthorized`), only when `TT_CONTROL_TOKEN` is set.
      headers:
        WWW-Authenticate:
          schema: { const: Bearer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Control plane: unauthorized, not_found, method_not_allowed, payload_too_large, bad_request, bad_session_id,
            session_not_found, session_exists, customer_not_found, too_many_sessions, clock_backwards, advance_too_large,
            too_many_steps, rule_not_found, outcome_not_found, preset_not_found.
            Data plane: bad_session_id, session_not_found, payload_too_large, no-service, no-operation, invalid-request,
            not_found, forbidden, http_<status>.
        message: { type: string }
        pointer:
          type: string
          description: JSON Pointer (RFC 6901). Control plane - into the request body. Data plane (`invalid-request`) - into the virtual document /path, /query, /headers, /cookies, /body. Names only, never values.
          examples: [/body/items/0/qty, /query/orderId, /faults/rules/0/p]
    Duration:
      type: string
      pattern: "^[0-9]{1,6}(s|m|h|d)$"
    PackSummary:
      type: object
      required: [pack_id, created_at, services, rules, customers]
      properties:
        pack_id: { type: string }
        created_at: { type: string, format: date-time }
        not_after: { type: [string, "null"], format: date-time }
        services: { type: array, items: { type: string } }
        rules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              outcomes: { type: array, items: { type: string } }
        customers: { type: integer }
        scenarios: { type: array, items: { type: string }, description: 'Ids of the scenario presets.' }
    Customer:
      type: object
      required: [id, profile]
      properties:
        id: { type: string, examples: [CUS-SYN-0007] }
        archetype: { type: [string, "null"] }
        profile: { type: object }
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", description: 'Optional client-chosen id.' }
        seed: { type: integer, minimum: 0 }
        customer: { type: string }
        t0: { type: string, format: date-time, description: 'Initial virtual time; defaults to the pack t0. Pending world effects are relative to it.' }
        faults: { $ref: "#/components/schemas/Faults" }
        scenario: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: 'Preset of scenarios.json giving defaults for seed, customer and faults, plus forced outcomes.' }
    Session:
      type: object
      required: [id, seed, now, faults]
      properties:
        id: { type: string }
        seed: { type: integer }
        customer: { type: [string, "null"] }
        scenario: { type: [string, "null"], description: 'Preset of the session baseline.' }
        now: { type: string, format: date-time }
        faults: { $ref: "#/components/schemas/Faults" }
        by_identity: { type: boolean, description: 'Chosen by the caller''s identity (1.4.0): its id is a keyed hash, never the identity.' }
    Clock:
      type: object
      required: [now, t0]
      properties:
        now: { type: string, format: date-time }
        t0: { type: string, format: date-time }
        next_due: { type: [string, "null"], format: date-time, description: 'Next queued effect (world or session); batch runs are not included.' }
    AppliedEffect:
      type: object
      required: [at, rule, effect, entity, id]
      properties:
        at: { type: string, format: date-time }
        rule: { type: string }
        outcome: { type: string }
        effect: { type: string }
        entity: { type: string }
        id: { type: string }
    Faults:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          description: "observed = frequencies from faults.json; off = never inject; custom = only the given rules."
          enum: [observed, off, custom]
        rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [service, op, p]
            not: { required: [status, net_error] }
            properties:
              service: { type: string, description: 'Service name, alias or `*`.' }
              op: { type: string, description: 'Operation (`GET /v1/shipments`) or `*`.' }
              status: { type: integer, minimum: 100, maximum: 599 }
              net_error: { enum: [timeout, reset, refused, dns, tls, other], description: 'Approximations in docs/spec/mock.md section 4.' }
              latency_ms: { type: integer, minimum: 0 }
              p: { type: number, minimum: 0, maximum: 1 }
              times: { type: integer, minimum: 1, description: 'Stop after this many injections.' }
              example: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', description: 'With status (1.5.0): a named example of the contract for that status (it must exist).' }
              body: { type: [object, array, string], description: 'With status (1.5.0): an error body typed by a person, served as it is; wins over example; at most 16 KiB (docs/spec/mock.md 4.1).' }
    Page:
      type: object
      description: A third-party page (docs/spec/mock.md 9.1).
      additionalProperties: false
      required: [id, title, buttons]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        ref: { type: string, maxLength: 2048, description: 'Template of the reference of a visit; default the ref query parameter, else REF-SYN-NNNN.' }
        show: { type: array, items: { type: string }, description: Query parameters shown on the page. }
        return_url: { type: string, maxLength: 2048, description: 'Template of the return URL; a host from a placeholder needs return_hosts.' }
        return_hosts: { type: array, items: { type: string } }
        buttons:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [action, label]
            properties:
              action: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
              label: { type: string, maxLength: 60 }
              values: { type: object, additionalProperties: { type: string, maxLength: 200 } }
              no_callback: { type: boolean }
              set:
                type: object
                maxProperties: 32
                description: 'Fields of the linked object (links[].entity, or the static object the linked create made) written when this button is chosen; dotted paths, scalar values, strings take the placeholders (docs/spec/mock.md 9.1).'
                additionalProperties: { type: [string, number, boolean, "null"] }
        callback:
          type: object
          additionalProperties: false
          required: [method, url]
          properties:
            method: { enum: [GET, POST, PUT, PATCH, DELETE] }
            url: { type: string, description: 'Fixed http(s)://host/; placeholders only in path and query.' }
            headers: { type: object, additionalProperties: { type: string } }
            body: { type: string, maxLength: 16384 }
            body_type: { enum: [json, form, text] }
            hmac:
              type: object
              additionalProperties: false
              required: [header, key]
              properties:
                header: { type: string }
                key: { type: string, description: 'Test key, 8 to 256 characters; empty in answers; empty in a PUT keeps the current key of the page.' }
                algorithm: { enum: [sha256, sha1, sha512] }
                encoding: { enum: [hex, base64] }
                prefix: { type: string, maxLength: 32 }
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [service, op, path]
            properties:
              service: { type: string }
              op: { type: string }
              path: { type: string, description: 'tt-path in the answer body where the page URL goes.' }
              ref_path: { type: string }
              base_url: { type: string }
              return_from:
                type: object
                additionalProperties: false
                required: [from]
                description: 'Where the request of the linked operation carries the return URL of the application: the {link.return} placeholder.'
                properties:
                  from: { enum: [req.body, req.query, req.headers] }
                  path: { type: string, description: 'With req.body: a body path like $.returnUrl.' }
                  name: { type: string, description: 'With req.query or req.headers.' }
              entity: { type: string, pattern: '^[a-z][a-z0-9_-]{0,62}$', description: 'Entity of the rules whose object (id at ref_path) the buttons set changes; absent: the static object the create made.' }
        auto: { type: object, additionalProperties: { type: string }, description: 'Scenario preset id (or *) -> button completing the visit at once.' }
    Pages:
      type: object
      additionalProperties: false
      required: [pages]
      properties:
        pages: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/Page" } }
    PageCompletion:
      type: object
      properties:
        visit: { type: string }
        page: { type: string }
        ref: { type: string }
        action: { type: string }
        return_url: { type: string }
        callback:
          type: object
          properties:
            method: { type: string }
            url: { type: string }
            status: { type: integer }
            error: { type: string }
            body: { type: string, description: First 4 KiB of the answer. }
        changed: { type: string, description: 'The linked object the button changed ("<entity> <id>" or "static <id>").' }
        error: { type: string, description: 'The return URL could not be computed (host not allowed).' }
    ScenarioPreset:
      type: object
      description: One preset of scenarios.json (schemas/pack-manifest.v1.schema.json $defs/scenarios).
      required: [id, name]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string }
        description: { type: string }
        customer: { type: string }
        archetype: { type: string }
        seed: { type: integer, minimum: 0 }
        faults: { $ref: "#/components/schemas/Faults" }
        outcomes:
          type: array
          items:
            type: object
            required: [rule, outcome]
            properties:
              rule: { type: string }
              outcome: { type: string }
              times: { type: integer, minimum: 1 }
    JournalEntry:
      type: object
      required: [seq, at, wall, service, method, path, matched]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time, description: 'Virtual time.' }
        wall: { type: string, format: date-time }
        service: { type: [string, "null"] }
        op: { type: [string, "null"] }
        method: { type: string }
        path: { type: string }
        status: { type: [integer, "null"], description: 'null for a network fault.' }
        matched: { type: boolean }
        reason: { enum: [no-service, no-operation, invalid-request, payload_too_large], description: "When unmatched. `payload_too_large` is a call refused before dispatch because the body exceeds `--max-body` (413); the other three are answered by the mock as described in docs/spec/mock.md section 3." }
        pointer: { type: string, description: 'For invalid-request: JSON Pointer into /path, /query, /headers, /cookies, /body.' }
        nearest_op: { type: string }
        fault:
          type: object
          properties:
            status: { type: integer }
            net_error: { enum: [timeout, reset, refused, dns, tls, other] }
            latency_ms: { type: integer }
        triggered:
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              outcome: { type: string }
        request: { type: object }
        response: { type: object }
