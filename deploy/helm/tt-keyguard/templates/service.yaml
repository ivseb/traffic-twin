apiVersion: v1
kind: Service
metadata:
  name: {{ include "tt-keyguard.fullname" . }}
  labels:
    {{- include "tt-keyguard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tt-keyguard.selectorLabels" . | nindent 4 }}
  ports:
    - name: keyguard
      port: {{ .Values.service.port }}
      targetPort: keyguard
      protocol: TCP
