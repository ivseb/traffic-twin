{{- if .Values.networkPolicy.enabled }}
{{- $eg := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tt-keyguard.fullname" . }}
  labels:
    {{- include "tt-keyguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tt-keyguard.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Only tt-core may connect (and it must still present the pinned client certificate).
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "tt-keyguard.port" . }}
  # keyguard makes no outbound calls (THREAT_MODEL M11): no rule, no egress, except what you list for an
  # alert webhook or an OIDC JWKS URL.
  egress:
    {{- if $eg.dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml $eg.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $eg.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range $eg.allowed }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .port | default 443 }}
    {{- end }}
    {{- if and (not $eg.dns.enabled) (not $eg.allowed) }}
    []
    {{- end }}
{{- end }}
