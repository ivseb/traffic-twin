{{- $port := int .Values.listenPort }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tt-egress.fullname" . }}
  labels:
    {{- include "tt-egress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tt-egress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tt-egress.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tt-egress.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - {{- include "tt-egress.container" (dict "ctx" . "port" $port) | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /_tt/health
              port: proxy
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_tt/health
              port: proxy
            {{- toYaml .Values.probes.readiness | nindent 12 }}
      volumes:
        {{- include "tt-egress.volumes" (dict "ctx" . "configMap" (include "tt-egress.fullname" .)) | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
