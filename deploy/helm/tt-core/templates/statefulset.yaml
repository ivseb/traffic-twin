apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tt-core.fullname" . }}
  labels:
    {{- include "tt-core.labels" . | nindent 4 }}
spec:
  # One replica: the store is a single SQLite file.
  replicas: 1
  serviceName: {{ include "tt-core.fullname" . }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "tt-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tt-core.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tt-core.serviceAccountName" . }}
      # The token is mounted only to start the mocks (mockManager): a Role in the mock namespace, nothing else.
      automountServiceAccountToken: {{ .Values.mockManager.enabled }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: tt-core
          image: {{ include "tt-core.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["core"]
          env:
            - name: TT_CORE_CONFIG
              value: /etc/tt/config/config.yaml
            {{- if .Values.oidcClientSecret.existingSecret }}
            - name: TT_CORE_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidcClientSecret.existingSecret }}
                  key: {{ .Values.oidcClientSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: admin
              containerPort: {{ include "tt-core.adminPort" . }}
              protocol: TCP
            - name: intake
              containerPort: {{ include "tt-core.intakePort" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
              scheme: HTTPS
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
              scheme: HTTPS
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/tt/config
              readOnly: true
            - name: tls
              mountPath: /etc/tt/tls
              readOnly: true
            - name: keyguard-client
              mountPath: /etc/tt/keyguard-client
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: {{ include "tt-core.fullname" . }}
            defaultMode: 0444
        - name: tls
          secret:
            secretName: {{ include "tt-core.tlsSecretName" . }}
            defaultMode: 0440
        - name: keyguard-client
          secret:
            secretName: {{ .Values.keyguard.clientTLSSecret }}
            defaultMode: 0440
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "tt-core.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
