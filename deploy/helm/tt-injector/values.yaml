# tt injector: mutating admission webhook for pods annotated
#   traffic-twin.io/inject: node | python | java | dotnet | go | php
# It adds an init container that copies the SDK into a shared emptyDir, the language start-up wiring and the TT_*
# environment, and coexists with the OpenTelemetry Operator injection (it never touches OTEL_* variables).
#
# Install it in a namespace of its own (for example tt-system); that namespace is not instrumented.

image:
  repository: ghcr.io/ivseb/traffic-twin
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

replicaCount: 2

# -- SDK init images (deploy/images/sdk-<lang>), by language. A language without image is refused with a warning.
# go and php need none: for them the injector only provides the TT_* environment.
sdkImages:
  node: ghcr.io/ivseb/traffic-twin/sdk-node:0.1.0
  python: ghcr.io/ivseb/traffic-twin/sdk-python:0.1.0
  java: ghcr.io/ivseb/traffic-twin/sdk-java:0.1.0
  dotnet: ghcr.io/ivseb/traffic-twin/sdk-dotnet:0.1.0
sdkPullPolicy: IfNotPresent

# -- Defaults looked up in the namespace of the pod being created (overridable per pod with the annotations
# traffic-twin.io/enroll-secret and traffic-twin.io/hmac-secret). The Secrets are optional: if they are missing the pod
# starts normally and the SDK stays inert.
#   enroll secret: keys `url` (https://<tt-core intake>:4318) and `token` (tte_<secret>.<CA pin>)
#   hmac secret:   key  `hmac-key` (lines <kid>:<base64url>)
enrollSecret: tt-enroll
hmacSecret: tt-hmac
# -- File mode of the HMAC key volume, octal. 0444 works for any uid of the application; use 0440 together with a pod fsGroup.
hmacMode: "0444"

# -- Deny (instead of allow with a warning) pods annotated with an unknown language. Off: the webhook never blocks a deployment.
denyUnknown: false
logLevel: info

webhook:
  name: injector.traffic-twin.io
  # -- Ignore: if the injector is down or slow, pods are created without the SDK. Do not change it to Fail.
  failurePolicy: Ignore
  timeoutSeconds: 3
  # -- IfNeeded: called again when another webhook (for example the OpenTelemetry Operator) changed the pod. Idempotent.
  reinvocationPolicy: IfNeeded
  # -- Call the webhook only for pods that carry the traffic-twin.io/inject annotation (CEL matchConditions,
  # Kubernetes >= 1.28). On older clusters the webhook is called for every pod and answers "not annotated".
  useMatchConditions: true
  # -- Namespaces never sent to the webhook, plus the namespace of this release when excludeReleaseNamespace.
  excludeNamespaces: [kube-system, kube-public, kube-node-lease]
  excludeReleaseNamespace: true
  # -- Extra namespaceSelector requirements (matchLabels / matchExpressions), for example opt-in by label.
  namespaceSelector: {}
  objectSelector: {}

tls:
  # -- helm: certificate generated by Helm (kept across upgrades); certManager: Issuer+Certificate, caBundle injected
  # by cert-manager; existing: your Secret and caBundle.
  mode: helm
  validityDays: 825
  # -- mode=existing: Secret (kubernetes.io/tls) and the PEM CA that signed it (base64 of the PEM goes in caBundle).
  existingSecret: ""
  caBundle: ""
  certManager:
    # -- Empty: a self-signed Issuer is created by the chart.
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io

service:
  port: 443

# -- Ingress only on the webhook port (the API server has no stable pod identity), no egress at all.
networkPolicy:
  enabled: true
  # -- Who may call the webhook. Default: any source (the API server runs outside the pod network on most clusters).
  from: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 15
