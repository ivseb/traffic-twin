apiVersion: v1
kind: Service
metadata:
  name: {{ include "tt-injector.fullname" . }}
  labels:
    {{- include "tt-injector.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tt-injector.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tt-injector.serviceAccountName" . }}
  labels:
    {{- include "tt-injector.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tt-injector.fullname" . }}
  labels:
    {{- include "tt-injector.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tt-injector.selectorLabels" . | nindent 6 }}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tt-injector.fullname" . }}
  labels:
    {{- include "tt-injector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tt-injector.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # The injector makes no outbound call.
  egress: []
{{- end }}
