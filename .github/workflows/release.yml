name: release

# Triggered by a version tag (vX.Y.Z, vX.Y.Z-rc.N). It
#   1. re-verifies the tagged commit;
#   2. runs goreleaser: archives, checksums, SBOMs (syft), cosign keyless
#      signature of the checksums, multi-arch image on ghcr.io signed with
#      cosign, and a DRAFT GitHub release;
#   3. generates SLSA level 3 provenance of the archives (slsa-github-generator)
#      and attaches it to the draft release;
#   4. dry-runs the packaging of every SDK (nothing is published).
# Publishing the draft release is MANUAL; publishing it triggers publish-sdks.yml, which
# publishes the SDK packages. See RELEASING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned by commit SHA (the tag is in the comment).
# The one exception is the SLSA generator below: its reusable workflow must be
# referenced by tag, which is how provenance verifiers identify the builder.
jobs:
  verify:
    name: verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: go
        run: make fmt-check vet build-all test race vectors
      # A release must never ship the demo data of the mock adapter.
      - name: ui (production bundle without demo or mock code)
        run: scripts/ui-build-check.sh

  goreleaser:
    name: goreleaser (archives, SBOM, image, signatures)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # creates the draft release and uploads the assets
      id-token: write # cosign keyless signing (OIDC identity of this workflow)
      packages: write # pushes ghcr.io/ivseb/traffic-twin
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # goreleaser needs the tags to compute the version and the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Subjects of the SLSA provenance: "sha256  file" lines, base64 encoded.
      # checksums.txt lists every archive (and SBOM) with that very format.
      - name: provenance subjects
        id: hash
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: slsa provenance
    needs: goreleaser
    permissions:
      actions: read # the generator reads the workflow run
      id-token: write # signs the provenance with the OIDC identity
      contents: write # uploads the provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
      draft-release: "true" # goreleaser creates the release as a draft (.goreleaser.yaml)

  sdk-dry-run:
    name: sdk packaging dry-run (${{ matrix.sdk }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, java, dotnet, php, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.sdk == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: matrix.sdk == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: matrix.sdk == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # PHP: composer is preinstalled on the runner image.
      - name: package (dry-run, nothing is published)
        env:
          SDK: ${{ matrix.sdk }}
        run: scripts/sdk-package.sh "$SDK" "$RUNNER_TEMP/sdk-$SDK"
      - name: keep the packages for inspection
        if: matrix.sdk != 'php' && matrix.sdk != 'go'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.sdk }}
          path: ${{ runner.temp }}/sdk-${{ matrix.sdk }}
          retention-days: 14
          if-no-files-found: error
