name: ci

# Pull requests and pushes to main run only the jobs the change touches (see
# scripts/ci-changes.sh); the weekly schedule and a manual run run everything.
# `make ci-local` runs the same checks on a developer machine.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC: full run, also catches upstream drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Third-party actions are pinned by commit SHA (the tag is in the comment).
jobs:
  changes:
    name: changes (which jobs to run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
      ui: ${{ steps.c.outputs.ui }}
      build: ${{ steps.c.outputs.build }}
      sdk_go: ${{ steps.c.outputs.sdk_go }}
      sdk_node: ${{ steps.c.outputs.sdk_node }}
      sdk_python: ${{ steps.c.outputs.sdk_python }}
      sdk_java: ${{ steps.c.outputs.sdk_java }}
      sdk_dotnet: ${{ steps.c.outputs.sdk_dotnet }}
      sdk_php: ${{ steps.c.outputs.sdk_php }}
      release: ${{ steps.c.outputs.release }}
      workflows: ${{ steps.c.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) scripts/ci-changes.sh "$PR_BASE" "$HEAD_SHA" ;;
            push) scripts/ci-changes.sh "$PUSH_BASE" "$HEAD_SHA" ;;
            *) scripts/ci-changes.sh ;; # schedule, workflow_dispatch: everything
          esac | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ core

  go:
    name: go (fmt, vet, build, test, race, vectors)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go.mod tidy
        run: make tidy-check
      - name: vet
        run: make vet
      - name: build (CGO_ENABLED=0)
        run: make build-all
      - name: test
        run: make test
      - name: test, race detector on the concurrent packages
        run: make race
      - name: conformance vectors (reference generator)
        run: make vectors

  ui:
    name: ui (check, test, prod and demo builds, no demo code in prod)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci, check, test, builds, forbidden strings
        run: scripts/ui-build-check.sh

  build:
    name: build (make build, smoke test)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: make build
        run: make build
      - name: smoke test
        run: scripts/smoke.sh bin/tt

  # ------------------------------------------------------------------ SDKs
  # Every SDK job runs the conformance vectors first, then its own test suite.
  # The commands live in scripts/sdk-test.sh, shared with `make ci-local`.

  sdk-go:
    name: sdk-go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.sdk_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # "." is sdk/go inside the root module; the others are nested modules
        # with their own go.mod, which `go test ./...` at the root does not run.
        module: [".", gin, chi, otelctx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go/*/go.sum
      - name: conformance vectors
        env:
          MODULE: ${{ matrix.module }}
        run: scripts/sdk-test.sh go vectors "$MODULE"
      - name: test
        env:
          MODULE: ${{ matrix.module }}
        run: scripts/sdk-test.sh go test "$MODULE"

  sdk-node:
    name: sdk-node (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.sdk_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: install
        run: scripts/sdk-test.sh node setup
      - name: conformance vectors
        run: scripts/sdk-test.sh node vectors
      - name: typecheck, unit and integration tests
        # Before Node 24 undici has no body chunk diagnostics channels, so fetch
        # bodies are not captured and integration tests fail: 2 on Node 20
        # (capture.test.mjs "inbound and outbound exchanges...", fleet.test.mjs
        # "tt.s baggage..."), 1 on Node 22.23. Known limitation.
        # The vectors above stay mandatory
        # on every version. Remove continue-on-error once the minimum is decided.
        continue-on-error: ${{ matrix.node != 24 }}
        run: scripts/sdk-test.sh node test

  sdk-python:
    name: sdk-python (python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }} # 3.9 (EOL) is not built for newer Ubuntu images
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: optional test dependencies
        run: scripts/sdk-test.sh python setup
      - name: conformance vectors
        run: scripts/sdk-test.sh python vectors
      - name: tests
        run: scripts/sdk-test.sh python test

  sdk-java:
    name: sdk-java (jdk ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.sdk_java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: sdk/java/**/pom.xml
      - name: conformance vectors
        run: scripts/sdk-test.sh java vectors
      - name: verify (unit, integration, short benchmark)
        run: scripts/sdk-test.sh java test

  sdk-dotnet:
    name: sdk-dotnet (.NET ${{ matrix.dotnet }})
    needs: changes
    if: needs.changes.outputs.sdk_dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "8.0.x"
            roll_forward: Minor
          # The projects target net8.0: the newer runtime runs them by rolling forward.
          - dotnet: "10.0.x"
            roll_forward: LatestMajor
    env:
      DOTNET_ROLL_FORWARD: ${{ matrix.roll_forward }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: dotnet on PATH
        # The zero-code tests start `dotnet` child processes (DOTNET_STARTUP_HOOKS); they resolve it from PATH.
        run: |
          command -v dotnet
          dotnet --list-runtimes
      - name: restore
        run: scripts/sdk-test.sh dotnet setup
      - name: conformance vectors
        run: scripts/sdk-test.sh dotnet vectors
      - name: tests
        run: scripts/sdk-test.sh dotnet test

  sdk-php:
    name: sdk-php (php ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.sdk_php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests run in the official php:<version>-cli image (sdk/php/scripts/test.sh).
      - name: conformance vectors
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: scripts/sdk-test.sh php vectors "$PHP_VERSION"
      - name: composer install, phpunit
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: scripts/sdk-test.sh php test "$PHP_VERSION"

  # ------------------------------------------------------------------ release configuration

  release-config:
    name: release config (goreleaser check and snapshot, docker build)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
      - name: snapshot release (nothing is published or signed)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=publish,sign,sbom
      - name: docker build of the self-contained Dockerfile
        run: |
          docker build --build-arg VERSION=ci -t traffic-twin:ci .
          docker run --rm traffic-twin:ci version

  workflows:
    name: workflows (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: make actionlint

  # Single required check for branch protection: skipped jobs count as passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - go
      - ui
      - build
      - sdk-go
      - sdk-node
      - sdk-python
      - sdk-java
      - sdk-dotnet
      - sdk-php
      - release-config
      - workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
