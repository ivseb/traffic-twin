name: pages

# Builds the product site and documentation (site/, VitePress) and publishes it
# on GitHub Pages at https://ivseb.github.io/traffic-twin/.
# The Italian reference pages are generated at build time from docs/ and the
# root Markdown files (site/scripts/sync-docs.mjs), so changes there rebuild
# the site too. One-time repository setting: Settings > Pages > Source:
# GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "RELEASING.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a
# deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned by commit SHA (the tag is in the comment).
jobs:
  build:
    name: build (VitePress)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: npm ci
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: build
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    name: deploy (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token that authenticates the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
